<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>🎾 EDTU TENNIS</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#06120a;overflow:hidden;font-family:Consolas,"Courier New",monospace;color:#eaf6ff}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:20px;background:radial-gradient(circle at 50% 30%,#123722 0%,#05100a 72%);overflow-y:auto;justify-content:flex-start}
  .screen::before,.screen::after{content:"";margin:auto;flex:0 0 0}
  .screen>*{flex-shrink:0;max-width:100%}
  .hide{display:none}
  h1{font-size:clamp(26px,7vw,52px);margin:0 0 4px;letter-spacing:.16em;color:#d8ff7a;text-shadow:0 0 24px rgba(160,255,90,.45)}
  h2{font-size:clamp(12px,3vw,16px);margin:0 0 14px;color:#8fd0a8;letter-spacing:.24em;font-weight:700}
  .btn{background:linear-gradient(180deg,#1a4a2c,#0d2a19);border:1px solid rgba(180,255,140,.45);color:#d8ff7a;
    border-radius:12px;padding:11px 20px;font:800 16px Consolas,monospace;cursor:pointer;letter-spacing:.06em;margin:4px}
  .btn:hover{background:linear-gradient(180deg,#246138,#113520)}
  .btn.go{background:linear-gradient(180deg,#2f8f4a,#175c2e);color:#f2ffe0}
  .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
  .opt{background:#0d2a19;border:1px solid rgba(180,255,140,.3);color:#9fd8b4;border-radius:9px;padding:6px 13px;
    font:700 13px Consolas,monospace;cursor:pointer}
  .opt.sel{background:#d8ff7a;color:#0d2a19;border-color:#d8ff7a}
  .ayuda{color:#93b7a4;font-size:clamp(11px,2.6vw,13px);line-height:1.9;max-width:min(680px,94vw);margin-top:14px}
  .ayuda b{color:#d8ff7a}
  .k{display:inline-block;background:#0d2a19;border:1px solid rgba(180,255,140,.35);border-radius:5px;padding:0 6px;color:#d8ff7a}
  #salirBtn{position:fixed;top:12px;right:14px;z-index:20;background:rgba(6,18,10,.8);border:1px solid rgba(180,255,140,.35);
    color:#d8ff7a;border-radius:10px;padding:6px 12px;font:700 15px Consolas,monospace;cursor:pointer}
  #tactil{position:fixed;inset:0;z-index:8;pointer-events:none}
  #tactil.off{display:none}
  .tb{position:absolute;width:clamp(52px,13vw,74px);height:clamp(52px,13vw,74px);border-radius:50%;pointer-events:auto;
    background:radial-gradient(circle at 50% 32%,rgba(40,110,60,.85),rgba(8,26,14,.9));border:2px solid rgba(180,255,140,.5);
    color:#d8ff7a;font:800 clamp(10px,2.6vw,13px)/1.1 Consolas,monospace;cursor:pointer}
  .tb.on{background:#d8ff7a;color:#0d2a19}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="salirBtn">✕ Salir</button>

<div id="tactil" class="off">
  <button class="tb" id="tPlano"  style="right:14%;bottom:24%">PLANO</button>
  <button class="tb" id="tLift"   style="right:4%;bottom:10%">LIFT</button>
  <button class="tb" id="tCorte"  style="right:26%;bottom:10%">CORTE</button>
  <button class="tb" id="tGlobo"  style="right:14%;bottom:38%">GLOBO</button>
</div>

<div class="screen" id="intro">
  <h1>🎾 EDTU TENNIS</h1>
  <h2>CENTRAL COURT</h2>
  <div class="row" id="optDif"></div>
  <div class="row" id="optSets"></div>
  <div class="row" id="optCal"></div>
  <div class="row"><button class="btn go" id="jugarBtn">▶ JUGAR</button></div>
  <div class="ayuda" id="ayudaTxt"></div>
  <div class="ayuda" id="mejorTxt" style="color:#d8ff7a"></div>
</div>

<div class="screen hide" id="fin">
  <h1 id="finTit">FIN</h1>
  <div class="ayuda" id="finTxt" style="font-size:clamp(13px,3.2vw,17px)"></div>
  <div class="row"><button class="btn go" id="otraBtn">▶ OTRA VEZ</button><button class="btn" id="menuBtn">✕ AL CUARTEL</button></div>
</div>

<script>
/* ============================================================================
   🎾 EDTU TENNIS — pista central, cámara alta detrás del jugador.
   Los mandos son los de AO Tennis 2: cada golpe tiene su botón, se MANTIENE
   para cargar y se SUELTA para pegar, y mientras cargas apuntas con la
   dirección. El saque es en dos tiempos: uno para lanzar y otro para golpear.
   Todo lo que se ve está dibujado aquí: no hay ni una imagen de fuera.
   ============================================================================ */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
/* 📱 ¿se juega con el DEDO? Se pregunta por el puntero principal ("coarse" = un dedo), no por si
      la pantalla acepta toques: un portátil con pantalla táctil sigue siendo un ordenador con teclado */
const ES_TACTIL=()=>!!(window.matchMedia&&window.matchMedia("(pointer: coarse)").matches);
let W=0,H=0,CX=0,CY=0,FOV=900;
/* 🖥️ LA CALIDAD: cuántos píxeles tiene el lienzo POR DENTRO.
      · NORMAL: los de tu pantalla
      · ALTA:   1,5 veces más (o los de tu pantalla si ya es de alta densidad)
      · 2K:     por lo menos 2560×1440, sea cual sea tu pantalla. En una de 1080p se dibuja a
                2560×1440 y el navegador lo encoge: todo sale más fino, sin dientes de sierra.
                Tope: 4K de ancho y 3 veces la pantalla, para no fundir el ordenador */
const CALIDADES={ normal:{nom:"NORMAL"}, alta:{nom:"ALTA"}, k2:{nom:"2K"} };
let CALIDAD=(()=>{
  try{ const c=localStorage.getItem("edtu_ten_cal"); if(c&&CALIDADES[c]) return c; }catch(e){}
  return ES_TACTIL() ? "alta" : "k2";                            /* en el celular, ALTA para no gastar batería */
})();
function escalaRender(calidad, anchoCss, altoCss, dpr){
  const d=dpr||1, a=Math.max(1,anchoCss), h=Math.max(1,altoCss);
  const normal=Math.min(1.25,d);
  /* ALTA: un cuarto más que la pantalla (o el doble en los celulares), sin pasar de 4K de ancho */
  const alta=Math.max(normal, Math.min(2, Math.max(1.25,d), 3840/a));
  if(calidad==="normal") return normal;
  if(calidad==="alta") return alta;
  /* 2K: nunca menos que ALTA, y por lo menos 2560×1440 */
  return Math.max(alta, Math.min(Math.max(2560/a, 1440/h), 3840/a, 3));
}
/* si con la calidad elegida el juego va a tirones, se baja un escalón sola */
const RENDIMIENTO={ lento:0 };
function vigilaRendimiento(ms){
  if(!G.run || !(ms>0) || ms>250) return;                   /* pestaña escondida: no cuenta */
  if(ms>26) RENDIMIENTO.lento+=ms/1000; else RENDIMIENTO.lento=Math.max(0,RENDIMIENTO.lento-ms/2000);
  if(RENDIMIENTO.lento>2.5){
    RENDIMIENTO.lento=0;
    const orden=["k2","alta","normal"], i=orden.indexOf(CALIDAD);
    if(i>=0 && i<orden.length-1){
      CALIDAD=orden[i+1]; resize();
      G.msg="🖥️ bajé la calidad a "+CALIDADES[CALIDAD].nom+" para que vaya fluido"; G.msgT=2.6;
    }
  }
}
function resize(){ const d=escalaRender(CALIDAD, innerWidth, innerHeight, window.devicePixelRatio||1);
  W=cv.width=Math.round(innerWidth*d); H=cv.height=Math.round(innerHeight*d);
  cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px";
  CX=W/2; CY=H*0.50; FOV=Math.min(W,H)*1.25; }
addEventListener("resize",resize); resize();

/* ---------- la pista, en metros de verdad ---------- */
const LARGO=23.77, ANCHO=8.23, DOBLES=10.97, RED_Z=LARGO/2, SAQUE=6.40, RED_ALTO=0.914, RED_CENTRO=0.914;
const G_GRAV=9.81;

/* ---------- la cámara: detrás del jugador de abajo, alta y mirando hacia el fondo ---------- */
/* 🎥 la cámara de la tele: 12,5 m de alto, 14 m detrás de tu línea de fondo y mirando hacia
      abajo. Con la de antes (7,4 m y 9,2 m) tus pies caían FUERA de la pantalla y solo se te
      veía la gorra. Ahora: la línea de fondo del rival queda al 21% de la altura, la tuya al 73%,
      y tu jugador se ve entero desde la línea hasta 4 m por detrás */
const CAM={ x:0, y:12.5, z:-14, pitch:0.55 };
function proyecta(x,y,z){
  const dx=x-CAM.x, dy=y-CAM.y, dz=z-CAM.z;
  const c=Math.cos(CAM.pitch), s=Math.sin(CAM.pitch);
  const cy= dy*c + dz*s;                       /* arriba de la cámara */
  const cz= dz*c - dy*s;                       /* hacia dónde mira */
  if(cz<0.25) return null;
  return { x:CX+dx/cz*FOV, y:CY-cy/cz*FOV, z:cz, s:FOV/cz };
}

/* ---------- el partido ---------- */
const PTS=["0","15","30","40"];
const DIFS={ facil:{nom:"FÁCIL",vel:5.6,reac:0.46,err:0.16,pot:0.86},
             normal:{nom:"NORMAL",vel:6.6,reac:0.30,err:0.10,pot:1.0},
             dificil:{nom:"DIFÍCIL",vel:7.6,reac:0.18,err:0.05,pot:1.12} };
const G={ dif:"normal", sets:1, run:false, fin:false, t:0,
  pts:[0,0], juegos:[0,0], sets_g:[0,0], saca:0, ventaja:-1,
  jug:null, ia:null, bola:null, estado:"saque", msg:"", msgT:0,
  boteX:0, boteZ:0, ultimo:-1, rally:0, rallyMax:0, aces:0, winners:0 };

function nuevoJugador(lado){
  return { lado, x:0, z: lado===0? -1.4 : LARGO+1.4, vx:0, vz:0,
    swing:0, tipo:"plano", carga:0, cargando:false, mira:0, paso:0, guardado:null,
    prep:0, ultimoGolpe:0, dirRaqueta:1 };
}
function nuevaBola(){ return { x:0,y:1,z:0, vx:0,vy:0,vz:0, giro:0, viva:false, botes:0, lado:0, estela:[] }; }

function nuevoPartido(){
  G.pts=[0,0]; G.juegos=[0,0]; G.sets_g=[0,0]; G.saca=0; G.ventaja=-1;
  G.jug=nuevoJugador(0); G.ia=nuevoJugador(1); G.bola=nuevaBola();
  G.estado="saque"; G.t=0; G.rally=0; G.rallyMax=0; G.aces=0; G.winners=0; G.fin=false;
  preparaSaque();
}
function preparaSaque(){
  const s=G.saca, sacador = s===0?G.jug:G.ia, resto = s===0?G.ia:G.jug;
  const par=(G.pts[0]+G.pts[1])%2===0;                 /* derecha si van pares */
  const ladoX=(par?1:-1)*(s===0?1:-1)*ANCHO*0.26;
  sacador.x=ladoX*(s===0?1:1); sacador.z = s===0? -0.7 : LARGO+0.7;
  resto.x=-ladoX*0.8; resto.z = s===0? LARGO+1.6 : -1.6;
  G.bola=nuevaBola();
  G.bola.x=sacador.x; G.bola.z=sacador.z; G.bola.y=1.0;
  G.estado="saque"; G.saqueFase=0; G.saqueT=0; G.rally=0;
  if(s===1) G.iaSaqueT=0.8+Math.random()*0.5;
}

/* ---------- mandos: teclado, mando y pantalla táctil ---------- */
const K={}, EDGE={};
const TIPOS={ plano:{nom:"PLANO", pot:1.00, giro: 0.0, alto:0.95},
              lift: {nom:"LIFTADO", pot:0.92, giro: 1.0, alto:1.35},
              corte:{nom:"CORTADO", pot:0.80, giro:-0.8, alto:0.85},
              globo:{nom:"GLOBO", pot:0.66, giro: 0.5, alto:2.60} };
const TECLA_TIPO={ j:"plano", k:"lift", l:"corte", i:"globo" };
addEventListener("keydown",e=>{ const k=e.key.toLowerCase();
  if(!K[k]) EDGE[k]=true;
  K[k]=true;
  if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k)) e.preventDefault();
  if(k==="escape") salir();
});
addEventListener("keyup",e=>{ K[e.key.toLowerCase()]=false; });
const TACT={};
function botonTactil(id,tipo){ const b=$(id); if(!b) return;
  const on=e=>{ e.preventDefault(); b.classList.add("on"); TACT[tipo]=true; };
  const off=e=>{ if(e) e.preventDefault(); b.classList.remove("on"); TACT[tipo]=false; };
  b.addEventListener("touchstart",on,{passive:false}); b.addEventListener("touchend",off,{passive:false});
  b.addEventListener("touchcancel",off,{passive:false});
  b.addEventListener("mousedown",on); addEventListener("mouseup",off);
}
botonTactil("tPlano","plano"); botonTactil("tLift","lift"); botonTactil("tCorte","corte"); botonTactil("tGlobo","globo");
/* arrastrar por la mitad izquierda mueve al jugador */
let dedo=null;
cv.addEventListener("touchstart",e=>{ const t=e.changedTouches[0]; if(t.clientX>innerWidth*0.55) return;
  dedo={id:t.identifier,x:t.clientX,y:t.clientY,dx:0,dy:0}; e.preventDefault(); },{passive:false});
cv.addEventListener("touchmove",e=>{ if(!dedo) return;
  for(const t of e.touches) if(t.identifier===dedo.id){ dedo.dx=(t.clientX-dedo.x)/60; dedo.dy=(t.clientY-dedo.y)/60; }
  e.preventDefault(); },{passive:false});
const sueltaDedo=e=>{ if(dedo) for(const t of e.changedTouches) if(t.identifier===dedo.id) dedo=null; };
cv.addEventListener("touchend",sueltaDedo); cv.addEventListener("touchcancel",sueltaDedo);

/* 🎮 El navegador solo le da el mando a la página que tiene el FOCO, y dentro de un iframe eso
      falla a menudo. Por eso hay DOS vías: el mando de aquí, y el que el cuartel nos manda por
      mensajes. Se usa el que esté fresco. */
const PAD={ antes:{}, prestado:null, prestadoT:0 };
addEventListener("message",e=>{ const d=e&&e.data; if(d&&d.edtuPad){ PAD.prestado=d; PAD.prestadoT=performance.now(); } });
/* y al tocar la pantalla o el teclado, nos traemos el foco */
const pillaFoco=()=>{ try{ window.focus(); }catch(e){} };
addEventListener("pointerdown",pillaFoco); addEventListener("touchstart",pillaFoco,{passive:true}); addEventListener("keydown",pillaFoco);
function padCrudo(){
  const g=navigator.getGamepads&&navigator.getGamepads()[0];
  if(g&&(g.axes||[]).length>=2) return { axes:g.axes, btn:i=>!!(g.buttons[i]&&(g.buttons[i].pressed||g.buttons[i].value>0.4)), propio:true };
  if(PAD.prestado && performance.now()-PAD.prestadoT<400)
    return { axes:PAD.prestado.axes, btn:i=>!!PAD.prestado.buttons[i], propio:false };
  return null;
}
function leeMando(){
  const g=padCrudo(); if(!g) return null;
  const zona=v=>Math.abs(v)<0.22?0:v;
  return { dx:zona(g.axes[0]||0), dz:-zona(g.axes[1]||0),
    plano:g.btn(1), lift:g.btn(0), corte:g.btn(2), globo:g.btn(3),   /* B plano · A liftado · X cortado · Y globo */
    sprint:g.btn(7)||g.btn(5) };
}

/* ---------- lo que quiere hacer el humano ---------- */
function entrada(){
  const m=leeMando();
  let dx=0, dz=0;
  if(K.a||K.arrowleft) dx-=1; if(K.d||K.arrowright) dx+=1;
  if(K.w||K.arrowup) dz+=1; if(K.s||K.arrowdown) dz-=1;
  if(m){ dx+=m.dx; dz+=m.dz; }
  if(dedo){ dx+=Math.max(-1,Math.min(1,dedo.dx)); dz-=Math.max(-1,Math.min(1,dedo.dy)); }
  const pulsa={};
  for(const t in TIPOS) pulsa[t]=false;
  for(const k in TECLA_TIPO) if(K[k]) pulsa[TECLA_TIPO[k]]=true;
  if(m){ for(const t in TIPOS) if(m[t]) pulsa[t]=true; }
  for(const t in TIPOS) if(TACT[t]) pulsa[t]=true;
  const sprint=!!(K.shift||(m&&m.sprint));
  return { dx, dz, pulsa, sprint };
}

/* ---------- golpear ---------- */
/* 🎯 la cuenta del golpe: desde dónde sale la bola, qué golpe, cuánta fuerza y a dónde apuntas.
      apunteX: izquierda/derecha en metros · prof: -1 corto (junto a la red) ... +1 al fondo.
      Devuelve la velocidad y el efecto. La usan el golpe de verdad Y la marca de dónde cae */
function velGolpe(desde, lado, tipo, potencia, apunteX, prof, saque){
  const T=TIPOS[tipo]||TIPOS.plano;
  const p01=(Math.max(-1,Math.min(1,prof||0))+1)/2;       /* 0 corto · 1 al fondo */
  /* el SAQUE tiene su propio objetivo: dentro del cuadro de saque, no al fondo */
  const destinoZ = saque ? (lado===0 ? RED_Z+SAQUE*0.88 : RED_Z-SAQUE*0.88)   /* al fondo del cuadro: así pasa la red */
                 : lado===0 ? (RED_Z+SAQUE*0.55) + p01*((LARGO-0.9)-(RED_Z+SAQUE*0.55))
                            : (RED_Z-SAQUE*0.55) - p01*((RED_Z-SAQUE*0.55)-0.9);
  const destinoX = Math.max(-ANCHO/2+0.25, Math.min(ANCHO/2-0.25, apunteX));
  const cruda=(ax,az,extra)=>{
    const dx=ax-desde.x, dz=az-desde.z;
    const dist=Math.hypot(dx,dz)||1;
    const vel=(saque? 26+potencia*14 : 16+potencia*15)*T.pot;   /* saque hasta 144 km/h: más rápido no cabe en el cuadro */
    const t=dist/vel;
    const alturaRed = saque? 0.25 : T.alto*(0.55+potencia*0.35);
    const yObj = saque? 0.35 : 0.22;
    return { vx:dx/t, vz:dz/t, vy:(yObj-desde.y)/t + 0.5*G_GRAV*t + alturaRed*2.2 + (extra||0),
             giro:T.giro*(0.6+potencia*0.8) };
  };
  /* 🎯 la cuenta de arriba no sabe del rozamiento del aire ni del efecto, así que la bola se
        quedaba CORTA (apuntando al fondo caía en 18,5 en vez de en 23). Se corrige apuntando un
        poco más allá, probando con la simulación de verdad hasta caer a menos de 2 cm */
  /* 🥅 y si con esa cuenta la bola se comería la RED, se le da más arco y se vuelve a probar.
        Antes esto no hacía falta... porque la bola ATRAVESABA la red (el bug de los 10 cm): los
        saques "entraban" de milagro. Con la red de verdad, se iban todos a la red */
  let ax=destinoX, az=destinoZ, extra=0, v=cruda(ax,az,extra);
  for(let it=0;it<16;it++){
    const sim=simulaTiro(desde,v);
    if(sim.red){ extra+=0.7; v=cruda(ax,az,extra); continue; }
    const ex=destinoX-sim.x, ez=destinoZ-sim.z;
    if(Math.abs(ex)<0.02&&Math.abs(ez)<0.02) break;
    ax+=ex; az+=ez; v=cruda(ax,az,extra);
  }
  return v;
}
/* 🎯 dónde va a caer: se simula el vuelo con EXACTAMENTE la misma física que la bola de verdad
      (gravedad, efecto, rozamiento y la red), paso a paso */
function simulaTiro(desde, v, paso){
  const h=paso||1/60;
  let x=desde.x, y=desde.y, z=desde.z, vx=v.vx, vy=v.vy, vz=v.vz;
  const giro=v.giro, camino=[];
  for(let i=0;i<600;i++){
    const zAntes=z;
    vy-=G_GRAV*h; vy-=giro*4.2*h;
    const roz=Math.pow(0.986,h*60); vx*=roz; vz*=roz;
    x+=vx*h; y+=vy*h; z+=vz*h;
    if(i%2===0) camino.push({x,y,z});
    /* ¿choca con la red? se mira si CRUZA la línea de la red, no si está justo encima */
    if((zAntes-RED_Z)*(z-RED_Z)<=0 && zAntes!==z){
      const k=(RED_Z-zAntes)/(z-zAntes);
      const yCruce=y-vy*h*(1-k);
      if(yCruce<RED_ALTO+0.05) return { x, z:RED_Z, camino, red:true, dentro:false };
    }
    if(y<=0.033 && vy<0) return { x, z, camino, red:false };
  }
  return { x, z, camino, red:false };
}
function golpea(quien, tipo, potencia, apunteX, saque, prof){
  const b=G.bola;
  const v=velGolpe(b, quien.lado, tipo, potencia, apunteX, prof===undefined?0.55:prof, saque);
  const dx=v.vx;
  b.vx=v.vx; b.vz=v.vz; b.vy=v.vy; b.giro=v.giro;
  b.viva=true; b.botes=0; b.lado=quien.lado; b.estela=[];
  G.ultimo=quien.lado;
  quien.swing=0.30; quien.dirRaqueta=dx>0?1:-1;
  /* 🧍 para la animación: ¿de derecha o de revés?, ¿fue un saque?, y el rival hace el
        "split step" (el saltito de espera de los tenistas) en cuanto le pegas */
  const porDerecha = quien.lado===0 ? (b.x>=quien.x) : (b.x<=quien.x);
  quien.ladoGolpe = saque ? 1 : (porDerecha?1:-1);
  quien.fueSaque = !!saque;
  { const rival = quien.lado===0 ? G.ia : G.jug; if(rival) rival.salto=0.28; }
  G.rally++; if(G.rally>G.rallyMax) G.rallyMax=G.rally;
  sonido(saque?"saque":"golpe", potencia);
}

/* ---------- física de la bola ---------- */
function bolaCorre(dt){
  const b=G.bola; if(!b.viva) return;
  b.vy-=G_GRAV*dt;
  b.vy-=b.giro*4.2*dt;                                   /* el liftado baja, el cortado flota */
  const roz=Math.pow(0.986,dt*60);
  b.vx*=roz; b.vz*=roz;
  const zAntes=b.z;
  b.x+=b.vx*dt; b.y+=b.vy*dt; b.z+=b.vz*dt;
  /* 🐛 la red: antes solo se miraba si la bola estaba JUSTO encima (10 cm), y a 20 m/s la bola
        avanza 33 cm por fotograma, así que se la saltaba y la atravesaba. Ahora se mira si CRUZA */
  if((zAntes-RED_Z)*(b.z-RED_Z)<=0 && zAntes!==b.z){
    const k=(RED_Z-zAntes)/(b.z-zAntes);
    const yCruce=b.y-b.vy*dt*(1-k);
    if(yCruce<RED_ALTO+0.05){ punto(b.lado===0?1:0, "🥅 a la red"); b.viva=false; return; }
  }
  b.estela.push({x:b.x,y:b.y,z:b.z,v:1});
  if(b.estela.length>16) b.estela.shift();
  for(const e of b.estela) e.v-=dt*3.4;
  /* el bote */
  if(b.y<=0.033 && b.vy<0){
    b.y=0.033; b.vy=-b.vy*0.74; b.vz*=0.86; b.vx*=0.86;
    b.vz+=b.giro*1.1;                                    /* el liftado sale disparado */
    b.botes++;
    sonido("bote",0.5);
    const dentro = dentroDePista(b.x,b.z, G.estado==="saque");
    if(b.botes===1 && !dentro){ punto(b.lado===0?1:0, "⛔ fuera"); b.viva=false; return; }
    if(b.botes>=2){ punto(b.lado, G.estado==="saque"?"🎾 ACE":"✅ punto"); if(G.estado==="saque") G.aces++; else G.winners++; b.viva=false; return; }
  }
  /* se va del mundo */
  if(b.z<-8||b.z>LARGO+8||Math.abs(b.x)>16){ punto(b.lado===0?1:0,"⛔ fuera"); b.viva=false; }
}
function dentroDePista(x,z,esSaque){
  if(Math.abs(x)>ANCHO/2+0.02) return false;
  if(esSaque){
    /* el saque tiene que caer en el cuadro cruzado */
    if(G.saca===0) return z>RED_Z && z<RED_Z+SAQUE;
    return z<RED_Z && z>RED_Z-SAQUE;
  }
  return z>-0.02 && z<LARGO+0.02;
}

/* ---------- el tanteo ---------- */
function punto(quien, texto){
  if(G.fin) return;
  G.msg=(quien===0?"🟢 ":"🔴 ")+texto; G.msgT=1.6;
  if(G.ventaja>=0){
    if(G.ventaja===quien) ganaJuego(quien); else G.ventaja=-1;
  } else if(G.pts[quien]>=3 && G.pts[1-quien]>=3){ G.ventaja=quien; }
  else if(G.pts[quien]>=3) ganaJuego(quien);
  else G.pts[quien]++;
  G.estado="fin_punto"; G.esperaT=1.5;
}
function ganaJuego(quien){
  G.juegos[quien]++; G.pts=[0,0]; G.ventaja=-1;
  G.saca=1-G.saca;
  G.msg=(quien===0?"🟢 ":"🔴 ")+"¡JUEGO!"; G.msgT=2.2;
  if(G.juegos[quien]>=6 && G.juegos[quien]-G.juegos[1-quien]>=2){
    G.sets_g[quien]++; G.juegos=[0,0];
    G.msg=(quien===0?"🟢 ":"🔴 ")+"¡SET!"; G.msgT=2.6;
    if(G.sets_g[quien]>G.sets/2 || G.sets_g[quien]>=Math.ceil((G.sets+1)/2)) return acaba(quien);
  }
  if(G.juegos[0]>=7||G.juegos[1]>=7){                    /* desempate rápido a 7 juegos */
    const g=G.juegos[0]>G.juegos[1]?0:1; G.sets_g[g]++; G.juegos=[0,0];
    if(G.sets_g[g]>=Math.ceil((G.sets+1)/2)) return acaba(g);
  }
}
function textoPts(i){
  if(G.ventaja===i) return "AD";
  if(G.ventaja===1-i) return "-";
  return PTS[Math.min(3,G.pts[i])];
}

/* ---------- la máquina que juega contra ti ---------- */
function iaCorre(dt){
  const ia=G.ia, b=G.bola, D=DIFS[G.dif];
  /* dónde caerá la bola: se resuelve la parábola a ojo, paso a paso */
  let px=ia.x, pz=ia.z, tvuelo=0;
  if(b.viva && b.vz>0){
    let x=b.x,y=b.y,z=b.z,vy=b.vy,vx=b.vx,vz=b.vz;
    for(let i=0;i<120;i++){ const h=1/60; vy-=G_GRAV*h; x+=vx*h; y+=vy*h; z+=vz*h; tvuelo+=h;
      if(y<=0.4&&vy<0){ break; } if(z>LARGO+3) break; }
    px=x; pz=Math.max(RED_Z+1.2, Math.min(LARGO+2.2, z));
  } else { px=0; pz=LARGO+1.2; }
  /* con la dificultad fácil, tarda en reaccionar y calcula peor */
  px+= (Math.random()*2-1)*D.err*2.2;
  const dx=px-ia.x, dz=pz-ia.z, l=Math.hypot(dx,dz)||1;
  const v=D.vel;
  if(l>0.12){ ia.x+=dx/l*Math.min(v*dt, l); ia.z+=dz/l*Math.min(v*dt*0.8, l); ia.paso+=dt*6; }
  ia.x=Math.max(-DOBLES/2-1.2,Math.min(DOBLES/2+1.2,ia.x));
  /* ¿le pega? */
  if(b.viva && b.lado===0 && b.z>RED_Z){
    const cerca=Math.hypot(b.x-ia.x, b.z-ia.z);
    if(cerca<2.3 && b.y<2.6 && b.y>0.08 && b.botes>=1){
      const tipo = b.y>1.5 ? "corte" : (Math.random()<0.55?"lift":"plano");
      const pot=(0.55+Math.random()*0.4)*D.pot;
      const apunta=(Math.random()*2-1)*ANCHO*0.40;
      golpea(ia, tipo, pot, apunta, false);
    }
  }
  /* su saque */
  if(G.estado==="saque" && G.saca===1){
    G.iaSaqueT-=dt;
    if(G.iaSaqueT<=0){
      G.bola.x=ia.x; G.bola.z=ia.z; G.bola.y=2.4;
      const lado=(G.pts[0]+G.pts[1])%2===0?-1:1;
      golpea(ia,"plano",0.55+Math.random()*0.35*D.pot, lado*SAQUE*0.34, true);
      G.estado="juego";
    }
  }
}

/* ---------- tu jugador ---------- */
const ALCANCE=2.9;                                       /* 🎾 lo lejos que llega tu raqueta (antes 1,9) */
function humanoCorre(dt){
  const p=G.jug, b=G.bola, q=entrada();
  const vel=(6.2+(q.sprint?2.6:0));
  /* 🧲 IMÁN DE COLOCACIÓN: si la bola viene hacia ti y ya estás cerca, tu jugador se ajusta solo
        un poquito para llegar bien. Ayuda, pero no juega por ti: solo corrige lo justo */
  if(b.viva && b.lado===1 && b.vz<0){
    const d=Math.hypot(b.x-p.x, b.z-p.z);
    if(d<4.2){ const k=(1-d/4.2)*2.6*dt;
      p.x+=(b.x-p.x)*k; p.z+=(b.z-0.5-p.z)*k*0.5; }
  }
  /* qué botón tienes apretado (se mira ANTES de moverse: si no, el primer fotograma de la carga
     todavía te movía) */
  let tipoPulsado=null;
  for(const t in TIPOS) if(q.pulsa[t]) tipoPulsado=t;
  const l=Math.hypot(q.dx,q.dz);
  /* 🎯 mientras CARGAS un golpe, la palanca (o WASD) ya no te mueve: APUNTA. Izquierda/derecha
        mueve la marca de lado a lado, y arriba/abajo la manda al fondo o la deja corta.
        El imán de colocación sigue ayudándote a llegar a la bola */
  if(p.cargando||tipoPulsado){
    p.mira=Math.max(-1,Math.min(1,p.mira+q.dx*dt*2.6));
    p.prof=Math.max(-1,Math.min(1,(p.prof===undefined?0.55:p.prof)+q.dz*dt*2.6));
  } else if(l>0.08){ p.x+=q.dx/Math.max(1,l)*vel*dt; p.z+=q.dz/Math.max(1,l)*vel*dt; p.paso+=dt*7; }
  p.x=Math.max(-DOBLES/2-1.4,Math.min(DOBLES/2+1.4,p.x));
  p.z=Math.max(-4.0,Math.min(RED_Z-0.6,p.z));

  if(G.estado==="saque" && G.saca===0){
    if(G.saqueFase===0){
      if(tipoPulsado){ G.saqueFase=1; G.saqueT=0; p.tipo=tipoPulsado; G.bola.y=1.0; G.bola.vy=6.4; G.bola.x=p.x; G.bola.z=p.z; }
    } else {
      G.saqueT+=dt;
      G.bola.vy-=G_GRAV*dt; G.bola.y+=G.bola.vy*dt;
      G.bola.x=p.x; G.bola.z=p.z;
      const enVentana = G.bola.y>1.9;                    /* la ventana buena: con la bola arriba */
      if(!tipoPulsado && G.saqueFase===1 && G.saqueT>0.10){
        const pot = enVentana ? 0.75+Math.min(0.25,(2.6-Math.abs(G.bola.y-2.6))*0.12) : 0.35;
        const lado=(G.pts[0]+G.pts[1])%2===0?1:-1;
        G.bola.y=Math.max(1.6,G.bola.y);
        golpea(p,"plano",pot, lado*SAQUE*0.32, true);
        G.estado="juego";
      }
      if(G.bola.y<0.15){ punto(1,"⛔ saque fallado"); G.bola.viva=false; }
    }
    return;
  }
  /* cargar y soltar */
  if(tipoPulsado){
    if(!p.cargando){ p.cargando=true; p.carga=0; p.tipo=tipoPulsado; p.prep=1; p.mira=0; p.prof=0.55; }
    p.carga=Math.min(1,p.carga+dt*1.55);
  } else if(p.cargando){
    p.cargando=false;
    p.guardado={ tipo:p.tipo, carga:p.carga, mira:p.mira, prof:(p.prof===undefined?0.55:p.prof), t:0.42 };   /* 🎾 se guarda el golpe */
    p.carga=0;
  }
  /* 🎾 EL GOLPE ESPERA A LA BOLA: si sueltas un poco antes o un poco después, el raquetazo se
        queda "guardado" 0,42 s y sale solo en cuanto la bola entra en tu alcance. Antes tenías
        que soltar en el fotograma exacto, que es imposible */
  if(p.guardado){
    p.guardado.t-=dt;
    const cerca=Math.hypot(b.x-p.x, b.z-p.z);
    if(b.viva && b.lado===1 && cerca<ALCANCE && b.y<2.9){
      const apunta=p.guardado.mira*ANCHO*0.44;
      golpea(p, p.guardado.tipo, p.guardado.carga, apunta, false, p.guardado.prof);
      G.estado="juego"; p.guardado=null; p.mira*=0.3;
    } else if(p.guardado.t<=0){ p.swing=0.22; p.guardado=null; p.mira*=0.3; }   /* golpe al aire */
  }
  if(p.prep>0) p.prep-=dt*2.4;
}

/* ---------- sonido, todo generado ---------- */
let AC=null; const ac=()=>{ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); return AC; }catch(e){ return null; } };
let mute=false;
function sonido(tipo,f){
  if(mute) return; const a=ac(); if(!a) return;
  const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  if(tipo==="golpe"||tipo==="saque"){
    o.type="triangle"; o.frequency.setValueAtTime(tipo==="saque"?680:520+f*260,t);
    o.frequency.exponentialRampToValueAtTime(140,t+0.09);
    g.gain.setValueAtTime(0.16+f*0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  } else if(tipo==="bote"){
    o.type="sine"; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(90,t+0.08);
    g.gain.setValueAtTime(0.10,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.10);
  } else { o.type="square"; o.frequency.setValueAtTime(440,t); g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); }
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.25);
}
function publico(intensidad){
  if(mute) return; const a=ac(); if(!a) return;
  const dur=1.1+intensidad*0.9, t=a.currentTime;
  const n=a.createBufferSource(), buf=a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){ const k=i/d.length; d[i]=(Math.random()*2-1)*Math.pow(1-k,1.6)*Math.min(1,k*12); }
  n.buffer=buf;
  const f=a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=900; f.Q.value=0.7;
  const g=a.createGain(); g.gain.value=0.10+intensidad*0.14;
  n.connect(f); f.connect(g); g.connect(a.destination); n.start(t);
}

/* ============================ DIBUJO ============================ */
/* 🏟️ EL ESTADIO: tres tribunas (fondo, izquierda y derecha) de 14 filas de escalones cada una,
      que cierran la pista como un estadio de verdad. En cada fila, gente sentada con su ropa y su
      color de piel. El reparto se hace con un azar FIJO (siempre la misma semilla), así el
      público no cambia de sitio cada vez que abres el juego */
const GRADA_FILAS=14, FILA_FONDO=0.85, FILA_ALTO=0.50, ASIENTO=0.56;
const ROPAS=[[236,236,240],[40,52,96],[200,58,58],[236,196,64],[120,176,226],[70,150,90],[226,120,170],[232,140,60],[140,140,150],[34,34,40]];
const PIELES=[[238,204,170],[214,170,130],[170,120,86],[120,80,56]];
const GRADERIO=[], PUBLICO=[];
(function llenaGradas(){
  let semilla=12345;
  const azar=()=>{ semilla=(semilla*1103515245+12345)%2147483648; return semilla/2147483648; };
  const zFondo=LARGO+4.2, xLado=DOBLES/2+5.0;
  for(const d of [{nom:"fondo",mira:{x:0,z:-1}},{nom:"izq",mira:{x:1,z:0}},{nom:"der",mira:{x:-1,z:0}}]){
    const grada={ nom:d.nom, mira:d.mira, filas:[] };
    for(let r=0;r<GRADA_FILAS;r++){
      const fila={ r, y:1.1+r*FILA_ALTO, personas:[] };
      if(d.nom==="fondo"){
        fila.a={x:-24,z:zFondo+r*FILA_FONDO}; fila.b={x:24,z:zFondo+r*FILA_FONDO}; fila.hondo={x:0,z:FILA_FONDO};
      } else {
        const lado=d.nom==="izq"?-1:1, x=lado*(xLado+r*FILA_FONDO);
        fila.a={x,z:-4}; fila.b={x,z:LARGO+4}; fila.hondo={x:lado*FILA_FONDO,z:0};
      }
      const asientos=Math.floor(Math.hypot(fila.b.x-fila.a.x, fila.b.z-fila.a.z)/ASIENTO);
      for(let i=0;i<asientos;i++){
        if(azar()<0.14) continue;                            /* algún asiento vacío */
        const t=(i+0.5)/asientos;
        const p={ grada:d.nom, fila:r, y:fila.y,
          x:fila.a.x+(fila.b.x-fila.a.x)*t+fila.hondo.x*0.45,
          z:fila.a.z+(fila.b.z-fila.a.z)*t+fila.hondo.z*0.45,
          ropa:(azar()*ROPAS.length)|0, piel:(azar()*PIELES.length)|0, ph:azar()*7, talla:0.9+azar()*0.2 };
        fila.personas.push(p); PUBLICO.push(p);
      }
      grada.filas.push(fila);
    }
    GRADERIO.push(grada);
  }
})();

function linea(x1,z1,x2,z2,gordo,col){
  const a=proyecta(x1,0.001,z1), b=proyecta(x2,0.001,z2); if(!a||!b) return;
  ctx.strokeStyle=col||"rgba(255,255,255,.92)";
  ctx.lineWidth=Math.max(1,(gordo||0.05)*((a.s+b.s)/2));
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
}
function cuadro(p1,p2,p3,p4,col){
  const a=proyecta(p1[0],0,p1[1]), b=proyecta(p2[0],0,p2[1]), c=proyecta(p3[0],0,p3[1]), d=proyecta(p4[0],0,p4[1]);
  if(!a||!b||!c||!d) return;
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath(); ctx.fill();
}

/* un polígono en el espacio: sus esquinas se proyectan y se rellena */
function poligono3(pts, color){
  const q=[]; for(const p of pts){ const r=proyecta(p[0],p[1],p[2]); if(!r) return; q.push(r); }
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(q[0].x,q[0].y);
  for(let i=1;i<q.length;i++) ctx.lineTo(q[i].x,q[i].y);
  ctx.closePath(); ctx.fill();
}
const rgbTxt=(c,k)=>"rgb("+Math.round(c[0]*k)+","+Math.round(c[1]*k)+","+Math.round(c[2]*k)+")";
/* 🧑‍🤝‍🧑 la gente de una fila: se agrupa por color para pintar muchas de golpe (un relleno por
      color, no uno por persona), que con 2.400 personas es lo que hace que no pese */
function pintaFilaGente(lista, fiesta, luz){
  if(!lista.length) return;
  const vistas=[];
  for(const p of lista){
    /* 🎉 cuando hay punto la gente salta; si no, se balancea un poquito */
    const bote = fiesta>0 ? Math.abs(Math.sin(G.t*10+p.ph))*0.20*fiesta : Math.sin(G.t*1.3+p.ph)*0.015;
    const c=proyecta(p.x, p.y+0.36*p.talla+bote, p.z);
    if(!c || c.x<-40 || c.x>W+40 || c.y<-40 || c.y>H+40) continue;
    vistas.push([p,c]);
  }
  for(let k=0;k<ROPAS.length;k++){
    let hay=false; ctx.beginPath();
    for(const [p,c] of vistas){ if(p.ropa!==k) continue;
      const rx=Math.max(0.8,0.21*p.talla*c.s), ry=Math.max(1,0.30*p.talla*c.s);
      ctx.moveTo(c.x+rx,c.y); ctx.ellipse(c.x,c.y,rx,ry,0,0,7); hay=true; }
    if(hay){ ctx.fillStyle=rgbTxt(ROPAS[k],luz); ctx.fill(); }
  }
  for(let k=0;k<PIELES.length;k++){
    let hay=false; ctx.beginPath();
    for(const [p,c] of vistas){ if(p.piel!==k) continue;
      const r=Math.max(0.7,0.115*p.talla*c.s), cy=c.y-0.42*p.talla*c.s;
      ctx.moveTo(c.x+r,cy); ctx.arc(c.x,cy,r,0,7); hay=true; }
    if(hay){ ctx.fillStyle=rgbTxt(PIELES[k],luz); ctx.fill(); }
  }
}
function pintaEstadio(){
  const fiesta = G.msgT>0 ? Math.min(1,G.msgT) : 0;        /* 🎉 hay punto: el público celebra */
  for(const gr of GRADERIO){
    /* cada tribuna recibe el sol según hacia dónde mira */
    const luz=0.70+0.35*Math.max(0, gr.mira.x*SOL3.x + gr.mira.z*SOL3.z);
    /* la pared de arriba del todo, detrás de la última fila */
    const u=gr.filas[gr.filas.length-1];
    const ya=u.y, yb=u.y+3.2;
    poligono3([[u.a.x+u.hondo.x,ya,u.a.z+u.hondo.z],[u.b.x+u.hondo.x,ya,u.b.z+u.hondo.z],
               [u.b.x+u.hondo.x,yb,u.b.z+u.hondo.z],[u.a.x+u.hondo.x,yb,u.a.z+u.hondo.z]], rgbTxt([30,40,36],luz));
    /* las filas, de la de arriba (la más lejana) a la de abajo: asiento, escalón y su gente */
    for(let ri=gr.filas.length-1; ri>=0; ri--){
      const fl=gr.filas[ri], abajo = ri===0 ? 0 : fl.y-FILA_ALTO;
      poligono3([[fl.a.x,fl.y,fl.a.z],[fl.b.x,fl.y,fl.b.z],
                 [fl.b.x+fl.hondo.x,fl.y,fl.b.z+fl.hondo.z],[fl.a.x+fl.hondo.x,fl.y,fl.a.z+fl.hondo.z]],
                rgbTxt(ri%2?[31,82,56]:[27,74,50],luz));      /* los asientos verdes */
      poligono3([[fl.a.x,abajo,fl.a.z],[fl.b.x,abajo,fl.b.z],[fl.b.x,fl.y,fl.b.z],[fl.a.x,fl.y,fl.a.z]],
                rgbTxt([52,64,58],luz*0.85));                 /* el escalón */
      /* el canto del escalón, un poco más claro: es lo que hace que se vean las filas */
      const c1=proyecta(fl.a.x,fl.y,fl.a.z), c2=proyecta(fl.b.x,fl.y,fl.b.z);
      if(c1&&c2){ ctx.strokeStyle=rgbTxt([120,140,128],luz); ctx.lineWidth=Math.max(1,0.03*(c1.s+c2.s)/2);
        ctx.beginPath(); ctx.moveTo(c1.x,c1.y); ctx.lineTo(c2.x,c2.y); ctx.stroke(); }
      pintaFilaGente(fl.personas, fiesta, luz);
    }
  }
}

/* ☀️ el cielo de día y el sol, en el sitio donde está de verdad */
function pintaCielo(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#5aa7e8"); g.addColorStop(0.7,"#a8d6f5"); g.addColorStop(1,"#e8f4ea");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  /* unas nubes que pasan despacio */
  for(let i=0;i<5;i++){
    const x=((i*0.23+G.t*0.004)%1.2-0.1)*W, y=H*(0.04+i*0.035);

/* 🧍 una persona hecha con las mismas cápsulas iluminadas que los jugadores, en tres posturas:

function pintaPersona(g){
  const t=g.talla||1, fX=g.mira.x, fZ=g.mira.z, rX=g.mira.z, rZ=-g.mira.x;
  const alt = g.pose==="sentado" ? (g.silla||1.85) : 0;
  const W3=(lx,ly,lz)=>({x:g.x+(rX*lx+fX*lz)*t, y:alt+ly*t, z:g.z+(rZ*lx+fZ*lz)*t});
  let J;
  if(g.pose==="agachado") J={ pieD:W3(0.13,0.07,0), pieI:W3(-0.13,0.07,0), rodD:W3(0.15,0.45,0.30), rodI:W3(-0.15,0.45,0.30),
    cadD:W3(0.10,0.56,-0.05), cadI:W3(-0.10,0.56,-0.05), pelvis:W3(0,0.58,-0.04), pecho:W3(0,0.98,0.16), cuello:W3(0,1.06,0.22),
    cabeza:W3(0,1.18,0.30), homD:W3(0.18,0.94,0.13), homI:W3(-0.18,0.94,0.13), codD:W3(0.21,0.72,0.24), codI:W3(-0.21,0.72,0.24),
    manD:W3(0.15,0.52,0.31), manI:W3(-0.15,0.52,0.31) };
  else if(g.pose==="sentado") J={ pieD:W3(0.12,-0.40,0.46), pieI:W3(-0.12,-0.40,0.46), rodD:W3(0.12,0.06,0.44), rodI:W3(-0.12,0.06,0.44),
    cadD:W3(0.10,0.06,0), cadI:W3(-0.10,0.06,0), pelvis:W3(0,0.10,-0.02), pecho:W3(0,0.55,-0.02), cuello:W3(0,0.64,-0.01),
    cabeza:W3(0,0.78,0), homD:W3(0.19,0.52,-0.02), homI:W3(-0.19,0.52,-0.02), codD:W3(0.22,0.30,0.12), codI:W3(-0.22,0.30,0.12),
    manD:W3(0.12,0.20,0.30), manI:W3(-0.12,0.20,0.30) };
  else J={ pieD:W3(0.11,0.07,0), pieI:W3(-0.11,0.07,0), rodD:W3(0.11,0.50,0.02), rodI:W3(-0.11,0.50,0.02),
    cadD:W3(0.10,0.92,0), cadI:W3(-0.10,0.92,0), pelvis:W3(0,0.95,0), pecho:W3(0,1.40,0), cuello:W3(0,1.50,0),
    cabeza:W3(0,1.64,0.01), homD:W3(0.19,1.38,0), homI:W3(-0.19,1.38,0), codD:W3(0.23,1.12,-0.06), codI:W3(-0.23,1.12,-0.06),

  const esf=(c,r,col,sesgo)=>partes.push({ z:profCam(c)-(sesgo||0), f:()=>esfera(c,r*t,col) });

/* 🪑 la silla alta del juez: cuatro patas, asiento, respaldo, reposapiés y escalera por detrás */
function pintaSilla(g){

  const P=(lx,ly,lz)=>({x:g.x+rX*lx+fX*lz, y:ly, z:g.z+rZ*lx+fZ*lz});

  capsula(P(-0.26,h+0.05,-0.30),P(-0.26,h+0.75,-0.34),0.03,blanco);
  capsula(P(0.26,h+0.05,-0.30),P(0.26,h+0.75,-0.34),0.03,blanco);
  capsula(P(-0.26,h+0.70,-0.34),P(0.26,h+0.70,-0.34),0.05,oscuro);                            /* el respaldo */

function pintaGente(){

function pintaPista(){

  const N=24;
  for(let i=0;i<N;i++){

    const luz=1-Math.abs((z0-RED_Z)/(LARGO*0.9))*0.18;      /* más claro cerca de la red */
    const base=i%2? [63,138,58] : [71,143,65];
    cuadro([-14,z0],[14,z0],[14,z1],[-14,z1],
      "rgb("+Math.round(base[0]*luz)+","+Math.round(base[1]*luz)+","+Math.round(base[2]*luz)+")");
  }
  /* las CALVAS del saque y del fondo: donde se pisa, el césped está gastado */
  for(const z of [1.0, LARGO-1.0]){
    const p=proyecta(0,0.005,z); if(!p) continue;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,4.2*p.s);
    g.addColorStop(0,"rgba(196,180,120,.30)"); g.addColorStop(1,"rgba(196,180,120,0)");

    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,4.2*p.s,0,7); ctx.fill(); ctx.restore();
  }

  /* las líneas */
  const M=ANCHO/2, D=DOBLES/2;
  linea(-D,0,D,0); linea(-D,LARGO,D,LARGO);
  linea(-D,0,-D,LARGO); linea(D,0,D,LARGO);
  linea(-M,0,-M,LARGO); linea(M,0,M,LARGO);
  linea(-M,RED_Z-SAQUE,M,RED_Z-SAQUE); linea(-M,RED_Z+SAQUE,M,RED_Z+SAQUE);
  linea(0,RED_Z-SAQUE,0,RED_Z+SAQUE);
  linea(0,0,0,0.4); linea(0,LARGO-0.4,0,LARGO);

/* el sol está arriba a la izquierda, así que TODAS las sombras se van al mismo lado: eso es lo
   que hace que las cosas parezcan apoyadas en el suelo y no pegatinas */
const SOL3=(()=>{ const v={x:-0.62,y:0.70,z:0.36}; const l=Math.hypot(v.x,v.y,v.z); return {x:v.x/l,y:v.y/l,z:v.z/l}; })();
/* la sombra de algo a altura h cae desplazada lo que diga el sol (por eso cuadran todas) */
const SOL={x:-SOL3.x/SOL3.y, z:-SOL3.z/SOL3.y};
/* hacia dónde está el sol EN LA PANTALLA desde un punto: sirve para iluminar las cosas por el lado bueno */
function luzPantalla(x,y,z){
  const a=proyecta(x,y,z), b=proyecta(x+SOL3.x*0.6,y+SOL3.y*0.6,z+SOL3.z*0.6);
  if(!a||!b) return {x:-0.7,y:-0.7};
  const dx=b.x-a.x, dy=b.y-a.y, l=Math.hypot(dx,dy)||1;
  return {x:dx/l, y:dy/l};
}
/* 🧊 una pieza del cuerpo en 3D: un cilindro con las puntas redondas, iluminado por el lado del sol */
function capsula(a3,b3,radio,rgb,luzExtra){
  const A=proyecta(a3.x,a3.y,a3.z), B=proyecta(b3.x,b3.y,b3.z); if(!A||!B) return;
  const r=Math.max(1.2, radio*(A.s+B.s)/2);
  const L=luzPantalla((a3.x+b3.x)/2,(a3.y+b3.y)/2,(a3.z+b3.z)/2);
  let nx=-(B.y-A.y), ny=(B.x-A.x); const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
  if(nx*L.x+ny*L.y<0){ nx=-nx; ny=-ny; }                  /* la normal que mira al sol */
  const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
  const g=ctx.createLinearGradient(mx-nx*r,my-ny*r,mx+nx*r,my+ny*r);
  const k=luzExtra||1;
  const osc=rgb.map(c=>Math.round(c*0.42)), med=rgb.map(c=>Math.round(Math.min(255,c*0.92*k))),
        luz=rgb.map(c=>Math.round(Math.min(255,c*1.22*k+22)));
  g.addColorStop(0,"rgb("+osc.join(",")+")");
  g.addColorStop(0.55,"rgb("+med.join(",")+")");
  g.addColorStop(0.9,"rgb("+luz.join(",")+")");
  g.addColorStop(1,"rgb("+med.join(",")+")");
  ctx.strokeStyle=g; ctx.lineWidth=r*2; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
}
/* ⚪ una esfera iluminada: el brillo cae del lado del sol */
function esfera(c3,radio,rgb){
  const P=proyecta(c3.x,c3.y,c3.z); if(!P) return;
  const r=Math.max(1.2,radio*P.s), L=luzPantalla(c3.x,c3.y,c3.z);
  const g=ctx.createRadialGradient(P.x+L.x*r*0.45,P.y+L.y*r*0.45,r*0.08,P.x,P.y,r);
  g.addColorStop(0,"rgb("+rgb.map(c=>Math.min(255,Math.round(c*1.25+30))).join(",")+")");
  g.addColorStop(0.55,"rgb("+rgb.join(",")+")");
  g.addColorStop(1,"rgb("+rgb.map(c=>Math.round(c*0.42)).join(",")+")");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(P.x,P.y,r,0,7); ctx.fill();
}
function sombra(x,z,r,fuerza,alto){
  const h=alto||0;
  const p=proyecta(x+SOL.x*h, 0.012, z+SOL.z*h); if(!p) return;
  const difusa=1+h*0.30;                                   /* cuanto más alto, más borrosa y grande */
  const a=(0.30*(fuerza||1))/difusa;
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*p.s*difusa*1.3);
  g.addColorStop(0,"rgba(0,0,0,"+a.toFixed(3)+")");
  g.addColorStop(0.65,"rgba(0,0,0,"+(a*0.55).toFixed(3)+")");
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.save(); ctx.translate(p.x,p.y); ctx.scale(1,0.34);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r*p.s*difusa*1.3,0,7); ctx.fill();
  ctx.restore();
}

const PIEL=[232,196,158], PANTALON=[244,244,248], ZAPA=[246,246,250], CALCETIN=[250,250,252], PELO=[58,40,28];
function hexRgb(h){ const c=h.replace("#",""); return [parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)]; }

/* =====================================================================================
   🧍 LOS JUGADORES, CON ESQUELETO
   Cada jugador es un esqueleto en 3D: caderas, rodillas, pies, hombros, codos y manos. Las
   rodillas y los codos se calculan con CINEMÁTICA INVERSA de dos huesos (el mismo truco que
   los juegos grandes): le dices dónde quieres el pie o la mano, y la articulación se dobla
   sola sin que el hueso se estire NUNCA. Encima se viste con cápsulas y esferas iluminadas
   por el sol, y se pintan de lejos a cerca para que un brazo tape bien al cuerpo.
   ===================================================================================== */
const HUESO={ muslo:0.46, pierna:0.45, brazo:0.30, antebrazo:0.27 };
function easeOut(t){ t=Math.max(0,Math.min(1,t)); return 1-(1-t)*(1-t); }
function rotY(x,z,a){ const c=Math.cos(a), si=Math.sin(a); return {x:x*c+z*si, z:-x*si+z*c}; }
function mezcla(a,b,t){ return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t, z:a.z+(b.z-a.z)*t}; }
/* 🦴 dos huesos (muslo+pierna, o brazo+antebrazo): de la raíz "a" hacia el objetivo "c".
      Devuelve la articulación "b" (rodilla/codo) doblada hacia "polo", y el objetivo corregido
      si estaba tan lejos que no se llegaba (el pie o la mano se quedan donde llega el hueso) */
function ik2(a, c, l1, l2, polo){
  let dx=c.x-a.x, dy=c.y-a.y, dz=c.z-a.z;
  let d=Math.hypot(dx,dy,dz);
  if(!(d>1e-6)){ dx=0; dy=-1; dz=0; d=1; }
  const ux=dx/d, uy=dy/d, uz=dz/d;
  const dd=Math.max(Math.abs(l1-l2)+1e-3, Math.min((l1+l2)*0.999, d));
  const c2={x:a.x+ux*dd, y:a.y+uy*dd, z:a.z+uz*dd};
  const A=Math.acos(Math.max(-1,Math.min(1,(l1*l1+dd*dd-l2*l2)/(2*l1*dd))));
  let px=polo.x, py=polo.y, pz=polo.z;
  const pd=px*ux+py*uy+pz*uz; px-=ux*pd; py-=uy*pd; pz-=uz*pd;
  let pl=Math.hypot(px,py,pz);
  if(!(pl>1e-6)){ px=-uz; py=0; pz=ux; pl=Math.hypot(px,py,pz); if(!(pl>1e-6)){ px=1; py=0; pz=0; pl=1; } }
  px/=pl; py/=pl; pz/=pl;
  const al=Math.cos(A)*l1, of=Math.sin(A)*l1;
  return { b:{x:a.x+ux*al+px*of, y:a.y+uy*al+py*of, z:a.z+uz*al+pz*of}, c:c2 };
}
/* ⏱️ lo que se mueve con el tiempo: la velocidad de verdad (para correr), la zancada, el
      golpe que se apaga y el saltito de espera */
function animaJugador(p,dt){
  if(!p||!(dt>0)) return;
  if(p._px===undefined){ p._px=p.x; p._pz=p.z; }
  const mov=Math.hypot(p.x-p._px, p.z-p._pz);
  const v = mov>1.5 ? 0 : mov/dt;                          /* colocarse para sacar no es correr */
  p._px=p.x; p._pz=p.z;
  p.velA=(p.velA||0)+(Math.min(9,v)-(p.velA||0))*Math.min(1,dt*10);
  p.zancada=(p.zancada||0)+dt*(3.2+p.velA*1.25)*Math.min(1,p.velA/1.2);
  if((p.swing||0)>(p._swPrev||0)+0.01) p._swingIni=p.swing; /* acaba de empezar un golpe */
  if(p.swing>0) p.swing=Math.max(0,p.swing-dt);
  p._swPrev=p.swing||0;
  if(p.salto>0) p.salto=Math.max(0,p.salto-dt);
}
/* 🦴 dónde está cada articulación AHORA, según lo que esté haciendo el jugador */
function esqueleto(p){
  const b=G.bola||{viva:false};
  /* mira hacia la red, y gira un poco el cuerpo hacia la bola */
  const bx=b.viva?b.x:0, bz=b.viva?b.z:RED_Z;
  let giro=Math.atan2(bx-p.x, Math.max(3,Math.abs(bz-p.z)))*0.35;
  if(p.lado===1) giro=-giro;
  const yaw=(p.lado===0?0:Math.PI)+giro;
  const fX=Math.sin(yaw), fZ=Math.cos(yaw), rX=Math.cos(yaw), rZ=-Math.sin(yaw);
  const W3=(lx,ly,lz)=>({x:p.x+rX*lx+fX*lz, y:ly, z:p.z+rZ*lx+fZ*lz});
  /* qué está haciendo */
  const vel=Math.max(0,Math.min(1,(p.velA||0)/6.5));
  const fase=p.zancada||0;
  const sacando = G.estado==="saque" && G.saca===p.lado;
  const lanzando = sacando && (p.lado===0 ? G.saqueFase===1 : (G.iaSaqueT!==undefined && G.iaSaqueT<0.55));
  const golpeando = (p.swing||0)>0;
  const e = golpeando ? easeOut(1-p.swing/Math.max(p.swing,p._swingIni||0.30)) : 0;
  const cargaK = p.cargando ? Math.max(0,Math.min(1,p.carga||0)) : 0;
  const s = p.ladoGolpe||1;                                /* +1 de derecha · -1 de revés */
  const listo = 1-vel;
  const salto = (p.salto||0)>0 ? Math.sin((1-p.salto/0.28)*Math.PI)*0.09 : 0;
  const agacha = 0.09*listo + 0.03 + cargaK*0.05;          /* piernas flexionadas esperando */
  const bob = Math.abs(Math.sin(fase))*0.045*vel + salto;  /* sube y baja al correr */
  const py = 0.97 - agacha + bob;                          /* altura de la pelvis */
  /* el tronco se enrolla al cargar y se desenrolla al golpear, como un látigo */
  let torso=0;
  if(golpeando && !p.fueSaque) torso = s*(0.9-1.9*e);
  else if(cargaK>0) torso = s*0.9*cargaK;
  const T3=(lx,ly,lz)=>{ const q=rotY(lx,lz,torso); return W3(q.x,ly,q.z); };
  const pelvis=W3(0,py,0), pechoTop=T3(0,py+0.44,0.02), cuello=T3(0,py+0.55,0.01), cabeza=T3(0,py+0.70,0.02);
  const hombroD=T3(0.20,py+0.46,0), hombroI=T3(-0.20,py+0.46,0);
  const caderaD=W3(0.10,py-0.04,0), caderaI=W3(-0.10,py-0.04,0);
  /* 🦵 las piernas: el pie va donde toca en la zancada, y la rodilla se dobla sola hacia delante */
  const abre=0.12+0.05*listo;
  const pierna=sd=>{
    const ph=fase+(sd>0?0:Math.PI);
    const pie=W3(sd*abre, 0.075+Math.max(0,Math.cos(ph))*0.15*vel+salto*0.5, Math.sin(ph)*0.33*vel+(sd>0?0.04:-0.04)*listo);
    const r=ik2(sd>0?caderaD:caderaI, pie, HUESO.muslo, HUESO.pierna, {x:fX, y:0.2, z:fZ});
    return { rod:r.b, pie:r.c, punta:{x:r.c.x+fX*0.15, y:r.c.y, z:r.c.z+fZ*0.15} };
  };
  const pD=pierna(1), pI=pierna(-1);
  /* 💪 las manos: dónde van según lo que haga; los codos se doblan solos */
  let manoD, manoI;
  let poloD={x:rX*0.5-fX*0.3, y:-1, z:rZ*0.5-fZ*0.3}, poloI={x:-rX*0.5, y:-1, z:-rZ*0.5};
  if(golpeando && p.fueSaque){
    /* el saque: la raqueta viene de detrás de la cabeza, pasa por arriba y acaba cruzada */
    const A=W3(0.22,py+0.95,-0.22), B=W3(0.22,py+1.15,0.18), C=W3(-0.12,py+0.25,0.42);
    manoD = e<0.4 ? mezcla(A,B,e/0.4) : mezcla(B,C,(e-0.4)/0.6);
    manoI = W3(-0.18,py+0.30,0.10);
    poloD={x:rX*0.6, y:0.6, z:rZ*0.6};
  } else if(lanzando){
    /* lanzando la bola: la raqueta atrás y el brazo izquierdo arriba */
    manoD=W3(0.24,py+0.80,-0.20); manoI=W3(-0.08,py+1.08,0.26);
    poloD={x:rX*0.6, y:0.4, z:rZ*0.6-fZ*0.2}; poloI={x:-rX*0.3, y:-0.2, z:-rZ*0.3};
  } else if(golpeando){
    /* derecha o revés: la mano dibuja un arco de atrás a delante y acaba arriba, cruzada */
    const th=-1.6+3.5*e;
    manoD=W3(s*(0.10+0.48*Math.cos(th)), py+0.20+0.30*Math.max(0,th)/1.9, 0.12+0.44*Math.sin(th));
    manoI=mezcla(W3(s*0.10,py+0.40,0.35), W3(-s*0.30,py+0.18,0.02), e);
  } else if(cargaK>0){
    /* cargando: la raqueta se va atrás, por el lado del golpe, y la otra mano señala la bola */
    manoD=mezcla(W3(0.20,py+0.22,0.32), W3(s*0.12,py+0.26,-0.32), easeOut(cargaK));
    manoI=mezcla(W3(-0.14,py+0.24,0.30), W3(s*0.10,py+0.40,0.35), cargaK);
  } else {
    /* esperando con la raqueta delante... o corriendo con los brazos al compás */
    manoD=mezcla(W3(0.20,py+0.22,0.32), W3(0.24,py+0.10,Math.sin(fase)*0.26*vel+0.05), vel);
    manoI=mezcla(W3(-0.14,py+0.24,0.30), W3(-0.24,py+0.10,Math.sin(fase+Math.PI)*0.26*vel+0.05), vel);
  }
  const aD=ik2(hombroD, manoD, HUESO.brazo, HUESO.antebrazo, poloD);
  const aI=ik2(hombroI, manoI, HUESO.brazo, HUESO.antebrazo, poloI);
  /* 🎾 la raqueta sigue al antebrazo, apuntando un poco hacia arriba */
  const mano=aD.c, codo=aD.b;
  let dir={x:mano.x-codo.x, y:mano.y-codo.y+0.30, z:mano.z-codo.z};
  const dl=Math.hypot(dir.x,dir.y,dir.z)||1; dir={x:dir.x/dl, y:dir.y/dl, z:dir.z/dl};
  let lat={x:dir.y*fZ, y:dir.z*fX-dir.x*fZ, z:-dir.y*fX};  /* de lado a lado del aro */
  let ll=Math.hypot(lat.x,lat.y,lat.z);
  if(!(ll>1e-3)){ lat={x:rX, y:0, z:rZ}; ll=1; }
  lat={x:lat.x/ll, y:lat.y/ll, z:lat.z/ll};
  const adelante=k=>({x:mano.x+dir.x*k, y:mano.y+dir.y*k, z:mano.z+dir.z*k});
  return { yaw, fX, fZ, rX, rZ, pelvis, pechoTop, cuello, cabeza, hombroD, hombroI,
    caderaD, caderaI, rodD:pD.rod, pieD:pD.pie, puntaD:pD.punta, rodI:pI.rod, pieI:pI.pie, puntaI:pI.punta,
    codoD:aD.b, manoD:aD.c, codoI:aI.b, manoI:aI.c,
    raqueta:{ mango:mano, cuello:adelante(0.22), centro:adelante(0.40), dir, lat } };
}
/* lo lejos que está un punto de la cámara: para pintar primero lo del fondo */
function profCam(q){
  const dy=q.y-CAM.y, dz=q.z-CAM.z;
  return dz*Math.cos(CAM.pitch) - dy*Math.sin(CAM.pitch);
}
/* 🎾 la raqueta en 3D: aro, cuerdas y puente, todo proyectado de verdad */
function pintaRaqueta(R, rgbMarco){
  capsula(R.mango, R.cuello, 0.017, [36,36,44]);
  const punto=(u,v)=>({x:R.centro.x+R.dir.x*v+R.lat.x*u, y:R.centro.y+R.dir.y*v+R.lat.y*u, z:R.centro.z+R.dir.z*v+R.lat.z*u});
  const P=q=>proyecta(q.x,q.y,q.z);
  const aro=[];
  for(let i=0;i<=20;i++){ const t=i/20*Math.PI*2; const q=P(punto(Math.sin(t)*0.125, Math.cos(t)*0.16)); if(!q) return; aro.push(q); }
  const esc=aro[0].s;
  /* las cuerdas, antes que el marco */
  ctx.save(); ctx.lineCap="round";
  ctx.strokeStyle="rgba(240,248,255,.55)"; ctx.lineWidth=Math.max(0.6,0.0045*esc);
  for(let k=-3;k<=3;k++){
    const u=k/4*0.125, h=0.16*Math.sqrt(Math.max(0,1-(u/0.125)*(u/0.125)));
    const a=P(punto(u,-h)), c=P(punto(u,h)); if(!a||!c) continue;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke();
  }
  for(let k=-3;k<=3;k++){
    const v=k/4*0.16, h=0.125*Math.sqrt(Math.max(0,1-(v/0.16)*(v/0.16)));
    const a=P(punto(-h,v)), c=P(punto(h,v)); if(!a||!c) continue;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke();
  }
  /* el puente: del cuello a los dos lados del aro */
  const cu=P(R.cuello), izq=P(punto(-0.09,-0.11)), der=P(punto(0.09,-0.11));
  ctx.strokeStyle="rgb("+rgbMarco.join(",")+")"; ctx.lineWidth=Math.max(1,0.012*esc);
  if(cu&&izq&&der){ ctx.beginPath(); ctx.moveTo(izq.x,izq.y); ctx.lineTo(cu.x,cu.y); ctx.lineTo(der.x,der.y); ctx.stroke(); }
  /* el marco: oscuro con un brillo encima */
  ctx.lineJoin="round";
  ctx.beginPath(); ctx.moveTo(aro[0].x,aro[0].y); for(const q of aro) ctx.lineTo(q.x,q.y);
  ctx.lineWidth=Math.max(1.2,0.020*esc); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=Math.max(0.6,0.007*esc); ctx.stroke();
  ctx.restore();
}
function pintaJugador(p, col, col2, esTu){
  const base=proyecta(p.x,0,p.z); if(!base) return;
  /* 🎾 en el suelo: el círculo de tu alcance y el aro de carga */
  if(esTu){
    const c=proyecta(p.x,0.015,p.z);
    if(c){
      const b=G.bola, aTiro=b.viva&&b.lado===1&&Math.hypot(b.x-p.x,b.z-p.z)<ALCANCE&&b.y<2.9;
      ctx.strokeStyle=aTiro?"rgba(216,255,122,.75)":"rgba(216,255,122,.22)";
      ctx.lineWidth=Math.max(1.2,(aTiro?0.05:0.028)*c.s);
      ctx.beginPath(); ctx.ellipse(c.x,c.y,ALCANCE*c.s,ALCANCE*c.s*0.34,0,0,7); ctx.stroke();
      if(aTiro){ ctx.fillStyle="rgba(216,255,122,.10)"; ctx.fill(); }
      if(p.cargando){
        ctx.strokeStyle="rgba(216,255,122,.85)"; ctx.lineWidth=Math.max(2,0.05*c.s);
        ctx.beginPath(); ctx.ellipse(c.x,c.y,0.75*c.s,0.26*c.s,0,-Math.PI/2,-Math.PI/2+p.carga*Math.PI*2); ctx.stroke();
      }
    }
  }
  /* la sombra: tres manchas a distintas alturas, desplazadas por el sol, que juntas forman la
     sombra alargada del cuerpo */
  sombra(p.x,p.z,0.34,1,0.05); sombra(p.x,p.z,0.28,0.55,1.0); sombra(p.x,p.z,0.17,0.35,1.6);
  const S=esqueleto(p);
  const camiseta=hexRgb(col), oscuro=hexRgb(col2);
  const pantalon = p.lado===0 ? PANTALON : [40,44,58];
  const partes=[];
  const cap=(a,b,r,c,sesgo,extra)=>partes.push({ z:(profCam(a)+profCam(b))/2-(sesgo||0), f:()=>{ capsula(a,b,r,c); if(extra) extra(); } });
  const esf=(c,r,colr,sesgo,extra)=>partes.push({ z:profCam(c)-(sesgo||0), f:()=>{ esfera(c,r,colr); if(extra) extra(); } });
  /* 🦵 piernas, calcetines y zapatillas */
  for(const [cad,rod,pie,punta] of [[S.caderaD,S.rodD,S.pieD,S.puntaD],[S.caderaI,S.rodI,S.pieI,S.puntaI]]){
    cap(cad,rod,0.086,PIEL);
    cap(rod,pie,0.066,PIEL);
    cap(mezcla(rod,pie,0.70),pie,0.071,CALCETIN,0.002);
    cap(pie,punta,0.064,ZAPA,0.004);
    cap(cad,mezcla(cad,rod,0.42),0.108,pantalon,0.003);   /* la pernera del pantalón */
  }
  esf(S.pelvis,0.175,pantalon,0.001);
  /* 👕 el torso y los hombros, con la camiseta del equipo y su número en la espalda */
  cap(S.pelvis,S.pechoTop,0.195,camiseta,0,()=>{
    if(p.lado!==0) return;                                 /* el número se ve en el de espaldas */
    const q=proyecta((S.pelvis.x+S.pechoTop.x)/2-S.fX*0.2,(S.pelvis.y+S.pechoTop.y)/2+0.06,(S.pelvis.z+S.pechoTop.z)/2-S.fZ*0.2);
    if(!q) return;
    ctx.save(); ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="900 "+Math.max(6,0.22*q.s)+"px Consolas,monospace";
    ctx.fillStyle="rgba(255,255,255,.88)"; ctx.fillText("7",q.x,q.y); ctx.restore();
  });
  cap(S.hombroI,S.hombroD,0.09,camiseta,0.001);
  cap(S.pechoTop,S.cuello,0.055,PIEL,0.002);
  /* 🙂 la cabeza: pelo, cara (con ojos en el que te mira) y gorra con visera */
  esf({x:S.cabeza.x-S.fX*0.03,y:S.cabeza.y-0.03,z:S.cabeza.z-S.fZ*0.03},0.121,PELO);
  esf(S.cabeza,0.118,PIEL,0.002,()=>{
    if(p.lado!==1) return;
    for(const sd of [-1,1]){
      const q=proyecta(S.cabeza.x+S.fX*0.11+S.rX*sd*0.045, S.cabeza.y+0.01, S.cabeza.z+S.fZ*0.11+S.rZ*sd*0.045);
      if(!q) continue;
      ctx.fillStyle="#2a1d14"; ctx.beginPath(); ctx.arc(q.x,q.y,Math.max(0.7,0.013*q.s),0,7); ctx.fill();
    }
  });
  esf({x:S.cabeza.x,y:S.cabeza.y+0.055,z:S.cabeza.z},0.112,camiseta,0.004);
  cap({x:S.cabeza.x+S.fX*0.05,y:S.cabeza.y+0.035,z:S.cabeza.z+S.fZ*0.05},
      {x:S.cabeza.x+S.fX*0.19,y:S.cabeza.y+0.03,z:S.cabeza.z+S.fZ*0.19},0.035,oscuro,0.006);
  /* 💪 los brazos, con manga, muñequera y mano */
  for(const [hom,codo,mano] of [[S.hombroD,S.codoD,S.manoD],[S.hombroI,S.codoI,S.manoI]]){
    cap(hom,codo,0.058,PIEL);
    cap(codo,mano,0.050,PIEL);
    cap(hom,mezcla(hom,codo,0.45),0.070,camiseta,0.002);  /* la manga */
    cap(mezcla(codo,mano,0.78),mezcla(codo,mano,0.94),0.056,camiseta,0.003);   /* la muñequera */
    esf(mano,0.046,PIEL,0.004);
  }
  /* 🎾 la raqueta */
  partes.push({ z:profCam(S.raqueta.centro), f:()=>pintaRaqueta(S.raqueta, oscuro) });
  /* y a pintar: de lo más lejano a lo más cercano */
  partes.sort((a,b)=>b.z-a.z);
  for(const q of partes) q.f();
}

function pintaBola(){
  const b=G.bola;
  /* la sombra en el suelo, que es lo que te dice dónde está de verdad */
  sombra(b.x,b.z,0.13, Math.max(0.3,1-b.y*0.10), b.y);
  /* la estela */
  for(const e of b.estela){
    const p=proyecta(e.x,e.y,e.z); if(!p||e.v<=0) continue;
    ctx.fillStyle="rgba(230,255,120,"+(e.v*0.35).toFixed(3)+")";
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.8,0.045*p.s*e.v),0,7); ctx.fill();
  }
  const p=proyecta(b.x,b.y,b.z); if(!p) return;
  const r=Math.max(1.8,0.0335*p.s*1.15);
  /* ⚪ la pelota: iluminada del lado del sol, con su brillo y su lado de sombra */
  const L=luzPantalla(b.x,b.y,b.z);
  const g=ctx.createRadialGradient(p.x+L.x*r*0.42,p.y+L.y*r*0.42,r*0.06,p.x,p.y,r);
  g.addColorStop(0,"#fdffd8"); g.addColorStop(0.35,"#e8ff6a"); g.addColorStop(0.8,"#b3cf24"); g.addColorStop(1,"#6d8212");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.75)"; ctx.lineWidth=Math.max(0.6,r*0.16);
  ctx.beginPath(); ctx.arc(p.x,p.y,r*0.92,0.6,2.2); ctx.stroke();
}

/* 🎯 la marca de TU golpe: mientras cargas (o con el golpe guardado), se ve la curva que va a
      hacer la bola y la diana donde va a botar. Verde si entra, roja si se va fuera, y un
      aviso si se come la red */
function pintaApunte(){
  const p=G.jug, b=G.bola;
  const g=p.cargando ? { tipo:p.tipo, carga:Math.max(0.15,p.carga), mira:p.mira, prof:(p.prof===undefined?0.55:p.prof) }
        : p.guardado ? p.guardado : null;
  if(!g || G.estado==="saque") return;
  /* desde dónde saldría: la bola si ya la tienes cerca, si no el sitio de tu raqueta */
  const cerca = b.viva && b.lado===1 && Math.hypot(b.x-p.x,b.z-p.z)<ALCANCE*1.3;
  const desde = cerca ? {x:b.x, y:Math.max(0.5,b.y), z:b.z} : {x:p.x+0.35*(p.dirRaqueta||1), y:1.0, z:p.z+0.3};
  const v=velGolpe(desde, 0, g.tipo, g.carga, g.mira*ANCHO*0.44, g.prof, false);
  const sim=simulaTiro(desde, v);
  const dentro = !sim.red && dentroDePista(sim.x, sim.z, false);
  const col = sim.red ? "255,190,80" : dentro ? "216,255,122" : "255,110,110";
  /* la curva, a puntitos */
  ctx.save();
  for(let i=0;i<sim.camino.length;i+=2){
    const c=sim.camino[i], q=proyecta(c.x,c.y,c.z); if(!q) continue;
    const a=0.25+0.55*(i/sim.camino.length);
    ctx.fillStyle="rgba("+col+","+a.toFixed(2)+")";
    ctx.beginPath(); ctx.arc(q.x,q.y,Math.max(1,0.028*q.s),0,7); ctx.fill();
  }
  /* la diana en el suelo */
  const q=proyecta(sim.x,0.02,sim.z);
  if(q){
    const late=1+0.12*Math.sin(G.t*9);
    for(const [r,a] of [[0.62,0.85],[0.38,0.6],[0.14,0.95]]){
      ctx.strokeStyle="rgba("+col+","+a+")"; ctx.lineWidth=Math.max(1.5,0.045*q.s);
      ctx.beginPath(); ctx.ellipse(q.x,q.y,r*q.s*late,r*q.s*0.34*late,0,0,7); ctx.stroke();
    }
    ctx.fillStyle="rgba("+col+",.18)";
    ctx.beginPath(); ctx.ellipse(q.x,q.y,0.62*q.s*late,0.62*q.s*0.34*late,0,0,7); ctx.fill();
    ctx.font="800 "+Math.max(10,0.30*q.s)+"px Consolas,monospace"; ctx.textAlign="center";
    ctx.fillStyle="rgba("+col+",.95)";
    ctx.fillText(sim.red?"🥅 RED":dentro?"DENTRO":"FUERA", q.x, q.y-0.55*q.s);
  }
  ctx.restore();
}
function pintaMarcaBote(){
  /* dónde va a botar: el círculo que te deja llegar a tiempo */
  const b=G.bola; if(!b.viva||b.vy>0&&b.y>3) return;
  let x=b.x,y=b.y,z=b.z,vy=b.vy,vx=b.vx,vz=b.vz;
  for(let i=0;i<200;i++){ const h=1/120; vy-=G_GRAV*h; x+=vx*h; y+=vy*h; z+=vz*h;
    if(y<=0.04&&vy<0) break; }
  const p=proyecta(x,0.02,z); if(!p) return;
  const dentro=dentroDePista(x,z,G.estado==="saque");
  ctx.strokeStyle=dentro?"rgba(216,255,122,.8)":"rgba(255,110,110,.8)";
  ctx.lineWidth=Math.max(1.5,0.04*p.s);
  ctx.beginPath(); ctx.ellipse(p.x,p.y,0.42*p.s,0.15*p.s,0,0,7); ctx.stroke();
  ctx.fillStyle=dentro?"rgba(216,255,122,.18)":"rgba(255,110,110,.18)";
  ctx.fill();
}

function pintaHUD(){
  const R=Math.max(11,Math.min(W,H)*0.020);
  /* el marcador, arriba a la izquierda como en los partidos de verdad */
  const w=Math.min(W*0.44,R*21), h=R*4.4, x=R, y=R;
  ctx.fillStyle="rgba(6,20,12,.82)"; ctx.strokeStyle="rgba(216,255,122,.35)"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.fill(); ctx.stroke();
  ctx.font="800 "+R+"px Consolas,monospace"; ctx.textAlign="left";
  const filas=[["🟢 TÚ",0],["🔴 RIVAL",1]];
  filas.forEach(([nom,i],k)=>{
    const fy=y+R*1.6+k*R*1.8;
    ctx.fillStyle=G.saca===i?"#d8ff7a":"#cfe8d8";
    ctx.fillText((G.saca===i?"● ":"  ")+nom, x+R*0.5, fy);
    ctx.textAlign="right";
    ctx.fillStyle="#9fd8b4"; ctx.fillText(String(G.sets_g[i]), x+w-R*4.6, fy);
    ctx.fillStyle="#cfe8d8"; ctx.fillText(String(G.juegos[i]), x+w-R*2.9, fy);
    ctx.fillStyle="#d8ff7a"; ctx.font="900 "+(R*1.15)+"px Consolas,monospace";
    ctx.fillText(textoPts(i), x+w-R*0.6, fy);
    ctx.font="800 "+R+"px Consolas,monospace";
    ctx.textAlign="left";
  });
  /* la barra de carga del golpe */
  const p=G.jug;
  if(p.cargando){
    const bw=Math.min(W*0.30,R*16), bx=CX-bw/2, by=H-R*4.2;
    ctx.fillStyle="rgba(6,20,12,.75)"; ctx.fillRect(bx-2,by-2,bw+4,R*1.1+4);
    const g=ctx.createLinearGradient(bx,0,bx+bw,0);
    g.addColorStop(0,"#7ad1ff"); g.addColorStop(0.6,"#d8ff7a"); g.addColorStop(1,"#ff7a7a");
    ctx.fillStyle=g; ctx.fillRect(bx,by,bw*p.carga,R*1.1);
    ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,R*1.1);
    ctx.textAlign="center"; ctx.fillStyle="#eaf6ff"; ctx.font="800 "+(R*0.95)+"px Consolas,monospace";
    ctx.fillText(TIPOS[p.tipo].nom+"  ·  "+Math.round(p.carga*100)+"%", CX, by-R*0.45);
    /* la flecha de a dónde apuntas */
    const ax=CX+p.mira*bw*0.5;
    ctx.fillStyle="#d8ff7a"; ctx.beginPath();
    ctx.moveTo(ax,by-R*1.5); ctx.lineTo(ax-R*0.4,by-R*0.9); ctx.lineTo(ax+R*0.4,by-R*0.9); ctx.closePath(); ctx.fill();
  }
  /* el saque */
  if(G.estado==="saque"&&G.saca===0){
    ctx.textAlign="center"; ctx.font="800 "+(R*1.05)+"px Consolas,monospace";
    ctx.fillStyle="rgba(216,255,122,"+(0.6+0.4*Math.sin(G.t*5)).toFixed(2)+")";
    ctx.fillText(G.saqueFase===0?"SAQUE: pulsa un golpe para lanzar la bola":"¡SUELTA con la bola arriba!", CX, H-R*6);
  }
  /* el cartel del punto */
  if(G.msgT>0){
    ctx.textAlign="center";
    ctx.font="900 "+Math.round(Math.min(W,H)*0.052)+"px Consolas,monospace";
    ctx.globalAlpha=Math.min(1,G.msgT);
    ctx.lineWidth=5; ctx.strokeStyle="rgba(0,0,0,.6)"; ctx.strokeText(G.msg,CX,H*0.30);
    ctx.fillStyle="#f2ffe0"; ctx.fillText(G.msg,CX,H*0.30);
    ctx.globalAlpha=1;
  }
  /* el rally */
  if(G.rally>2){
    ctx.font="800 "+R+"px Consolas,monospace";
    const txtR="🎾 "+G.rally+" golpes", anchoR=ctx.measureText(txtR).width;
    ctx.fillStyle="rgba(6,20,12,.84)"; ctx.fillRect(x, y+h+R*0.45, anchoR+R*1.0, R*1.5);   /* fondo, que encima del público no se leía */
    ctx.textAlign="left"; ctx.fillStyle="rgba(216,255,122,.95)";
    ctx.fillText(txtR, x+R*0.5, y+h+R*1.5);
  }
}

function dibuja(){
  pintaCielo();
  pintaSuelo();
  pintaEstadio();
  pintaPista();
  pintaVallas();
  pintaGente();
  /* lo que está más lejos, primero */
  const cosas=[{z:G.ia.z, f:()=>pintaJugador(G.ia,"#d94f4f","#7a2020",false)},
               {z:RED_Z, f:pintaRed},
               {z:G.jug.z, f:()=>pintaJugador(G.jug,"#4fd97a","#1e6a35",true)},
               {z:G.bola.z, f:pintaBola}];
  cosas.sort((a,b)=>b.z-a.z);
  pintaMarcaBote();
  pintaSombraRed();
  for(const c of cosas) c.f();
  pintaApunte();
  pintaDestello();
  pintaLuzSol();
  pintaHUD();
}

/* ============================ BUCLE ============================ */
/* la cámara se mueve un pelín con la bola y con tu jugador: sin esto todo parece una foto */
function camaraCorre(dt){
  const b=G.bola, obj = b.viva? (b.x*0.55+G.jug.x*0.45) : G.jug.x*0.7;
  CAM.x += (Math.max(-3.4,Math.min(3.4,obj*0.62)) - CAM.x) * Math.min(1,dt*2.4);
  const alto = b.viva&&b.y>2.6 ? 13.2 : 12.5;              /* si la bola sube mucho, la cámara también */
  CAM.y += (alto-CAM.y)*Math.min(1,dt*1.6);
}
let ultimo=0;
function vuelta(ts){
  if(!G.run) return;
  const crudo=ts-ultimo;
  const dt=Math.min(0.05,crudo/1000)||1/60; ultimo=ts;
  vigilaRendimiento(crudo);
  G.t+=dt;
  camaraCorre(dt);
  animaJugador(G.jug,dt); animaJugador(G.ia,dt);
  if(G.msgT>0) G.msgT-=dt;
  if(G.estado==="fin_punto"){
    G.esperaT-=dt;
    if(G.esperaT<=0 && !G.fin) preparaSaque();
  } else {
    humanoCorre(dt);
    iaCorre(dt);
    bolaCorre(dt);
    if(G.estado==="saque"&&G.bola.viva) G.estado="juego";
  }
  dibuja();
  requestAnimationFrame(vuelta);
}

function acaba(quien){
  G.fin=true; G.run=false;
  const gano=quien===0;
  $("finTit").textContent=gano?"🏆 ¡GANASTE!":"😤 GANÓ EL RIVAL";
  $("finTxt").innerHTML="Sets <b>"+G.sets_g[0]+" - "+G.sets_g[1]+"</b><br>"+
    "🎾 peloteo más largo: <b>"+G.rallyMax+"</b> golpes<br>"+
    "💥 aces: <b>"+G.aces+"</b> · puntos ganadores: <b>"+G.winners+"</b>";
  try{ const k="edtu_ten_wins"; if(gano) localStorage.setItem(k,String((parseInt(localStorage.getItem(k)||"0",10)||0)+1));
       localStorage.setItem("edtu_ten_rally",String(Math.max(G.rallyMax,parseInt(localStorage.getItem("edtu_ten_rally")||"0",10)||0)));
       if(window.parent&&window.parent!==window&&window.parent.edtuPlayDay) window.parent.edtuPlayDay("🎾 TENIS",G.sets_g[0]+"-"+G.sets_g[1]); }catch(e){}
  publico(gano?1:0.3);
  $("fin").classList.remove("hide");
}

/* ============================ MENÚ ============================ */
function pintaOpciones(){
  $("optDif").innerHTML=Object.keys(DIFS).map(d=>
    '<button class="opt'+(G.dif===d?' sel':'')+'" data-dif="'+d+'">'+DIFS[d].nom+'</button>').join("");
  $("optSets").innerHTML=[1,3].map(s=>
    '<button class="opt'+(G.sets===s?' sel':'')+'" data-sets="'+s+'">'+(s===1?"1 SET":"3 SETS")+'</button>').join("");
  $("optDif").querySelectorAll("[data-dif]").forEach(b=>b.onclick=()=>{ G.dif=b.dataset.dif; pintaOpciones(); });
  $("optSets").querySelectorAll("[data-sets]").forEach(b=>b.onclick=()=>{ G.sets=+b.dataset.sets; pintaOpciones(); });
  /* 🖥️ los botones de calidad dicen a cuántos píxeles se dibuja DE VERDAD en tu pantalla */
  $("optCal").innerHTML=Object.keys(CALIDADES).map(c=>{
    const k=escalaRender(c,innerWidth,innerHeight,window.devicePixelRatio||1);
    return '<button class="opt'+(CALIDAD===c?' sel':'')+'" data-cal="'+c+'">🖥️ '+CALIDADES[c].nom+
      ' <span style="opacity:.75">'+Math.round(innerWidth*k)+'×'+Math.round(innerHeight*k)+'</span></button>';
  }).join("");
  $("optCal").querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>{ CALIDAD=b.dataset.cal;
    try{ localStorage.setItem("edtu_ten_cal",CALIDAD); }catch(e){} resize(); pintaOpciones(); });
  const tact=ES_TACTIL();
  $("ayudaTxt").innerHTML = tact
    ? "📱 <b>arrastra</b> por la izquierda para moverte<br>y los cuatro botones de la derecha son los golpes:<br><b>PLANO · LIFT · CORTE · GLOBO</b><br>mantén para cargar y <b>suelta</b> para pegar<br>el saque va en dos tiempos: uno para lanzar y otro para golpear"
    : "🎮 <span class='k'>WASD</span> moverte · <span class='k'>SHIFT</span> esprintar<br>"+
      "<span class='k'>J</span> plano · <span class='k'>K</span> liftado · <span class='k'>L</span> cortado · <span class='k'>I</span> globo<br>"+
      "<b>mantén</b> el botón para cargar: mientras cargas, <b>WASD apunta</b> y ves en la pista <b>dónde va a caer</b> · <b>suelta</b> para pegar<br>"+
      "el saque va en dos tiempos: pulsas para lanzar y sueltas con la bola arriba<br>"+
      "🎮 con mando: palanca para moverte · <b>B</b> plano · <b>A</b> liftado · <b>X</b> cortado · <b>Y</b> globo · RT esprint<br>"+
      "🎯 mantén un golpe y mueve el <b>STICK IZQUIERDO</b>: apuntas a los lados y al fondo, y la diana te dice si entra";
  try{ const w=parseInt(localStorage.getItem("edtu_ten_wins")||"0",10)||0, r=parseInt(localStorage.getItem("edtu_ten_rally")||"0",10)||0;
    $("mejorTxt").innerHTML=(w?"🏆 partidos ganados: <b>"+w+"</b>":"")+(r?" · 🎾 mejor peloteo: <b>"+r+"</b> golpes":""); }catch(e){}
}
function empieza(){
  ac();
  $("intro").classList.add("hide"); $("fin").classList.add("hide");
  const tact=ES_TACTIL();
  $("tactil").classList.toggle("off",!tact);
  nuevoPartido(); G.run=true; ultimo=performance.now();
  requestAnimationFrame(vuelta);
}
function salir(){
  G.run=false;
  try{ if(window.parent&&window.parent!==window){ if(window.parent.wallyCerrarPaneles) window.parent.wallyCerrarPaneles();
        const d=window.parent.document.getElementById("tenFs"); if(d) d.classList.remove("open"); return; } }catch(e){}
  location.href="index.html";
}
/* 🎮 el mando sirve TAMBIÉN en los menús de aquí: A empieza, B sale.
      Y ojo: mientras juegas, el cuartel de detrás ya no le hace caso al mando (se arregló allí) */
(function mandoMenus(){
  let antes={};
  function mira(){
    requestAnimationFrame(mira);
    if(G.run) return;                                      /* jugando manda el juego, no el menú */
    const g=padCrudo(); if(!g) return;
    const b=i=>g.btn(i);
    const nuevo=i=>{ const p=b(i), f=antes[i]; antes[i]=p; return p&&!f; };
    if(nuevo(0)) empieza();                                /* A */
    if(nuevo(1)) salir();                                  /* B */
    /* la cruceta y la palanca cambian dificultad y sets */
    const ax=g.axes[0]||0;
    if(nuevo(14)||(ax<-0.6&&!antes._izq)){ antes._izq=true; cambiaDif(-1); } else if(ax>-0.6) antes._izq=false;
    if(nuevo(15)||(ax>0.6&&!antes._der)){ antes._der=true; cambiaDif(1); } else if(ax<0.6) antes._der=false;
  }
  requestAnimationFrame(mira);
})();
function cambiaDif(d){
  const ks=Object.keys(DIFS), i=ks.indexOf(G.dif);
  G.dif=ks[(i+d+ks.length)%ks.length]; pintaOpciones(); sonido("bote",0.3);
}
$("jugarBtn").onclick=empieza;
$("otraBtn").onclick=empieza;
$("menuBtn").onclick=salir;
$("salirBtn").onclick=salir;
pintaOpciones();
/* una pintura de fondo mientras miras el menú */
G.jug=nuevoJugador(0); G.ia=nuevoJugador(1); G.bola=nuevaBola();
(function fondo(){ if(G.run) return; G.t+=1/60; dibuja(); requestAnimationFrame(fondo); })();

/* 📸 MODO FOTO: tennis.html#foto congela un momento del peloteo (sin menú y sin moverse), para
      poder sacar capturas y comprobar cómo se ve de verdad. Jugando normal no hace nada */
if(/foto/.test((location&&location.hash)||"")){
  $("intro").classList.add("hide"); $("tactil").classList.add("off");
  nuevoPartido();
  G.estado="juego"; G.pts=[2,1]; G.juegos=[3,2]; G.rally=7; G.t=12;
  const J=G.jug, I=G.ia, B=G.bola;
  Object.assign(J,{ x:0.6, z:-0.8, cargando:true, carga:0.75, tipo:"lift", mira:-0.45, prof:0.8, ladoGolpe:1, velA:0, zancada:0 });
  Object.assign(I,{ x:-1.6, z:LARGO+0.9, swing:0.07, _swingIni:0.30, ladoGolpe:-1, fueSaque:false, velA:2.2, zancada:1.3 });
  Object.assign(B,{ viva:true, lado:1, botes:1, x:1.5, y:1.25, z:4.8, vx:0.25, vy:-0.8, vz:-14, giro:0.4 });
  B.estela=[]; for(let i=12;i>=1;i--) B.estela.push({ x:B.x-B.vx*i*0.016, y:B.y-B.vy*i*0.016, z:B.z-B.vz*i*0.016, v:1-i/13 });
  for(let i=0;i<40;i++) camaraCorre(0.05);
}
