function particulasCorren(dt){
  for(let i=PARTS.length-1;i>=0;i--){ const q=PARTS[i]; q.vida-=dt; if(q.vida<=0){ PARTS[i]=PARTS[PARTS.length-1]; PARTS.pop(); continue; }
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt; q.vy+=q.sube*dt; q.vx*=Math.exp(-dt*1.5); q.vz*=Math.exp(-dt*1.5); q.tam+=q.crece*dt; }
}

/* ================= 🖌️ DIBUJAR UN FOTOGRAMA ================= */
const RENDER={ w:1920, h:1080, vp:null, cam:null };
function uniformesLuz(p,t){
  gl.uniform3f(U(p,"uCam"),RENDER.cam.x,RENDER.cam.y,RENDER.cam.z);
  gl.uniform3f(U(p,"uSol"),SOL.x,SOL.y,SOL.z); gl.uniform3fv(U(p,"uSolCol"),LUZ.sol);
  gl.uniform3fv(U(p,"uCenit"),LUZ.cenit); gl.uniform3fv(U(p,"uHorizonte"),LUZ.horizonte); gl.uniform3fv(U(p,"uSuelo"),LUZ.suelo); gl.uniform3fv(U(p,"uNiebla"),LUZ.niebla);
  gl.uniform1f(U(p,"uNieblaD"),LUZ.nieblaD); gl.uniform1f(U(p,"uTiempo"),t);
  gl.uniform1f(U(p,"uEmi"),LUZ.emisivo); gl.uniform1f(U(p,"uNoche"),LUZ.noche);
  gl.uniformMatrix4fv(U(p,"uLuzVP"),false,RENDER.luzVP); gl.uniform1f(U(p,"uHaySombra"),RENDER.sombras?1:0);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,FBO.sombra.tex); gl.uniform1i(U(p,"uSombra"),2);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,TEX.det); gl.uniform1i(U(p,"uDet"),1);
}
/* 🧭 la ruta: se rehace cada vez que cambia (se borra el VAO viejo, como hace subeCoche) */
function ponRuta(pts,col){
  quitaRuta();
  if(!pts||pts.length<2) return;
  /* 🧭 se quitan los puntos que caen encima del coche: si no, el primer tramo pasa por debajo de la
        cámara y se ve como una losa que tapa media carretera */
  const C=(typeof G!=="undefined")?G.coche:null;
  if(C){ const lejos=pts.filter(p=>Math.hypot(p.x-C.x,p.z-C.z)>12); if(lejos.length>1) pts=lejos; }
  ESC.ruta=subeMalla(obraLinea(pts,col,1.2,0.6).malla());
}
function quitaRuta(){ if(ESC.ruta){ gl.deleteVertexArray(ESC.ruta.vao); ESC.ruta=null; } }
function dibuja(M,modelo,modo,tex){
  const p=PROGS.mundo;
  gl.uniformMatrix4fv(U(p,"uM"),false,modelo||ID4); gl.uniform1f(U(p,"uModo"),modo||0);
  if(tex){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex); gl.uniform1i(U(p,"uTex"),0); }
  gl.bindVertexArray(M.vao); gl.drawElements(gl.TRIANGLES,M.n,M.tipo,0);
}
const ID4=m4();
function matricesRuedas(C,Mc){
  const out=[];
  const MO=modeloActual();
  for(const z of ruedasZDe(MO)) for(const sx of [-1,1]){
    let m=m4Mul(Mc,m4Trasl(sx*VIA*MO.ancho,RUEDA_R+0.01,z));
    if(z>0) m=m4Mul(m,m4RotY(-C.direccion*0.5));   /* las ruedas de delante miran hacia donde gira de verdad */
    m=m4Mul(m,m4RotX(C.vuelta)); out.push(m);
  }
  return out;
}
let pinosCercaT=-1;
function dibujaFotograma(C,K,t,efectos){
  const W=RENDER.w, H=RENDER.h;
  RENDER.cam=v3(K.x,K.y,K.z);
  /* 📱 en vertical se abre el objetivo: con una pantalla estrecha, el campo de visión a lo ancho se
        quedaba en nada y el coche llenaba media pantalla */
  const asp=W/H, fovV=K.fov*(asp<1.3?clamp(1.30/asp,1,1.18):1);   /* poco: más abierto deforma los bordes */
  const P=m4Persp(fovV,asp,0.35,4600), V=m4Mirar(RENDER.cam,K.mira,v3(0,1,0));
  RENDER.vp=m4Mul(P,V);
  /* la inclinación del coche según el suelo que pisa (solo para dibujarlo) */
  if(C.enSuelo){ const fx=Math.sin(C.rumbo), fz=Math.cos(C.rumbo);
    const yf=sueloEn(C.x+fx*1.35,C.z+fz*1.35).y, yb=sueloEn(C.x-fx*1.35,C.z-fz*1.35).y, yr=sueloEn(C.x+fz*0.85,C.z-fx*0.85).y, yl=sueloEn(C.x-fz*0.85,C.z+fx*0.85).y;
    C.inclCab=lerp(C.inclCab||0,Math.atan2(yf-yb,2.7),0.35); C.inclAl=lerp(C.inclAl||0,Math.atan2(yl-yr,1.7),0.35); }
  const Mc=m4Coche(C.x,C.y+0.02,C.z,C.rumbo,(C.inclCab||0)+C.cabeceo,(C.inclAl||0)+C.alabeo), MR=matricesRuedas(C,Mc);

  /* 1) 🌑 las sombras: un mapa de 4.096 px que cubre 220 m alrededor del coche, con el paso cuadrado a su píxel */
  RENDER.sombras=AJUSTES.sombras!==false;
  const tam=110, texel=2*tam/4096;
  const cx=Math.round(C.x/texel)*texel, cz=Math.round(C.z/texel)*texel;
  const LV=m4Mirar(v3(cx+SOL.x*500,C.y+SOL.y*500,cz+SOL.z*500),v3(cx,C.y,cz),v3(0,1,0));
  RENDER.luzVP=m4Mul(m4Orto(-tam,tam,-tam,tam,50,1100),LV);
  if(RENDER.sombras){
    if(t-pinosCercaT>0.4 || pinosCercaT<0){ pinosCercaT=t;
      const cerca=ARBOLES.filter(a=>Math.abs(a.x-C.x)<150&&Math.abs(a.z-C.z)<150);
      gl.bindBuffer(gl.ARRAY_BUFFER,ESC.pinosCerca.buf); gl.bufferSubData(gl.ARRAY_BUFFER,0,datosPinos(cerca)); ESC.pinosCerca.cuantos=cerca.length; }
    gl.bindFramebuffer(gl.FRAMEBUFFER,FBO.sombra.fb); gl.viewport(0,0,4096,4096);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.clear(gl.DEPTH_BUFFER_BIT); gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(2,6);
    let p=PROGS.sombra; gl.useProgram(p); gl.uniformMatrix4fv(U(p,"uLuzVP"),false,RENDER.luzVP);
    const sm=(M,m)=>{ gl.uniformMatrix4fv(U(p,"uM"),false,m||ID4); gl.bindVertexArray(M.vao); gl.drawElements(gl.TRIANGLES,M.n,M.tipo,0); };
    sm(ESC.coche,Mc); for(const m of MR) sm(ESC.rueda,m);
    for(const v of TRAFICO) if(Math.abs(v.x-C.x)<120&&Math.abs(v.z-C.z)<120) sm(ESC.trafico[v.malla],m4Coche(v.x,v.y,v.z,v.rumbo,0,0));
    for(const P of POLICIA.coches) if(Math.abs(P.x-C.x)<120&&Math.abs(P.z-C.z)<120) sm(ESC.trafico[POLI_MALLA],m4Coche(P.x,P.y,P.z,P.rumbo,0,0));
    for(const R of RIVALES){ const M=m4Coche(R.x,R.y+0.02,R.z,R.rumbo,0,0); sm(ESC.rivales[R.malla],M); for(const m of matricesRuedas({direccion:0,vuelta:R.vuelta},M)) sm(ESC.rueda,m); }
    sm(ESC.fachadas); sm(ESC.azoteas); sm(ESC.casas); sm(ESC.detalles); sm(ESC.arcenes);
    p=PROGS.sombraArbol; gl.useProgram(p); gl.uniformMatrix4fv(U(p,"uLuzVP"),false,RENDER.luzVP);
    gl.bindVertexArray(ESC.pinosCerca.vao); gl.drawElementsInstanced(gl.TRIANGLES,ESC.pinosCerca.n,ESC.pinosCerca.tipo,0,ESC.pinosCerca.cuantos);
    gl.disable(gl.POLYGON_OFFSET_FILL);
  }

  /* 2) 🌄 la escena, en el lienzo con antialiasing */
  gl.bindFramebuffer(gl.FRAMEBUFFER,FBO.escena.fb); gl.viewport(0,0,W,H);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  let p=PROGS.cielo; gl.useProgram(p); uniformesLuz(p,t);
  const fw=vNorm(vRes(K.mira,RENDER.cam)), de=vNorm(vCruz(fw,v3(0,1,0))), ar=vCruz(de,fw), tanY=Math.tan(fovV/2);
  gl.uniform3f(U(p,"uFw"),fw.x,fw.y,fw.z); gl.uniform3f(U(p,"uDer"),de.x,de.y,de.z); gl.uniform3f(U(p,"uArr"),ar.x,ar.y,ar.z); gl.uniform2f(U(p,"uTan"),tanY*W/H,tanY);
  gl.bindVertexArray(null); gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  p=PROGS.mundo; gl.useProgram(p); uniformesLuz(p,t); gl.uniformMatrix4fv(U(p,"uVP"),false,RENDER.vp);
  dibuja(ESC.terreno,null,1);
  gl.disable(gl.CULL_FACE);
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(-1,-2);
  for(const tpo in ESC.carr) dibuja(ESC.carr[tpo],null,2,TEX.carr[tpo]);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  dibuja(ESC.arcenes,null,0); dibuja(ESC.agua,null,3);
  gl.enable(gl.CULL_FACE);
  dibuja(ESC.fachadas,null,2,TEX.fachada); dibuja(ESC.azoteas,null,0); dibuja(ESC.casas,null,0); dibuja(ESC.detalles,null,0);
  gl.disable(gl.CULL_FACE);
  dibuja(ESC.flechas,null,2,TEX.flecha); dibuja(ESC.carteles,null,2,TEX.carteles);
  if(ESC.ruta) dibuja(ESC.ruta,null,0);   /* 🧭 la línea de la ruta, por el suelo */
  gl.enable(gl.CULL_FACE);
  dibuja(ESC.coche,Mc,0); for(const m of MR) dibuja(ESC.rueda,m,0);
  for(const v of TRAFICO) dibuja(ESC.trafico[v.malla],m4Coche(v.x,v.y,v.z,v.rumbo,0,0),0);
  for(const P of POLICIA.coches) dibuja(ESC.trafico[POLI_MALLA],m4Coche(P.x,P.y,P.z,P.rumbo,0,0),0);
  for(const R of RIVALES){ const M=m4Coche(R.x,R.y+0.02,R.z,R.rumbo,0,0); dibuja(ESC.rivales[R.malla],M,0); for(const m of matricesRuedas({direccion:0,vuelta:R.vuelta},M)) dibuja(ESC.rueda,m,0); }
  gl.disable(gl.CULL_FACE);
  p=PROGS.arbol; gl.useProgram(p); uniformesLuz(p,t); gl.uniformMatrix4fv(U(p,"uVP"),false,RENDER.vp); gl.uniform1f(U(p,"uModo"),0);
  gl.bindVertexArray(ESC.pinos.vao); gl.drawElementsInstanced(gl.TRIANGLES,ESC.pinos.n,ESC.pinos.tipo,0,ESC.pinos.cuantos);

  /* ✨ partículas: primero el humo (mezcla), luego lo que brilla (suma) */
  if(PARTS.length){
    p=PROGS.part; gl.useProgram(p); gl.uniformMatrix4fv(U(p,"uVP"),false,RENDER.vp); gl.uniform3f(U(p,"uDer"),de.x,de.y,de.z); gl.uniform3f(U(p,"uArr"),ar.x,ar.y,ar.z);
    gl.depthMask(false); gl.enable(gl.BLEND); gl.bindVertexArray(ESC.part.vao);
    /* tres grupos: humo (se mezcla), lo que brilla (se suma) y lo que va tumbado en el suelo (el neón) */
    for(const grupo of ["humo","luz","plano"]){
      const D=ESC.partDatos; let n=0;
      for(const q of PARTS){ const g=q.plano?"plano":q.luz?"luz":"humo"; if(g!==grupo) continue; const k=n*8, f=q.vida/q.max;
        D[k]=q.x; D[k+1]=q.y; D[k+2]=q.z; D[k+3]=q.tam; D[k+4]=q.r; D[k+5]=q.g; D[k+6]=q.b;
        D[k+7]=q.a*(grupo==="humo"?Math.min(1,f*1.6):grupo==="luz"?f:1); n++; }
      if(!n) continue;
      gl.bindBuffer(gl.ARRAY_BUFFER,ESC.part.buf); gl.bufferSubData(gl.ARRAY_BUFFER,0,D,0,n*8);
      gl.uniform1f(U(p,"uPlano"),grupo==="plano"?1:0);
      if(grupo==="humo") gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA); else gl.blendFunc(gl.ONE,gl.ONE);
      if(grupo==="plano"){ gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(-2,-8); }
      gl.drawElementsInstanced(gl.TRIANGLES,6,gl.UNSIGNED_SHORT,0,n);
      if(grupo==="plano") gl.disable(gl.POLYGON_OFFSET_FILL);
    }
    gl.disable(gl.BLEND); gl.depthMask(true);
  }

  /* 3) 🎬 resolver el antialiasing, el bloom y el paso final a la pantalla */
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,FBO.escena.fb); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,FBO.resuelta.fb);
  gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT,gl.NEAREST);
  gl.disable(gl.DEPTH_TEST); gl.bindVertexArray(null);
  const pasada=(prog,destino,fuente,extra)=>{ gl.bindFramebuffer(gl.FRAMEBUFFER,destino?destino.fb:null); gl.viewport(0,0,destino?destino.w:W,destino?destino.h:H);
    gl.useProgram(prog); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,fuente.tex); gl.uniform1i(U(prog,"uImg"),0); if(extra) extra(prog); gl.drawArrays(gl.TRIANGLES,0,3); };
  pasada(PROGS.brillo,FBO.bloomA,FBO.resuelta);
  for(let i=0;i<2;i++){
    pasada(PROGS.blur,FBO.bloomB,FBO.bloomA,q=>gl.uniform2f(U(q,"uDir"),(1+i)/FBO.bloomA.w,0));
    pasada(PROGS.blur,FBO.bloomA,FBO.bloomB,q=>gl.uniform2f(U(q,"uDir"),0,(1+i)/FBO.bloomA.h));
  }
  const sp=m4Proyecta(RENDER.vp,vSum(RENDER.cam,vEsc(SOL,2000)));
  pasada(PROGS.final,null,FBO.resuelta,q=>{
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,FBO.bloomA.tex); gl.uniform1i(U(q,"uBloom"),1);
    gl.uniform1f(U(q,"uVel"),efectos.vel); gl.uniform1f(U(q,"uExpo"),(efectos.expo||1.0)*LUZ.expo); gl.uniform1f(U(q,"uFlash"),efectos.flash||0);
    const vis=sp?clamp(1-Math.max(Math.abs(sp.x-0.5),Math.abs(sp.y-0.5))*1.4,0,1):0;
    gl.uniform3f(U(q,"uSolPant"),sp?sp.x:0,sp?1-sp.y:0,vis); gl.uniform3fv(U(q,"uSolCol"),LUZ.sol);
  });
  gl.enable(gl.DEPTH_TEST);
}

/* ================= 🎮 AJUSTES, CONTROLES Y SONIDO ================= */
const AJUSTES=(()=>{ let a={}; try{ a=JSON.parse(localStorage.getItem("edtu_turbo")||"{}"); }catch(e){}
  return Object.assign({ pintura:0, neon:0, calidad:null, sombras:true, dinero:0, mejores:{}, mejoras:{}, volante:1, hora:"tarde", coche:0 }, a); })();
function guardaAjustes(){ try{ localStorage.setItem("edtu_turbo",JSON.stringify(AJUSTES)); }catch(e){} }
const G={ estado:"carga", t:0, coche:null, cam:null, trucos:[], mensajes:[], evento:null, pausa:false, mapa:false, flash:0, avisoCal:null };

const TECLAS={}, TACTIL={};
addEventListener("keydown",e=>{
  TECLAS[e.code]=true;
  if(/^(Arrow|Space)/.test(e.code)) e.preventDefault();
  if(G.estado!=="juego") return;
  if(e.code==="KeyC"&&!e.repeat) G.cam.modo=(G.cam.modo+1)%3;
  if((e.code==="KeyP"||e.code==="Escape")&&!e.repeat){ if(G.mapa) G.mapa=false; else G.pausa=!G.pausa; }
  if(e.code==="KeyM"&&!e.repeat) G.mapa=!G.mapa;                    /* 🗺️ el mapa grande */
  if(e.code==="KeyR"&&!e.repeat){ recolocaCoche(G.coche); avisa("DE VUELTA A LA CARRETERA","#c8ff2e"); }
});
addEventListener("keyup",e=>{ TECLAS[e.code]=false; });
/* 👆🧭 TOCAR EL MAPA para elegir a dónde ir (como Waze). Se escucha en la ventana para no depender
      de qué lienzo está encima; solo hace caso con el mapa abierto. */
addEventListener("pointerdown",e=>{
  if(G.estado!=="juego" || !G.mapa || !G.mapaRect) return;
  const cv=document.getElementById("hud"); if(!cv) return;
  const r=cv.getBoundingClientRect(); if(!r.width||!r.height) return;
  const px=(e.clientX-r.left)*cv.width/r.width, py=(e.clientY-r.top)*cv.height/r.height;
  const M=G.mapaRect;
  if(px<M.mx||px>M.mx+M.lado||py<M.my||py>M.my+M.lado){ ponDestino(null); return; }
  if(ponDestino((px-M.mx)/M.e-MITAD, (py-M.my)/M.e-MITAD)) G.mapa=false;   /* elegido: se cierra el mapa */
});
addEventListener("blur",()=>{ for(const k in TECLAS) TECLAS[k]=false; });
/* 🎮 el mando: el propio, o el que nos pasa el cuartel (si el foco se quedó fuera del juego) */
const PAD={ prestado:null, antes:[] };
addEventListener("message",e=>{ const d=e.data; if(d&&d.edtuPad) PAD.prestado={ axes:d.axes||[], buttons:(d.buttons||[]).map(b=>!!b), t:performance.now() }; });
function padCrudo(){
  try{ for(const p of (navigator.getGamepads?navigator.getGamepads():[])){ if(!p) continue; const id=(p.id||"").toLowerCase();
      if(/jabra|speak|headset|audio|micr|webcam|camera|receiver/.test(id)) continue;
      if((p.axes||[]).length>=2&&(p.buttons||[]).length>=8) return { axes:Array.from(p.axes), boton:i=>p.buttons[i]?p.buttons[i].value:0 }; } }catch(e){}
  if(PAD.prestado && performance.now()-PAD.prestado.t<500){ const P=PAD.prestado; return { axes:P.axes, boton:i=>P.buttons[i]?1:0 }; }
  return null;
}
/* lo que quiere hacer el jugador ahora mismo: gas, freno, giro, freno de mano y nitro */
function leeEntrada(){
  const E={ gas:0, freno:0, giro:0, mano:false, nitro:false, entrar:false, mirar:0 };
  if(TECLAS.KeyW||TECLAS.ArrowUp||TACTIL.gas) E.gas=1;
  if(TECLAS.KeyS||TECLAS.ArrowDown||TACTIL.freno) E.freno=1;
  if(TECLAS.KeyA||TECLAS.ArrowLeft||TACTIL.izq) E.giro-=1;
  if(TECLAS.KeyD||TECLAS.ArrowRight||TACTIL.der) E.giro+=1;
  if(TECLAS.Space||TACTIL.mano) E.mano=true;
  if(TECLAS.ShiftLeft||TECLAS.ShiftRight||TECLAS.KeyN||TACTIL.nitro) E.nitro=true;
  if(TECLAS.KeyE||TECLAS.Enter||TACTIL.entrar) E.entrar=true;   /* 🏁 entrar en la carrera */
  if(TECLAS.KeyQ||TACTIL.mirar) E.mirar=1;                       /* 👀 mirar atrás sin soltar el volante */
  const P=padCrudo();
  if(P){
    const x=P.axes[0]||0; if(Math.abs(x)>0.16) E.giro=clamp(E.giro+Math.sign(x)*((Math.abs(x)-0.16)/0.84),-1,1);   /* 🕹️ zona muerta un poco mayor */
    const mx=P.axes[2]||0;                                                                     /* 👀 STICK DERECHO: giras la vista, no el coche */
    if(Math.abs(mx)>0.18) E.mirar=clamp(Math.sign(mx)*((Math.abs(mx)-0.18)/0.82),-1,1);
    E.gas=Math.max(E.gas,P.boton(7)); E.freno=Math.max(E.freno,P.boton(6));                  /* RT gas · LT freno */
    if(P.boton(0)>0.5||P.boton(5)>0.5) E.nitro=true;                                           /* A o RB: nitro */
    if(P.boton(2)>0.5||P.boton(1)>0.5) E.mano=true;                                            /* X o B: freno de mano */
    if(P.boton(12)>0.5) E.entrar=true;                                                         /* cruceta arriba: entrar en la carrera */
    const pulsa=i=>P.boton(i)>0.5&&!PAD.antes[i];
    if(G.estado==="juego"){ if(pulsa(3)) G.cam.modo=(G.cam.modo+1)%3; if(pulsa(4)) G.mapa=!G.mapa; if(pulsa(9)) G.pausa=!G.pausa; if(pulsa(8)){ recolocaCoche(G.coche); avisa("DE VUELTA A LA CARRETERA","#c8ff2e"); } }
    else if(G.estado==="menu" && pulsa(0)) empieza();
    for(let i=0;i<16;i++) PAD.antes[i]=P.boton(i)>0.5;
  }
  if(AJUSTES.volante===-1) E.giro=-E.giro;     /* 🕹️ el volante al revés, si lo eliges en el menú */
  return E;
}
function preparaTactil(){
  const tactil=!!(window.matchMedia&&window.matchMedia("(pointer: coarse)").matches);
  document.getElementById("tactil").classList.toggle("si",tactil);
  const une=(id,k)=>{ const el=document.getElementById(id); if(!el) return;
    const on=e=>{ e.preventDefault(); TACTIL[k]=true; el.classList.add("on"); }, off=e=>{ e.preventDefault(); TACTIL[k]=false; el.classList.remove("on"); };
    el.addEventListener("pointerdown",on); el.addEventListener("pointerup",off); el.addEventListener("pointercancel",off); el.addEventListener("pointerleave",off); };
  une("tIzq","izq"); une("tDer","der"); une("tGas","gas"); une("tFreno","freno"); une("tNitro","nitro"); une("tMano","mano"); une("tEntrar","entrar"); une("tMirar","mirar");
  return tactil;
}

/* 🔊 el motor, las ruedas y el viento, sintetizados (sin archivos de sonido) */
const SON={ ctx:null };
function iniciaSonido(){

/* ✨ los trucos llenan el nitro (y dan un poco de dinero) */

/* 🖼️ el retrato de un coche, dibujado de lado con su forma y su color */
function retrataCoche(lienzoC,M,pint){
  const x=lienzoC.getContext("2d"), W=lienzoC.width, H=lienzoC.height;
  x.clearRect(0,0,W,H);
  const mx=Math.max(pint.rgb[0],pint.rgb[1],pint.rgb[2]), k=mx<0.3?0.34/Math.max(mx,0.02):1.35;   /* 🖤 el NEGRO NOCHE se aclara: si no, el dibujo no se ve */
  const col="rgb("+pint.rgb.map(v=>Math.round(Math.min(1,v*k+0.07)*255)).join(",")+")";
  const L=W*0.86*M.largo/1.1, A=H*0.40*M.alto, x0=(W-L)/2, y0=H*0.68;
  x.fillStyle="rgba(0,0,0,.28)"; x.beginPath(); x.ellipse(W/2,y0+A*0.34,L*0.52,A*0.13,0,0,7); x.fill();
  /* la carrocería: morro bajo, techo curvo y cola corta */
  x.fillStyle=col; x.beginPath();
  x.moveTo(x0,y0);
  x.quadraticCurveTo(x0+L*0.10,y0-A*0.42, x0+L*0.34,y0-A*0.46);
  x.quadraticCurveTo(x0+L*0.50,y0-A*1.05, x0+L*0.70,y0-A*0.50);
  x.lineTo(x0+L*0.96,y0-A*0.44);
  x.quadraticCurveTo(x0+L,y0-A*0.30, x0+L,y0);
  x.lineTo(x0,y0); x.closePath(); x.fill();
  /* las lunas */
  x.fillStyle="rgba(150,200,240,.55)"; x.beginPath();
  x.moveTo(x0+L*0.37,y0-A*0.50); x.quadraticCurveTo(x0+L*0.50,y0-A*0.95, x0+L*0.66,y0-A*0.52); x.closePath(); x.fill();
  /* el alerón */
  x.fillStyle=col; x.fillRect(x0+L*0.90,y0-A*(0.70+0.30*M.aleron),L*0.16,A*0.09);
  x.fillRect(x0+L*0.95,y0-A*(0.70+0.30*M.aleron),A*0.06,A*(0.30*M.aleron)+A*0.02);
  /* las luces */
  x.fillStyle="#fff7d0"; x.fillRect(x0-1,y0-A*0.22,L*0.05,A*0.10);
  x.fillStyle="#ff4040"; x.fillRect(x0+L*0.96,y0-A*0.26,L*0.05,A*0.10);
  /* las ruedas */
  x.fillStyle="#15151a";
  for(const rx of [x0+L*0.20, x0+L*0.80]){ x.beginPath(); x.arc(rx,y0,A*0.30,0,7); x.fill();
    x.fillStyle="#4a4a55"; x.beginPath(); x.arc(rx,y0,A*0.15,0,7); x.fill(); x.fillStyle="#15151a"; }
}

/* ================= 🔁 EL BUCLE ================= */
let ultimoT=0, acumulado=0, zonaT=0;
function vistaMenu(dt){
  const C=G.coche, K=G.cam, a=performance.now()/1000*0.18;
  K.x=C.x+Math.sin(a)*7.5; K.z=C.z+Math.cos(a)*7.5; K.y=C.y+1.9; K.mira=v3(C.x,C.y+0.7,C.z); K.fov=0.95;

function bucle(ahora){
  requestAnimationFrame(bucle);
  if(!(ahora>0)) ahora=performance.now();                   /* por si alguien llama sin la hora */
  const ms=ultimoT?Math.max(0,ahora-ultimoT):16; ultimoT=ahora; const dt=Math.min(0.1,ms/1000);
  vigilaRendimiento(ms);
  const E=leeEntrada();
  if(G.estado==="juego" && !G.pausa && !G.mapa && !G.foto){
    acumulado+=dt; const paso=1/120; let n=0, junto={};
    while(acumulado>=paso && n<24){ const ev=cocheCorre(G.coche,E,paso);
      if(ev.choque) junto.choque=Math.max(junto.choque||0,ev.choque); if(ev.despega) junto.despega=true; if(ev.aterriza) junto.aterriza=ev.aterriza; if(ev.agua) junto.agua=true;
      if(ev.cambio) junto.cambio=ev.cambio;
      acumulado-=paso; n++; }
    const evT=traficoCorre(dt,G.coche);                                   /* 🚗 el tráfico */
    if(evT.choque) junto.choque=Math.max(junto.choque||0,evT.choque);
    if(evT.cerca) junto.cerca=true;
    const evC=carreraCorre(dt,G.coche);                                   /* 🏁 la carrera */
    if(evC.choque) junto.choque=Math.max(junto.choque||0,evC.choque);
    const evP=policiaCorre(dt,G.coche);                                   /* 🚓 la policía */
    if(evP.choque) junto.choque=Math.max(junto.choque||0,evP.choque);
    if(POLICIA.nivel>0) emitePolicia(dt);
    /* 🔊 petardeo al subir de marcha con el motor arriba, y whoosh al empezar el nitro */
    if(junto.cambio && junto.cambio>(G.marchaAnt||1) && G.coche.rpm>0.55) petardeo(0.6+G.coche.rpm);
    G.marchaAnt=G.coche.marcha;
    if(G.coche.usandoNitro && !G.nitroAnt) whoosh();
    G.nitroAnt=G.coche.usandoNitro;
    junto.entrar=E.entrar;
    navCorre(dt,G.coche);   /* 🧭 la ruta se recalcula mientras conduces */
    eventosCorren(dt,junto); trucosCorren(dt,junto); emite(dt,junto); particulasCorren(dt);
    camaraSigue(G.cam,G.coche,dt,E.mirar); G.t+=dt;
    if((zonaT-=dt)<=0){ zonaT=0.5; G.zona=zonaDe(G.coche.x,G.coche.z); }
    G.flash=Math.max(0,G.flash-dt*1.5);
  } else if(G.estado==="menu") { vistaMenu(dt); G.t+=dt; }
  if(G.coche) sonidoCorre(G.coche,G.estado==="juego"&&!G.pausa?E:{gas:0});
  if(gl && ESC.terreno && G.coche){
    const vel=Math.hypot(G.coche.vx,G.coche.vz);
    dibujaFotograma(G.coche,G.cam,G.t,{ vel:G.estado==="juego"?clamp((vel-45)/45,0,1)*0.6+(G.coche.usandoNitro?0.5:0):0, flash:G.flash, expo:1.0 });
  }
  pintaHud(G.coche,dt);
  /* 📸 para las fotos: la página dice que ya está lista (20 fotogramas dibujados) y qué está usando */
  G.cuadros=(G.cuadros||0)+1;
  if(G.cuadros===20){ window.__listo=true; window.__info={ render:RENDER.w+"x"+RENDER.h, calidad:CALIDAD, ms:Math.round(ms), pinos:ARBOLES.length, parts:PARTS.length, estado:G.estado }; }
}

  aplicaMejoras();                                           /* 🔧 lo comprado en el garaje */
  ponHora(AJUSTES.hora||"tarde");                            /* ☀️🌅🌙 la hora del día */
  CALIDAD=AJUSTES.calidad&&CALIDADES[AJUSTES.calidad]?AJUSTES.calidad:(ES_TACTIL()?"hd":"k4");
  aplicaCalidad();
  await construyeMundo(prog);
  await subeMundo(prog);
  prog(0.99,"dibujando el mapa…"); pintaMapa();
  const au=CARRETERAS.find(c=>c.tipo==="autopista"), i0=14;
  G.coche=nuevoCoche(au.x[i0],au.z[i0],Math.atan2(au.tx[i0],au.tz[i0])); G.cam=nuevaCamara(G.coche); G.zona=zonaDe(G.coche.x,G.coche.z);
  preparaTactil(); pintaMenu();
  $("jugar").onclick=empieza; $("salir").onclick=salir;
  addEventListener("resize",()=>{ aplicaCalidad(); if(G.estado==="menu") pintaMenu(); });
  prog(1,"¡listo!"); $("carga").classList.add("oculto");
  if(String(location.hash).startsWith("#foto")) modoFoto(); else { G.estado="menu"; $("menu").classList.remove("oculto"); }
  requestAnimationFrame(bucle);
}
/* 📸 modo foto: tennis de siempre, pero con coches. #foto&sitio=monte|salto|ciudad|lago|menu&cal=hd|k2|k4 */
function modoFoto(){
  const q=new URLSearchParams(String(location.hash).replace("#","").split("&").slice(1).join("&")), sitio=q.get("sitio")||"monte";
  if(CALIDADES[q.get("cal")]){ CALIDAD=q.get("cal"); aplicaCalidad(); }
  if(HORAS[q.get("hora")]){ AJUSTES.hora=q.get("hora"); ponHora(AJUSTES.hora); }
  if(q.get("coche")!==null){ AJUSTES.coche=clamp(+q.get("coche")||0,0,MODELOS.length-1); subeCoche(); }   /* 📸 #foto&coche=1 */
  if(q.get("mapa")) G.mapa=true;
  if(sitio==="menu"){ G.estado="menu"; $("menu").classList.remove("oculto"); return; }
  G.estado="juego"; G.foto=true;
  const porNombre=n=>CARRETERAS.find(c=>c.nombre===n), C=G.coche;
  const pon=(c,i,sentido,kmh)=>{ C.x=c.x[i]; C.z=c.z[i]; C.rumbo=Math.atan2(c.tx[i]*sentido,c.tz[i]*sentido); C.y=sueloEn(C.x,C.z).y; const v=kmh/3.6; C.vx=Math.sin(C.rumbo)*v; C.vz=Math.cos(C.rumbo)*v; C.kmh=kmh; C.vF=v; C.vR=0; };
  if(sitio==="salto"){ const e=EVENTOS.find(x=>x.tipo==="salto"); pon(e.c,clamp(e.i+e.sentido*4,0,e.c.n-1),e.sentido,168); C.y+=6; C.enSuelo=false; C.aire=0.9; C.cabeceo=0.05; }
  else if(sitio==="ciudad"){ const c=CARRETERAS.find(x=>x.nombre==="Avenida 3"); pon(c,40,1,187); C.usandoNitro=true; C.nitro=0.7; }
  else if(sitio==="trafico"){ const c=porNombre("Autopista 7"), i0=Math.floor(c.n*0.55); pon(c,i0,1,168);
    TRAFICO.length=0;                                            /* 🚗 coches justo delante, para la foto */
    for(const d of [26,44,62]) ponTraficoEn(c,Math.min(c.n-1,i0+Math.round(d/4)),1,false);
    for(const d of [34,56]) ponTraficoEn(c,Math.min(c.n-1,i0+Math.round(d/4)),-1,false);
  }
  else if(sitio==="policia"){ const c=porNombre("Autopista 7"), i0=Math.floor(c.n*0.40); pon(c,i0,1,214); C.usandoNitro=true; C.nitro=0.6;
    POLICIA.nivel=2; POLICIA.calor=0.4; POLICIA.t=0.05;                    /* 🚓 dos patrullas pegadas a ti */
    for(const [lx,lz] of [[-3.6,5],[3.4,-3]])   /* a tu lado, que se vean */{ const p=puntoCoche(C,lx,0,lz); POLICIA.coches.push({ x:p.x, z:p.z, y:sueloEn(p.x,p.z).y, rumbo:C.rumbo, vel:58, golpe:0, malla:POLI_MALLA }); }
  }
  else if(sitio==="oferta"){ const ev=EVENTOS.find(e=>e.tipo==="carrera"&&/CIUDAD/.test(e.carrera.nombre));
    const c=ev.carrera.c, i=Math.max(0,ev.carrera.i0-4); pon(c,i,1,46); G.carreraCerca=ev; }
  else if(sitio==="carrera"){ const ev=EVENTOS.find(e=>e.tipo==="carrera"&&e.carrera.nombre==="VUELTA AL LAGO"); empiezaCarrera(ev.carrera,C);
    const A=CARRERA.activa; A.t=31.4; A.cuenta=0; A.tiempo=31.4;
    for(let k=0;k<420;k++){ for(const R of RIVALES) rivalCorre(R,1/60,C); }             /* 7 s de carrera de los rivales */
    const R0=RIVALES[1]; C.x=R0.x-Math.sin(R0.rumbo)*9; C.z=R0.z-Math.cos(R0.rumbo)*9; C.rumbo=R0.rumbo; C.y=sueloEn(C.x,C.z).y;
    C.vx=Math.sin(C.rumbo)*40; C.vz=Math.cos(C.rumbo)*40; C.kmh=144; C.vF=40; A.acum=R0.acum-9; A.puesto=2;
    for(const R of RIVALES) R.acum=R.acum; }
  else if(sitio==="lago"){ const c=porNombre("Vuelta al Lago Plateado"); pon(c,Math.floor(c.n*0.30),1,142); }
  else { const e=EVENTOS.find(x=>x.tipo==="derrape"); pon(e.c,e.i0+12,1,96); C.derrapando=true; C.anguloDerrape=0.42; C.vR=9; C.rumbo+=0.40; C.direccion=-0.6;
    G.evento={ def:e, tiempo:41, metros:187, fuera:0, i:e.i0+12, largo:1, recorrido(){ return 0; }, valor(){ return this.metros; }, texto(){ return Math.round(this.metros)+" m"; }, metaTxt:m=>m+" m" };
    truco("DERRAPE","1.76"); }
  C.marcha=C.kmh>160?5:C.kmh>120?4:3; C.rpm=0.7; C.nitro=Math.max(C.nitro,0.55); G.zona=zonaDe(C.x,C.z);
  G.cam=nuevaCamara(C); G.cam.rumbo=C.rumbo-(C.derrapando?0.25:0);
  for(let k=0;k<90;k++){ traficoCorre(1/60,C); if(POLICIA.nivel>0&&k>85) emitePolicia(1/60); emite(1/60,{}); particulasCorren(1/60); camaraSigue(G.cam,C,1/60); }   /* que en la foto haya tráfico (y luces de policía) */
  for(const t of G.trucos) t.t=99;
}
