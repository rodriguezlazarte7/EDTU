<script>
"use strict";
/* =====================================================================================
   🏎️ EDTU NITRO · mapa libre de carreras callejeras
   Todo está hecho con código: montañas, carreteras, árboles, ciudad, coche, luz y sonido.
   ===================================================================================== */

/* ================= 🧮 LAS MATEMÁTICAS DE SIEMPRE ================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const suave=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const angDif=(a,b)=>{ let d=(b-a)%TAU; if(d>Math.PI) d-=TAU; if(d<-Math.PI) d+=TAU; return d; };

/* 🎲 azar con semilla: el mundo sale IGUAL cada vez (y las pruebas pueden contar con ello) */
function azarCon(semilla){
  let s=semilla>>>0;
  return ()=>{ s=(s+0x6D2B79F5)>>>0; let t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; };
}

/* 🌫️ ruido de gradiente: de él salen las montañas, las rocas y las nubes */
const RUIDO_P=new Uint8Array(512), RUIDO_G=new Float32Array(512);
(()=>{ const r=azarCon(777), q=[]; for(let i=0;i<256;i++) q.push(i);
  for(let i=255;i>0;i--){ const j=(r()*(i+1))|0, t=q[i]; q[i]=q[j]; q[j]=t; }
  for(let i=0;i<512;i++) RUIDO_P[i]=q[i&255];
  for(let i=0;i<256;i++){ const a=r()*TAU; RUIDO_G[i*2]=Math.cos(a); RUIDO_G[i*2+1]=Math.sin(a); } })();
function ruido(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi, P=RUIDO_P, G=RUIDO_G;
  const X=xi&255, Y=yi&255;
  const h00=P[P[X]+Y]*2, h10=P[P[X+1]+Y]*2, h01=P[P[X]+Y+1]*2, h11=P[P[X+1]+Y+1]*2;
  const a=G[h00]*xf+G[h00+1]*yf, b=G[h10]*(xf-1)+G[h10+1]*yf, c=G[h01]*xf+G[h01+1]*(yf-1), d=G[h11]*(xf-1)+G[h11+1]*(yf-1);
  const u=xf*xf*xf*(xf*(xf*6-15)+10), v=yf*yf*yf*(yf*(yf*6-15)+10);
  return (a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v)*1.41;
}
function fbm(x,y,oct){ let s=0,a=0.5,f=1,n=0; for(let i=0;i<oct;i++){ s+=a*ruido(x*f,y*f); n+=a; a*=0.5; f*=2.03; } return s/n; }
function crestas(x,y,oct){ let s=0,a=0.5,f=1,n=0; for(let i=0;i<oct;i++){ const r=1-Math.abs(ruido(x*f+13.1,y*f-7.7)); s+=a*r*r; n+=a; a*=0.5; f*=2.1; } return s/n; }

/* 📐 vectores y matrices (matrices en columnas, como las quiere WebGL) */
const v3=(x,y,z)=>({x,y,z});
const vSum=(a,b)=>v3(a.x+b.x,a.y+b.y,a.z+b.z), vRes=(a,b)=>v3(a.x-b.x,a.y-b.y,a.z-b.z), vEsc=(a,s)=>v3(a.x*s,a.y*s,a.z*s);
const vDot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const vCruz=(a,b)=>v3(a.y*b.z-a.z*b.y, a.z*b.x-a.x*b.z, a.x*b.y-a.y*b.x);
const vLen=a=>Math.hypot(a.x,a.y,a.z);
const vNorm=a=>{ const l=vLen(a)||1; return v3(a.x/l,a.y/l,a.z/l); };

function m4(){ const m=new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
function m4Mul(a,b,o){ o=o||new Float32Array(16);
  for(let c=0;c<4;c++) for(let r=0;r<4;r++){ let s=0; for(let k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k]; o[c*4+r]=s; }
  return o; }
function m4Persp(fov,asp,cerca,lejos){ const f=1/Math.tan(fov/2), m=new Float32Array(16);
  m[0]=f/asp; m[5]=f; m[10]=(lejos+cerca)/(cerca-lejos); m[11]=-1; m[14]=2*lejos*cerca/(cerca-lejos); return m; }
function m4Orto(l,r,b,t,n,f){ const m=new Float32Array(16);
  m[0]=2/(r-l); m[5]=2/(t-b); m[10]=-2/(f-n); m[12]=-(r+l)/(r-l); m[13]=-(t+b)/(t-b); m[14]=-(f+n)/(f-n); m[15]=1; return m; }
function m4Mirar(ojo,obj,arriba){
  const z=vNorm(vRes(ojo,obj)), x=vNorm(vCruz(arriba,z)), y=vCruz(z,x), m=new Float32Array(16);
  m[0]=x.x; m[4]=x.y; m[8]=x.z;  m[1]=y.x; m[5]=y.y; m[9]=y.z;  m[2]=z.x; m[6]=z.y; m[10]=z.z;
  m[12]=-vDot(x,ojo); m[13]=-vDot(y,ojo); m[14]=-vDot(z,ojo); m[15]=1; return m;
}
/* un punto del mundo en la pantalla (para las etiquetas del HUD): devuelve x,y en 0..1 y si está delante */
function m4Proyecta(vp,p){
  const x=vp[0]*p.x+vp[4]*p.y+vp[8]*p.z+vp[12], y=vp[1]*p.x+vp[5]*p.y+vp[9]*p.z+vp[13], w=vp[3]*p.x+vp[7]*p.y+vp[11]*p.z+vp[15];
  if(w<0.1) return null; return { x:(x/w)*0.5+0.5, y:0.5-(y/w)*0.5, w };
}

/* ================= 🏔️ EL MUNDO: montañas, lago, ciudad, cantera y carreteras =================
   2,4 km × 2,4 km. El suelo es una rejilla de 601×601 alturas (una cada 4 m). Las carreteras son
   curvas suaves con la pendiente limitada, y el terreno se aplana debajo de ellas */
const MUNDO=3200, MITAD=MUNDO/2, PASO=4, NV=MUNDO/PASO+1;   /* 🗺️ 3,2 km × 3,2 km */
const AGUA_Y=0;
const LAGO={x:-520,z:-430,r:300}, CUMBRE={x:-300,z:820}, CANTERA={x:430,z:-830};
 const PISTA={x:1000,z:1010,y:210, R1:540, R2:390};   /* 🏟️ el centro de eventos y su PISTA GIGANTE */
const CIUDAD={x0:490,x1:1030,z0:-610,z1:170,y:12};

function alturaBase(x,z){
  let h=18+fbm(x/650+3.1,z/650-1.7,4)*30+fbm(x/140,z/140,3)*4;
  const norte=suave(150,900,z);
  h+=norte*(40+crestas(x/380,z/380,5)*230);                                  /* ⛰️ la sierra del norte */
  const dc=Math.hypot(x-CUMBRE.x,z-CUMBRE.z); h+=150*Math.exp(-dc*dc/(2*240*240));   /* 🎿 la cumbre de la estación */
  const borde=Math.max(Math.abs(x),Math.abs(z));
  h+=suave(1280,1580,borde)*(140+crestas(x/300,z/300,4)*200);                 /* las montañas que cierran el mapa */
  const dq=Math.hypot(x-CANTERA.x,z-CANTERA.z);                              /* ⛏️ la cantera, a escalones */
  h=lerp(h, Math.min(h, 4+Math.floor(dq/30)*5), suave(200,130,dq));
  const dl=Math.hypot(x-LAGO.x,(z-LAGO.z)*1.15);                             /* 🌊 el lago */
  h=lerp(h,-14,suave(LAGO.r+70,LAGO.r-80,dl));
  const fx=Math.max(CIUDAD.x0-x,0,x-CIUDAD.x1), fz=Math.max(CIUDAD.z0-z,0,z-CIUDAD.z1);   /* 🏙️ la ciudad: plana ENTERA */
  const mc=1-suave(0,90,Math.hypot(fx,fz));                                              /* y el degradado, solo por fuera */
  h=lerp(h,CIUDAD.y,mc);
  /* 🏟️ LA MESETA DEL CENTRO DE EVENTOS: una plataforma elíptica plana donde va la pista futurista.
        Sin esto el terreno asoma por encima del asfalto (medido: hasta 1,3 m). */
  /* 🏟️ la meseta del centro de eventos, plana: el terreno JUSTO BAJO el asfalto lo fija luego el
        constructor del mundo (carretera menos 6 cm), así que aquí solo se allana el entorno */
  const ep=Math.hypot((x-PISTA.x)/(PISTA.R1+90),(z-PISTA.z)/(PISTA.R2+90)), mp=1-suave(1.0,1.32,ep);   /* 🏟️ la explanada crece con la pista */
  return lerp(h,PISTA.y-0.35,mp);
}

/* ================= 🛣️ LAS CARRETERAS ================= */
const CARRETERAS=[];
const MUESTRA=4;                                   /* una muestra de carretera cada 4 m */
function muestreaCurva(ctrl,cerrada){
  const n=ctrl.length, seg=cerrada?n:n-1, denso=[];
  const P=i=>cerrada?ctrl[((i%n)+n)%n]:ctrl[clamp(i,0,n-1)];
  for(let i=0;i<seg;i++){
    const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
    for(let k=0;k<32;k++){ const t=k/32,t2=t*t,t3=t2*t;
      const cr=j=>0.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);
      denso.push([cr(0),cr(1)]); }
  }
  denso.push(cerrada?denso[0]:ctrl[n-1]);
  const out=[denso[0]]; let acc=0, sig=0;
  for(let i=1;i<denso.length;i++){
    const a=denso[i-1], b=denso[i], l=Math.hypot(b[0]-a[0],b[1]-a[1]);
    while(l>0 && acc+l>=sig+MUESTRA){ const t=(sig+MUESTRA-acc)/l; out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]); sig+=MUESTRA; }
    acc+=l;
  }
  if(cerrada && out.length>2 && Math.hypot(out[out.length-1][0]-out[0][0],out[out.length-1][1]-out[0][1])<MUESTRA*0.6) out.pop();
  return out;
}
function nuevaCarretera(nombre,tipo,ancho,ctrl,cerrada,minY){
  const pts=muestreaCurva(ctrl,cerrada), n=pts.length;
  const c={ nombre, tipo, ancho, cerrada, n, x:new Float32Array(n), z:new Float32Array(n), y:new Float32Array(n), tx:new Float32Array(n), tz:new Float32Array(n) };
  for(let i=0;i<n;i++){ c.x[i]=pts[i][0]; c.z[i]=pts[i][1]; }
  const idx=i=>cerrada?((i%n)+n)%n:clamp(i,0,n-1);
  for(let i=0;i<n;i++){ const a=idx(i-1), b=idx(i+1); const dx=c.x[b]-c.x[a], dz=c.z[b]-c.z[a], l=Math.hypot(dx,dz)||1; c.tx[i]=dx/l; c.tz[i]=dz/l; }
  /* la altura: el terreno suavizado (±60 m) y con la pendiente limitada al 12% */
  const base=new Float32Array(n); for(let i=0;i<n;i++) base[i]=alturaBase(c.x[i],c.z[i]);
  const ventana=tipo==="monte"?8:15;                  /* la de montaña sigue más al terreno */
  for(let i=0;i<n;i++){ let s=0,k=0; for(let j=-ventana;j<=ventana;j++){ const q=cerrada?idx(i+j):i+j; if(q<0||q>=n) continue; s+=base[q]; k++; } c.y[i]=Math.max(minY||2.5, s/k); }
  const maxDy=(tipo==="monte"?0.20:0.12)*MUESTRA;     /* ⛰️ la de montaña puede ser empinada: sube de verdad, sin zanjas */
  for(let pasada=0;pasada<3;pasada++){
    for(let i=1;i<n;i++) c.y[i]=clamp(c.y[i],c.y[i-1]-maxDy,c.y[i-1]+maxDy);
    for(let i=n-2;i>=0;i--) c.y[i]=clamp(c.y[i],c.y[i+1]-maxDy,c.y[i+1]+maxDy);
  }
  c.largo=n*MUESTRA;
  CARRETERAS.push(c); return c;
}
function trazaCarreteras(){
  CARRETERAS.length=0;
  /* 🌊 la vuelta al lago */
  const lago=[]; for(let i=0;i<16;i++){ const a=i/16*TAU, r=415+Math.sin(a*3)*38; lago.push([LAGO.x+Math.cos(a)*r, LAGO.z+Math.sin(a)*r*0.92]); }
  nuevaCarretera("Vuelta al Lago Plateado","lago",11,lago,true,3.5);
  /* 🛣️ la autopista, de oeste a la ciudad */
  nuevaCarretera("Autopista 7","autopista",18,[[-860,80],[-700,50],[-540,60],[-260,25],[0,-15],[250,-60],[470,-100],[740,-100],[1015,-100]],false);
  /* ⛰️ el paso de montaña, con curvas de herradura, hasta la estación de esquí */
  nuevaCarretera("Paso de la Cumbre","monte",10,[[-260,25],[-230,160],[-120,270],[-300,350],[-120,440],[-360,520],[-180,610],[-380,680],[-250,780],[-330,860]],false);
  /* ⛏️ bajada a la cantera y su vuelta de tierra */
  nuevaCarretera("Camino de la Cantera","monte",10,[[250,-60],[300,-260],[250,-460],[330,-640],[352,-700],[378,-760]],false);   /* 🔗 ahora SÍ llega a la cantera y cruza su anillo: une las dos mitades del mapa */
  const cant=[]; for(let i=0;i<12;i++){ const a=i/12*TAU, r=155+Math.sin(a*2+1)*25; cant.push([CANTERA.x+Math.cos(a)*r, CANTERA.z+Math.sin(a)*r]); }
  nuevaCarretera("Circuito de la Cantera","tierra",12,cant,true,3);
  nuevaCarretera("Atajo del Lago","lago",10,[[LAGO.x+410,LAGO.z],[-40,-640],[140,-760],[280,-820]],false,3.5);
  /* 🏙️ las calles de la ciudad (la autopista hace de calle en z=-100) */
  for(const x of [520,640,760,880,1000]) nuevaCarretera("Avenida "+((x-400)/120),"ciudad",14,[[x,-600],[x,-340],[x,-100],[x,160]],false);
  for(const z of [-580,-460,-340,-220,20,140]) nuevaCarretera("Calle "+((z+700)/120),"ciudad",14,[[505,z],[760,z],[1015,z]],false);
  /* 🛸 LA PISTA FUTURISTA de NO SPEED LIMIT: un óvalo aislado en la meseta vacía del noreste
        (medido: a más de 660 m de cualquier otra carretera, así que no se mezcla con el mapa libre) */
  {
    const P=[], R1=PISTA.R1, R2=PISTA.R2;
    for(let i=0;i<28;i++){ const a=i/28*TAU;          /* más puntos: una pista gigante necesita curvas finas */
      P.push([PISTA.x+Math.cos(a)*R1, PISTA.z+Math.sin(a)*R2]); }
    const p=nuevaCarretera("Pista Orbital","pista",22,P,true,PISTA.y);
    p.y.fill(PISTA.y);                                  /* llana del todo: es una pista, no una carretera */
    p.futurista=true;
  }
  for(const c of CARRETERAS) if(c.tipo==="ciudad") c.y.fill(CIUDAD.y);
}

/* 🔗 LOS CRUCES: donde dos carreteras se cruzan tienen que estar a la MISMA altura. Si no, al pasar
      de una a otra el suelo da un escalón y el coche sale volando (le pasaba a David al entrar en la
      autopista). Manda la más ancha; la otra se acomoda con una rampa suave de 120 m */
function ajustaCruces(){
  const orden=CARRETERAS.map((c,i)=>i).sort((a,b)=>CARRETERAS[b].ancho-CARRETERAS[a].ancho);
  for(let pasada=0;pasada<3;pasada++){
    for(const k of orden){
      const A=CARRETERAS[k], corr=new Float32Array(A.n); let hay=false;
      for(let i=0;i<A.n;i++){
        const q=carreteraCerca(A.x[i],A.z[i],30,A);
        if(!q) continue;
        const B=q.c, mandaB = B.ancho>A.ancho || (B.ancho===A.ancho && CARRETERAS.indexOf(B)<k);
        if(!mandaB || q.d > (A.ancho+B.ancho)/2*0.8) continue;
        corr[i]=q.y-A.y[i]; hay=true;
      }
      if(!hay) continue;
      const R=30, suave2=new Float32Array(A.n);                  /* la corrección se reparte 120 m a cada lado */
      for(let i=0;i<A.n;i++){ if(!corr[i]) continue;
        for(let j=Math.max(0,i-R);j<=Math.min(A.n-1,i+R);j++){
          const v=corr[i]*(1-Math.abs(j-i)/R); if(Math.abs(v)>Math.abs(suave2[j])) suave2[j]=v; } }
      for(let i=0;i<A.n;i++) A.y[i]+=suave2[i];
    }
  }
}
/* 🔎 la carretera más cercana: rejilla de 20 m con las muestras de todas */
const REJ_C=20, REJ_N=Math.ceil(MUNDO/REJ_C)+1, REJ=new Array(REJ_N*REJ_N);
function indexaCarreteras(){
  REJ.fill(undefined);
  CARRETERAS.forEach((c,ci)=>{ const tope=c.cerrada?c.n:c.n-1;
    for(let i=0;i<tope;i++){ const j=(i+1)%c.n, mx=(c.x[i]+c.x[j])/2, mz=(c.z[i]+c.z[j])/2;
      const gx=Math.floor((mx+MITAD)/REJ_C), gz=Math.floor((mz+MITAD)/REJ_C);
      if(gx<0||gz<0||gx>=REJ_N||gz>=REJ_N) continue;
      const k=gz*REJ_N+gx; (REJ[k]||(REJ[k]=[])).push(ci,i); } });
}
function carreteraCerca(x,z,radio,salta){
  const r=Math.ceil((radio||30)/REJ_C), gx=Math.floor((x+MITAD)/REJ_C), gz=Math.floor((z+MITAD)/REJ_C);
  let mejor=null, md=1e9;
  for(let a=gz-r;a<=gz+r;a++){ if(a<0||a>=REJ_N) continue;
    for(let b=gx-r;b<=gx+r;b++){ if(b<0||b>=REJ_N) continue; const L=REJ[a*REJ_N+b]; if(!L) continue;
      for(let k=0;k<L.length;k+=2){
        const c=CARRETERAS[L[k]]; if(c===salta) continue;
        const i=L[k+1], j=(i+1)%c.n;
        const ax=c.x[i], az=c.z[i], sx=c.x[j]-ax, sz=c.z[j]-az, l2=sx*sx+sz*sz||1;
        const t=clamp(((x-ax)*sx+(z-az)*sz)/l2,0,1), px=ax+sx*t, pz=az+sz*t, d=Math.hypot(x-px,z-pz);
        const borde=d-c.ancho/2;
        if(borde<md){ md=borde; mejor={ c, ci:L[k], i, t, d, y:lerp(c.y[i],c.y[j],t), tx:c.tx[i], tz:c.tz[i], lado:Math.sign(sx*(z-az)-sz*(x-ax))||1 }; }
      } } }
  return mejor;
}

/* ================= 🗻 LA REJILLA DE ALTURAS ================= */
const ALT=new Float32Array(NV*NV);
async function construyeTerreno(progreso){
  for(let j=0;j<NV;j++){
    const z=-MITAD+j*PASO;
    for(let i=0;i<NV;i++){
      const x=-MITAD+i*PASO;
      let h=alturaBase(x,z);
      const q=carreteraCerca(x,z,34);
      if(q){ const r=q.c.ancho/2, w=suave(r+18, r+1.5, q.d); h=lerp(h, q.y-0.06, w); }   /* 🐛 antes 30 cm: donde se acababa una carretera el suelo caía de golpe y el coche saltaba */
      ALT[j*NV+i]=h;
    }
    if(j%40===0 && progreso){ progreso(j/NV); await new Promise(r=>setTimeout(r,0)); }
  }
}
function altura(x,z){
  const fx=clamp((x+MITAD)/PASO,0,NV-1.001), fz=clamp((z+MITAD)/PASO,0,NV-1.001);
  const i=Math.floor(fx), j=Math.floor(fz), u=fx-i, v=fz-j;
  const a=ALT[j*NV+i], b=ALT[j*NV+i+1], c=ALT[(j+1)*NV+i], d=ALT[(j+1)*NV+i+1];
  return (a+(b-a)*u)*(1-v)+(c+(d-c)*u)*v;
}
function normalEn(x,z){ const e=2; return vNorm(v3(altura(x-e,z)-altura(x+e,z), 2*e, altura(x,z-e)-altura(x,z+e))); }
/* 🚗 el suelo que pisa un coche: la carretera (lisa) si está encima, si no el terreno; y las rampas */
function sueloEn(x,z){
  const q=carreteraCerca(x,z,20);
  let y, sobre=null;
  if(q && q.d<q.c.ancho/2+4){
    /* el borde del asfalto se funde con el terreno a lo largo de 4 m: cualquier desnivel que quede se
       reparte en una cuestecita en vez de ser un escalón que hace saltar al coche */
    const r=q.c.ancho/2, t=suave(r+4, r+0.5, q.d);
    y=lerp(altura(x,z), q.y, t);
    if(t>0.6) sobre=q;
  } else y=altura(x,z);
  if(typeof rampaAltura==="function"){ const r=rampaAltura(x,z); if(r!==null && r>y){ y=r; sobre=sobre||{rampa:true}; } }
  return { y, carretera:sobre };
}
/* 📍 cómo se llama el sitio donde estás */
function zonaDe(x,z){
  if(x>CIUDAD.x0-40 && x<CIUDAD.x1+40 && z>CIUDAD.z0-40 && z<CIUDAD.z1+40) return "Ciudad EDTU";
  if(Math.hypot(x-LAGO.x,z-LAGO.z)<520) return "Lago Plateado";
  if(Math.hypot(x-CANTERA.x,z-CANTERA.z)<320) return "Cantera Roja";
  if(Math.hypot(x-CUMBRE.x,z-CUMBRE.z)<420) return "Estación Cumbre Nevada";
  if(z>200) return "Sierra del Norte";
  const q=carreteraCerca(x,z,40); if(q && q.c.tipo==="autopista") return "Autopista 7";
  return "Valle de los Pinos";
}

/* ================= 🌲 LO QUE HAY EN EL MUNDO ================= */
const ARBOLES=[], EDIFICIOS=[], CASAS=[], FAROLAS=[], FLECHAS=[], PORTICOS=[], RAMPAS=[], EVENTOS=[];

/* 💥 los choques: rejilla de 16 m con troncos (círculos) y edificios (cajas) */
const CH_C=16, CH_N=Math.ceil(MUNDO/CH_C)+1, CHOQUES=new Array(CH_N*CH_N);
function chApunta(o,x0,z0,x1,z1){
  for(let a=Math.floor((z0+MITAD)/CH_C);a<=Math.floor((z1+MITAD)/CH_C);a++)
    for(let b=Math.floor((x0+MITAD)/CH_C);b<=Math.floor((x1+MITAD)/CH_C);b++){
      if(a<0||b<0||a>=CH_N||b>=CH_N) continue; const k=a*CH_N+b; (CHOQUES[k]||(CHOQUES[k]=[])).push(o); }
}
/* devuelve hacia dónde empujar un círculo (x,z,radio) para sacarlo de lo que toca, o null */
function choqueEn(x,z,radio){
  const L=CHOQUES[Math.floor((z+MITAD)/CH_C)*CH_N+Math.floor((x+MITAD)/CH_C)]; if(!L) return null;
  for(const o of L){
    if(o.r){ const dx=x-o.x, dz=z-o.z, d=Math.hypot(dx,dz), m=o.r+radio;
      if(d<m){ const n=d||1; return { nx:dx/n, nz:dz/n, pen:m-d, que:"árbol" }; } }
    else {
      const cx=clamp(x,o.x-o.w/2,o.x+o.w/2), cz=clamp(z,o.z-o.d/2,o.z+o.d/2), dx=x-cx, dz=z-cz, d=Math.hypot(dx,dz);
      if(d<radio){ if(d>1e-4) return { nx:dx/d, nz:dz/d, pen:radio-d, que:"edificio" };
        const px=o.w/2-Math.abs(x-o.x), pz=o.d/2-Math.abs(z-o.z);
        return px<pz ? { nx:Math.sign(x-o.x)||1, nz:0, pen:px+radio, que:"edificio" } : { nx:0, nz:Math.sign(z-o.z)||1, pen:pz+radio, que:"edificio" }; }
    }
  }
  return null;
}

/* 🌲 los pinos: en bosques (según el ruido), nunca en la carretera, el agua, la ciudad o la roca */
function poneArboles(azar){
  ARBOLES.length=0;
  for(let k=0;k<26000 && ARBOLES.length<9000;k++){
    const x=(azar()*2-1)*(MITAD-30), z=(azar()*2-1)*(MITAD-30);
    if(fbm(x/260+9,z/260-4,3)<-0.08) continue;
    const y=altura(x,z); if(y<2.2 || y>430) continue;
    if(x>CIUDAD.x0-50 && x<CIUDAD.x1+50 && z>CIUDAD.z0-50 && z<CIUDAD.z1+50) continue;
    if(Math.hypot(x-CANTERA.x,z-CANTERA.z)<215) continue;
    if(normalEn(x,z).y<0.80) continue;
    const q=carreteraCerca(x,z,30); if(q && q.d<q.c.ancho/2+5.5) continue;
    const alto=9+azar()*14, a={ x, y, z, alto, ancho:alto*(0.26+azar()*0.08), tono:azar(), r:0.55 };
    ARBOLES.push(a); chApunta(a,x-1,z-1,x+1,z+1);
  }
}

/* 🏙️ la ciudad: manzanas entre las calles, con 2×2 edificios de alturas distintas */
function poneCiudad(azar){
  EDIFICIOS.length=0;
  const gx=[520,640,760,880,1000], gz=[-580,-460,-340,-220,-100,20,140];
  const COLS=[[0.52,0.55,0.60],[0.36,0.40,0.46],[0.62,0.58,0.52],[0.30,0.34,0.40],[0.70,0.70,0.72],[0.45,0.36,0.32]];
  for(let i=0;i<gx.length-1;i++) for(let j=0;j<gz.length-1;j++){
    const x0=gx[i]+11, x1=gx[i+1]-11, z0=gz[j]+11, z1=gz[j+1]-11;
    for(let a=0;a<2;a++) for(let b=0;b<2;b++){
      const w=(x1-x0)/2-4, d=(z1-z0)/2-4, cx=x0+(a+0.5)*(x1-x0)/2, cz=z0+(b+0.5)*(z1-z0)/2;
      const centro=1-Math.hypot(cx-760,cz+220)/700;
      const h= azar()<0.2 ? 8+azar()*8 : 20+azar()*azar()*140*centro+20*centro;
      const e={ x:cx, z:cz, y:CIUDAD.y, w:w*(0.8+azar()*0.2), d:d*(0.8+azar()*0.2), h, col:COLS[(azar()*COLS.length)|0], ventanas:azar() };
      EDIFICIOS.push(e); chApunta(e,e.x-e.w/2,e.z-e.d/2,e.x+e.w/2,e.z+e.d/2);
    }
  }
}

/* 🏠 el barrio: casitas con tejado a dos aguas, en filas junto a las calles del extrarradio */
function poneCasas(azar){
  CASAS.length=0;
  const TEJADOS=[[0.55,0.18,0.15],[0.32,0.30,0.36],[0.20,0.32,0.45],[0.45,0.35,0.22]];
  const PAREDES=[[0.86,0.82,0.74],[0.92,0.88,0.80],[0.78,0.74,0.70],[0.88,0.80,0.68]];
  const filas=[];
  for(const z of [-700,-660,220,260]) filas.push({ x0:420, x1:1120, z, dir:0 });   /* arriba y abajo de la ciudad */
  for(const x of [380,420,1090,1130]) filas.push({ z0:-620, z1:180, x, dir:1 });   /* a los lados */
  for(const f of filas){
    const n=14+((azar()*6)|0);
    for(let i=0;i<n;i++){
      const t=(i+0.5)/n;
      const cx=f.dir?f.x:lerp(f.x0,f.x1,t), cz=f.dir?lerp(f.z0,f.z1,t):f.z;
      const x=cx+(azar()-0.5)*8, z=cz+(azar()-0.5)*8;
      if(Math.hypot(x-CANTERA.x,z-CANTERA.z)<230) continue;
      const q=carreteraCerca(x,z,30); if(q && q.d<q.c.ancho/2+4) continue;
      const c={ x, z, y:altura(x,z)-0.2, w:7+azar()*4, d:6+azar()*3, h:3.2+azar()*2.4,
                pared:PAREDES[(azar()*PAREDES.length)|0], tejado:TEJADOS[(azar()*TEJADOS.length)|0], giro:f.dir?Math.PI/2:0 };
      CASAS.push(c); chApunta(c,c.x-c.w/2,c.z-c.d/2,c.x+c.w/2,c.z+c.d/2);
    }
  }
}
/* 🚦 farolas, señales de curva y pórticos de la autopista */
function poneSenales(){
  FAROLAS.length=0; FLECHAS.length=0; PORTICOS.length=0;
  for(const c of CARRETERAS){
    const cada = c.tipo==="autopista"?10 : c.tipo==="ciudad"?9 : 0;
    if(cada) for(let i=0;i<c.n;i+=cada){ const lado=(i/cada)%2?1:-1, off=c.ancho/2+1.2;
      FAROLAS.push({ x:c.x[i]-c.tz[i]*off*lado, z:c.z[i]+c.tx[i]*off*lado, y:c.y[i], nx:c.tz[i]*lado, nz:-c.tx[i]*lado }); }
    if(c.tipo==="monte"||c.tipo==="lago") for(let i=6;i<c.n-6;i+=5){
      const a=Math.atan2(c.tz[i-5],c.tx[i-5]), b=Math.atan2(c.tz[i+5],c.tx[i+5]), giro=angDif(a,b);
      if(Math.abs(giro)<0.42) continue;
      const lado=giro>0?-1:1, off=c.ancho/2+2.2;                        /* por fuera de la curva */
      FLECHAS.push({ x:c.x[i]-c.tz[i]*off*lado, z:c.z[i]+c.tx[i]*off*lado, y:c.y[i], tx:c.tx[i], tz:c.tz[i], dir:giro>0?1:-1 });
    }
  }
  const au=CARRETERAS.find(c=>c.tipo==="autopista");
  [[40,"CIUDAD EDTU  ➜"],[150,"LAGO PLATEADO  ⬇"],[260,"CUMBRE NEVADA  ⬆"],[380,"CANTERA ROJA  ➜"]].forEach(([i,t])=>{
    if(i<au.n) PORTICOS.push({ x:au.x[i], z:au.z[i], y:au.y[i], tx:au.tx[i], tz:au.tz[i], ancho:au.ancho+4, texto:t }); });
}

/* 🛫 las rampas: una cuña sobre la carretera donde luego la carretera baja */
function rampaAltura(x,z){
  let mejor=null;
  for(const r of RAMPAS){
    const dx=x-r.x, dz=z-r.z, u=dx*r.tx+dz*r.tz, v=-dx*r.tz+dz*r.tx;
    if(Math.abs(v)<=r.ancho/2 && u>=0 && u<=r.largo){ const t=u/r.largo, y=r.y+r.alto*(t*t*0.35+t*0.65); if(mejor===null||y>mejor) mejor=y; }
  }
  return mejor;
}
function poneRampa(c,i,sentido){
  sentido=sentido||1;
  const i0=clamp(i-6*sentido,0,c.n-1);                                  /* la cuña empieza 24 m antes, en el sentido de la bajada */
  RAMPAS.push({ x:c.x[i0], z:c.z[i0], y:c.y[i0]-0.05, tx:c.tx[i0]*sentido, tz:c.tz[i0]*sentido, largo:24, ancho:c.ancho-1, alto:3.6 });
  return RAMPAS[RAMPAS.length-1];
}
/* dónde baja más la carretera en los 60 m siguientes (ahí un salto luce) */
function mejorBajada(c,desde,hasta){
  let mejor={ i:desde, sentido:1, baja:-1e9 };
  for(let i=Math.max(desde,16);i<Math.min(hasta,c.n-16);i++){
    const alante=c.y[i]-c.y[i+15], atras=c.y[i]-c.y[i-15];          /* se puede saltar en los dos sentidos */
    if(alante>mejor.baja) mejor={ i, sentido:1, baja:alante };
    if(atras>mejor.baja) mejor={ i, sentido:-1, baja:atras };
  }
  return mejor;
}

/* 🏁 los eventos del mapa libre: zonas de derrape, radares de velocidad y saltos */
function poneEventos(){
  EVENTOS.length=0; RAMPAS.length=0;
  const porNombre=n=>CARRETERAS.find(c=>c.nombre===n);
  const paso=porNombre("Paso de la Cumbre"), cant=porNombre("Circuito de la Cantera"), au=porNombre("Autopista 7"), lago=porNombre("Vuelta al Lago Plateado"), camino=porNombre("Camino de la Cantera");
  EVENTOS.push({ tipo:"derrape", nombre:"ZONA DE DERRAPE", c:paso, i0:30, i1:Math.min(paso.n-2,125), metas:[150,240,330], tiempo:60 });
  EVENTOS.push({ tipo:"derrape", nombre:"ZONA DE DERRAPE", c:cant, i0:4, i1:Math.floor(cant.n*0.8), metas:[180,280,380], tiempo:60 });
  EVENTOS.push({ tipo:"radar", nombre:"RADAR DE VELOCIDAD", c:au, i:Math.floor(au.n*0.42), metas:[160,200,240] });
  EVENTOS.push({ tipo:"radar", nombre:"RADAR DE VELOCIDAD", c:lago, i:Math.floor(lago.n*0.62), metas:[130,160,190] });
  EVENTOS.push({ tipo:"derrape", nombre:"ZONA DE DERRAPE", c:camino, i0:6, i1:camino.n-8, metas:[120,190,260], tiempo:50 });
  EVENTOS.push({ tipo:"radar", nombre:"RADAR DE VELOCIDAD", c:paso, i:Math.floor(paso.n*0.80), metas:[90,120,150] });
  { const av=CARRETERAS.find(x=>x.nombre==="Avenida 2");
    if(av) EVENTOS.push({ tipo:"radar", nombre:"RADAR DE VELOCIDAD", c:av, i:Math.floor(av.n*0.5), metas:[120,150,180] }); }
  const s1=mejorBajada(paso,Math.floor(paso.n*0.35),paso.n-20);
  EVENTOS.push({ tipo:"salto", nombre:"SALTO", c:paso, i:s1.i, sentido:s1.sentido, baja:s1.baja, rampa:poneRampa(paso,s1.i,s1.sentido), metas:[25,45,70] });
  const s2=mejorBajada(camino,10,camino.n-20);
  EVENTOS.push({ tipo:"salto", nombre:"SALTO", c:camino, i:s2.i, sentido:s2.sentido, baja:s2.baja, rampa:poneRampa(camino,s2.i,s2.sentido), metas:[25,45,70] });
  for(const e of EVENTOS){ const i=e.i!==undefined?e.i:e.i0; e.x=e.c.x[i]; e.z=e.c.z[i]; e.y=e.c.y[i]; e.mejor=0; }
  /* 🏟️ EL CENTRO DE EVENTOS: junto a la ciudad, en la Avenida 5. Aquí se entra a NO SPEED LIMIT */
  {
    const av=CARRETERAS.find(x=>x.nombre==="Avenida 5"), pista=CARRETERAS.find(x=>x.futurista);
    if(av && pista){
      const i=Math.floor(av.n*0.5);
      EVENTOS.push({ tipo:"centro", nombre:"CENTRO DE EVENTOS", c:av, i, x:av.x[i]+28, z:av.z[i], y:av.y[i], mejor:0,
                     metas:[1,2,3], carrera:{ nombre:"NO SPEED LIMIT", c:pista, i0:0, i1:pista.n-1, s:1, vueltas:4,
                                              largo:pista.n*MUESTRA*4, corredores:50, premio:100000, gran:true } });   /* 🏁 más larga: 4 vueltas */
    }
  }
}

/* ================= 🏗️ CONSTRUIR TODO (con barra de progreso) ================= */
async function construyeMundo(progreso){
  const p=progreso||(()=>{});
  p(0.02,"trazando las carreteras…"); trazaCarreteras(); indexaCarreteras(); ajustaCruces();
  await construyeTerreno(f=>p(0.05+f*0.55,"levantando las montañas…"));
  CHOQUES.fill(undefined);
  const azar=azarCon(2026);
  p(0.62,"plantando los pinos…"); await new Promise(r=>setTimeout(r,0)); poneArboles(azar);
  p(0.72,"construyendo la ciudad…"); poneCiudad(azar);
  p(0.74,"levantando el barrio…"); poneCasas(azar);
  p(0.76,"poniendo señales…"); poneSenales(); poneEventos(); if(typeof defineCarreras==="function") defineCarreras();
}

/* ================= 🖥️ WEBGL2: la tarjeta gráfica dibuja el mundo =================
   Se dibuja en un lienzo interno con antialiasing (MSAA) y en color HDR; luego un paso final
   añade el brillo (bloom), el tono de cine, la viñeta y el desenfoque de velocidad */
let gl=null;
const A_POS=0, A_NOR=1, A_COL=2, A_EXT=3, A_UV=4, A_INST=5, A_INST2=6;
const PROGS={};

const GLSL_LUZ=`
uniform vec3 uCam, uSol, uSolCol, uCenit, uHorizonte, uSuelo, uNiebla;
uniform float uNieblaD, uTiempo, uEmi, uNoche;
uniform highp sampler2DShadow uSombra;
uniform mat4 uLuzVP;
uniform float uHaySombra;
float sombra(vec3 p, vec3 n){
  if(uHaySombra<0.5) return 1.0;
  vec4 q=uLuzVP*vec4(p+n*0.12,1.0); vec3 s=q.xyz/q.w*0.5+0.5;

vec3 cieloDir(vec3 d){

const VS_MUNDO=`#version 300 es

const FS_CIELO=`#version 300 es

/* ✨ partículas: humo (se mezcla) y fuego/neón/chispas (se suma a la luz) */

const FS_FINAL=`#version 300 es

uniform sampler2D uImg, uBloom; uniform float uVel, uExpo, uFlash; uniform vec3 uSolPant; uniform vec3 uSolCol;

function compila(nombre,vs,fs){
  const mk=(tipo,txt)=>{ const s=gl.createShader(tipo); gl.shaderSource(s,txt); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(nombre+": "+gl.getShaderInfoLog(s)); return s; };
  const p=gl.createProgram(); gl.attachShader(p,mk(gl.VERTEX_SHADER,vs)); gl.attachShader(p,mk(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(nombre+": "+gl.getProgramInfoLog(p));
  p.u={}; p.nombre=nombre; PROGS[nombre]=p; return p;
}
const U=(p,n)=>(n in p.u)?p.u[n]:(p.u[n]=gl.getUniformLocation(p,n));

/* una malla: posiciones, normales, colores, (brillo, emisivo) y uv → a la tarjeta */
function subeMalla(m){
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf=(datos,loc,tam)=>{ if(!datos) return; const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,datos,gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,tam,gl.FLOAT,false,0,0); };
  buf(m.pos,A_POS,3); buf(m.nor,A_NOR,3); buf(m.col,A_COL,3); buf(m.ext,A_EXT,2); buf(m.uv,A_UV,2);
  if(!m.ext){ gl.disableVertexAttribArray(A_EXT); gl.vertexAttrib2f(A_EXT,0,0); }
  if(!m.uv){ gl.disableVertexAttribArray(A_UV); gl.vertexAttrib2f(A_UV,0,0); }
  const ib=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,m.idx,gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return { vao, n:m.idx.length, tipo:(m.idx instanceof Uint32Array)?gl.UNSIGNED_INT:gl.UNSIGNED_SHORT };
}
function texturaDeLienzo(lienzo,repite){
  const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,lienzo);

  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  const w=repite?gl.REPEAT:gl.CLAMP_TO_EDGE; gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,w); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,w);

}

/* 🧱 los lienzos internos: escena con MSAA, su copia resuelta, dos para el bloom y el mapa de sombras */
const FBO={};
function texVacia(w,h,interno,formato,tipo){
  const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t); gl.texImage2D(gl.TEXTURE_2D,0,interno,w,h,0,formato,tipo,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE); return t;
}
function creaLienzos(w,h){
  for(const k in FBO){ const f=FBO[k]; if(f.fb) gl.deleteFramebuffer(f.fb); if(f.tex) gl.deleteTexture(f.tex); if(f.rb) gl.deleteRenderbuffer(f.rb); if(f.rbz) gl.deleteRenderbuffer(f.rbz); delete FBO[k]; }
  const hdr=!!gl.getExtension("EXT_color_buffer_float");
  const fmt=hdr?gl.RGBA16F:gl.RGBA8, muestras=Math.min(4,gl.getParameter(gl.MAX_SAMPLES));
  const escena={ fb:gl.createFramebuffer(), rb:gl.createRenderbuffer(), rbz:gl.createRenderbuffer(), w, h };
  gl.bindRenderbuffer(gl.RENDERBUFFER,escena.rb); gl.renderbufferStorageMultisample(gl.RENDERBUFFER,muestras,fmt,w,h);
  gl.bindRenderbuffer(gl.RENDERBUFFER,escena.rbz); gl.renderbufferStorageMultisample(gl.RENDERBUFFER,muestras,gl.DEPTH_COMPONENT24,w,h);
  gl.bindFramebuffer(gl.FRAMEBUFFER,escena.fb);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,escena.rb);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,escena.rbz);
  FBO.escena=escena;
  const conTex=(nombre,tw,th)=>{ const f={ fb:gl.createFramebuffer(), tex:texVacia(tw,th,fmt,gl.RGBA,hdr?gl.HALF_FLOAT:gl.UNSIGNED_BYTE), w:tw, h:th };
    gl.bindFramebuffer(gl.FRAMEBUFFER,f.fb); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,f.tex,0); FBO[nombre]=f; };
  conTex("resuelta",w,h);
  const bw=Math.max(1,Math.round(w/4)), bh=Math.max(1,Math.round(h/4));
  conTex("bloomA",bw,bh); conTex("bloomB",bw,bh);
  if(!FBO.sombra || true){
    const s={ fb:gl.createFramebuffer(), tex:gl.createTexture(), w:4096, h:4096 };
    gl.bindTexture(gl.TEXTURE_2D,s.tex); gl.texStorage2D(gl.TEXTURE_2D,1,gl.DEPTH_COMPONENT24,4096,4096);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_MODE,gl.COMPARE_REF_TO_TEXTURE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_FUNC,gl.LEQUAL);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER,s.fb); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,s.tex,0);
    FBO.sombra=s;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return { hdr, muestras };
}

function iniciaGL(lienzo){
  gl=lienzo.getContext("webgl2",{ antialias:false, alpha:false, depth:true, powerPreference:"high-performance", preserveDrawingBuffer:false });
  if(!gl) return false;
  compila("mundo",VS_MUNDO,FS_MUNDO);
  compila("arbol",VS_ARBOL,FS_MUNDO);
  compila("sombra",VS_SOMBRA,FS_VACIO);
  compila("sombraArbol",VS_SOMBRA_ARBOL,FS_VACIO);
  compila("cielo",VS_PANTALLA,FS_CIELO);
  compila("part",VS_PART,FS_PART);
  compila("brillo",VS_PANTALLA,FS_BRILLO);
  compila("blur",VS_PANTALLA,FS_BLUR);
  compila("final",VS_PANTALLA,FS_FINAL);

}

/* ================= 🎨 LAS TEXTURAS, PINTADAS CON CÓDIGO =================
   En el canal alfa va el BRILLO: los charcos del asfalto y los cristales brillan, el hormigón no */
function lienzo(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; }

/* ruido que se repite sin costuras (para que el suelo no tenga cortes) */
function ruidoCiclico(tam,celdas,semilla){
  const r=azarCon(semilla), g=new Float32Array(celdas*celdas); for(let i=0;i<g.length;i++) g[i]=r();
  const out=new Float32Array(tam*tam);
  for(let y=0;y<tam;y++){ const fy=y/tam*celdas, j=Math.floor(fy), v0=fy-j, v=v0*v0*(3-2*v0), j1=(j+1)%celdas;
    for(let x=0;x<tam;x++){ const fx=x/tam*celdas, i=Math.floor(fx), u0=fx-i, u=u0*u0*(3-2*u0), i1=(i+1)%celdas;
      const a=g[j*celdas+i], b=g[j*celdas+i1], c=g[j1*celdas+i], d=g[j1*celdas+i1];
      out[y*tam+x]=(a+(b-a)*u)*(1-v)+(c+(d-c)*u)*v; } }
  return out;
}
function texDetalle(){
  const T=512, c=lienzo(T,T), x=c.getContext("2d"), im=x.createImageData(T,T);
  const a=ruidoCiclico(T,8,11), b=ruidoCiclico(T,32,12), d=ruidoCiclico(T,128,13);
  for(let i=0;i<T*T;i++){ const v=clamp(a[i]*0.45+b[i]*0.33+d[i]*0.22,0,1)*255; im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v; im.data[i*4+3]=255; }
  x.putImageData(im,0,0); return c;
}

/* 🛣️ el asfalto de cada tipo de carretera. La textura cubre el ancho entero y 24 m de largo */
function texCarretera(tipo,ancho){
  const W=512, H=1024, c=lienzo(W,H), x=c.getContext("2d"), r=azarCon(tipo.length*977+ancho);
  const pxm=W/ancho;                                            /* píxeles por metro, a lo ancho */
  x.fillStyle = tipo==="tierra" ? "#8c6c4c" : (tipo==="ciudad" ? "#454548" : (tipo==="pista" ? "#16162a" : "#38383b")); x.fillRect(0,0,W,H);   /* 🛸 la pista, casi negra */
  for(let i=0;i<26000;i++){ const v=r();
    x.fillStyle = tipo==="tierra" ? "rgba("+((70+v*90)|0)+","+((48+v*60)|0)+","+((30+v*40)|0)+",0.45)" : "rgba("+((30+v*70)|0)+","+((30+v*70)|0)+","+((32+v*72)|0)+",0.40)";
    x.fillRect(r()*W,r()*H,1+r()*2.5,1+r()*2.5); }
  /* las rodadas: más oscuras (asfalto) o más hundidas (tierra) */
  const rodadas = tipo==="autopista" ? [0.12,0.30,0.70,0.88] : [0.22,0.36,0.64,0.78];
  for(const u of rodadas){ const g=x.createLinearGradient((u-0.05)*W,0,(u+0.05)*W,0);
    g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(0.5,tipo==="tierra"?"rgba(60,40,24,.35)":"rgba(10,10,12,.28)"); g.addColorStop(1,"rgba(0,0,0,0)");
    x.fillStyle=g; x.fillRect((u-0.05)*W,0,0.1*W,H); }
  const linea=(u,anchoM,color,trazo)=>{ x.fillStyle=color; const w=Math.max(2,anchoM*pxm);
    if(!trazo) x.fillRect(u*W-w/2,0,w,H); else for(let v=0;v<H;v+=H/2) x.fillRect(u*W-w/2,v,w,H/2*trazo); };
  if(tipo!=="tierra"){
    const blanco="rgba(236,236,230,.92)", amarillo="rgba(236,184,40,.95)", borde=0.45/ancho;
    linea(borde,0.15,blanco); linea(1-borde,0.15,blanco);

    else { linea(0.5-0.14/ancho,0.12,amarillo); linea(0.5+0.14/ancho,0.12,amarillo); }
    if(tipo==="autopista"){ linea(0.25,0.14,blanco,0.3); linea(0.75,0.14,blanco,0.3); }

  const im=x.getImageData(0,0,W,H), n1=ruidoCiclico(256,6,ancho*7+tipo.length), n2=ruidoCiclico(256,24,ancho*3+1);
  for(let y=0;y<H;y++) for(let i=0;i<W;i++){

    im.data[(y*W+i)*4+3]=Math.round(255*clamp(0.32+charco,0,1));
  }
  x.putImageData(im,0,0);
  return c;
}

/* 🏢 la fachada: 2 pisos × 2 ventanales (8 m × 8 m), cristal que brilla y alguna luz encendida */

/* 🟩 los carteles verdes de la autopista, todos en una textura (una fila por cartel) */

/* ================= 🧱 LAS MALLAS DEL MUNDO =================
   Un "constructor" va juntando triángulos (posición, normal, color, brillo/emisivo y uv) y al final
   se sube todo de una vez a la tarjeta */
class Obra{
  constructor(){ this.p=[]; this.n=[]; this.c=[]; this.e=[]; this.t=[]; this.i=[]; }
  get nv(){ return this.p.length/3; }
  v(x,y,z,nx,ny,nz,col,ext,u,w){ this.p.push(x,y,z); this.n.push(nx,ny,nz); this.c.push(col[0],col[1],col[2]); this.e.push(ext?ext[0]:0,ext?ext[1]:0); this.t.push(u||0,w||0); return this.nv-1; }
  tri(a,b,c){ this.i.push(a,b,c); }
  /* un cuadrilátero con su normal (a,b,c,d en orden antihorario visto desde fuera) */
  quad(a,b,c,d,col,ext,uv){
    const cr=vCruz(vRes(b,a),vRes(d,a)), n=vLen(cr)>1e-9?vNorm(cr):v3(0,1,0), k=this.nv; uv=uv||[0,0,1,0,1,1,0,1];   /* 🐛 cara sin grosor: normal cero → NaN en el shader */
    this.v(a.x,a.y,a.z,n.x,n.y,n.z,col,ext,uv[0],uv[1]); this.v(b.x,b.y,b.z,n.x,n.y,n.z,col,ext,uv[2],uv[3]);
    this.v(c.x,c.y,c.z,n.x,n.y,n.z,col,ext,uv[4],uv[5]); this.v(d.x,d.y,d.z,n.x,n.y,n.z,col,ext,uv[6],uv[7]);
    this.tri(k,k+1,k+2); this.tri(k,k+2,k+3);
  }
  /* una caja girada en Y: centro de la base (x,y,z), medidas w (lado), h (alto), d (fondo), rumbo (tx,tz) */
  caja(x,y,z,w,h,d,col,ext,tx,tz,uvEsc){
    tx=tx===undefined?0:tx; tz=tz===undefined?1:tz;
    const rx=tz, rz=-tx, P=(a,b,c)=>v3(x+rx*a+tx*c, y+b, z+rz*a+tz*c), hw=w/2, hd=d/2;
    const q=[P(-hw,0,-hd),P(hw,0,-hd),P(hw,0,hd),P(-hw,0,hd),P(-hw,h,-hd),P(hw,h,-hd),P(hw,h,hd),P(-hw,h,hd)];
    const uv=(a,b)=>uvEsc?[0,0,a/uvEsc,0,a/uvEsc,b/uvEsc,0,b/uvEsc]:undefined;
    this.quad(q[1],q[0],q[4],q[5],col,ext,uv(w,h)); this.quad(q[3],q[2],q[6],q[7],col,ext,uv(w,h));
    this.quad(q[0],q[3],q[7],q[4],col,ext,uv(d,h)); this.quad(q[2],q[1],q[5],q[6],col,ext,uv(d,h));
    this.quad(q[4],q[7],q[6],q[5],col,ext); this.quad(q[0],q[1],q[2],q[3],col,ext);
  }
  /* un cono o cilindro con lados lisos: base (x,y0,z) de radio r0 hasta y1 con radio r1 */
  cono(x,y0,z,r0,y1,r1,lados,col,ext,colArriba){
    const k0=this.nv, pend=(r0-r1)/Math.max(0.001,y1-y0);
    for(let s=0;s<=lados;s++){ const a=s/lados*TAU, cx=Math.cos(a), cz=Math.sin(a), n=vNorm(v3(cx,pend,cz));
      this.v(x+cx*r0,y0,z+cz*r0,n.x,n.y,n.z,col,ext); this.v(x+cx*r1,y1,z+cz*r1,n.x,n.y,n.z,colArriba||col,ext); }
    for(let s=0;s<lados;s++){ const a=k0+s*2; this.tri(a,a+2,a+1); this.tri(a+1,a+2,a+3); }
  }
  malla(){
    const nv=this.nv;
    return { pos:new Float32Array(this.p), nor:new Float32Array(this.n), col:new Float32Array(this.c), ext:new Float32Array(this.e),
             uv:new Float32Array(this.t), idx: nv>65535?new Uint32Array(this.i):new Uint16Array(this.i) };
  }
}

/* 🗻 el terreno: la rejilla de alturas con colores de hierba, roca, nieve, arena, tierra y hormigón */
function obraTerreno(){
  const n=NV, pos=new Float32Array(n*n*3), nor=new Float32Array(n*n*3), col=new Float32Array(n*n*3), ext=new Float32Array(n*n*2);
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const k=j*n+i, x=-MITAD+i*PASO, z=-MITAD+j*PASO, y=ALT[k];
    const hl=ALT[j*n+Math.max(0,i-1)], hr=ALT[j*n+Math.min(n-1,i+1)], hd=ALT[Math.max(0,j-1)*n+i], hu=ALT[Math.min(n-1,j+1)*n+i];
    const N=vNorm(v3(hl-hr,2*PASO,hd-hu));
    pos[k*3]=x; pos[k*3+1]=y; pos[k*3+2]=z; nor[k*3]=N.x; nor[k*3+1]=N.y; nor[k*3+2]=N.z;
    const v=fbm(x/90,z/90,3), v2=fbm(x/23+5,z/23,2);
    let c=[0.26+v*0.06+v2*0.03, 0.36+v*0.07, 0.14+v2*0.03];                          /* hierba */
    const seca=suave(0.1,0.5,fbm(x/400-7,z/400+2,3)); c=[lerp(c[0],0.44,seca*0.6),lerp(c[1],0.40,seca*0.5),lerp(c[2],0.20,seca*0.5)];
    const roca=suave(0.84,0.70,N.y);                                                  /* ⛰️ la roca, donde está empinado */
    c=[lerp(c[0],0.47+v*0.05,roca),lerp(c[1],0.43+v*0.05,roca),lerp(c[2],0.37+v*0.04,roca)];
    const nieve=suave(360,440,y+v*40)*suave(0.62,0.80,N.y);                           /* ❄️ la nieve de arriba */
    c=[lerp(c[0],0.92,nieve),lerp(c[1],0.94,nieve),lerp(c[2],0.98,nieve)];
    const arena=suave(4.5,1.5,y);                                                     /* 🏖️ la orilla del lago */
    c=[lerp(c[0],0.58,arena),lerp(c[1],0.52,arena),lerp(c[2],0.40,arena)];
    if(y<-1){ const f=suave(-1,-10,y); c=[lerp(c[0],0.16,f),lerp(c[1],0.20,f),lerp(c[2],0.18,f)]; }
    const dq=Math.hypot(x-CANTERA.x,z-CANTERA.z), cant=suave(230,170,dq);            /* ⛏️ la tierra roja de la cantera */
    c=[lerp(c[0],0.56+v*0.05,cant),lerp(c[1],0.36+v*0.04,cant),lerp(c[2],0.24,cant)];
    const ciu=suave(0,40,Math.min(x-CIUDAD.x0,CIUDAD.x1-x,z-CIUDAD.z0,CIUDAD.z1-z));  /* 🏙️ la acera de la ciudad */
    c=[lerp(c[0],0.46,ciu),lerp(c[1],0.46,ciu),lerp(c[2],0.47,ciu)];
    col[k*3]=c[0]; col[k*3+1]=c[1]; col[k*3+2]=c[2]; ext[k*2]=0.04+nieve*0.25;
  }
  const idx=new Uint32Array((n-1)*(n-1)*6); let q=0;
  for(let j=0;j<n-1;j++) for(let i=0;i<n-1;i++){ const a=j*n+i, b=a+1, c=a+n, d=c+1; idx[q++]=a; idx[q++]=c; idx[q++]=b; idx[q++]=b; idx[q++]=c; idx[q++]=d; }
  return { pos, nor, col, ext, idx };
}

/* 🛣️ una malla por tipo de carretera: el asfalto (con uv), y aparte los arcenes, guardarraíles y vallas */
function obraCarreteras(){
  const porTipo={}, extra=new Obra();
  CARRETERAS.forEach((c,ci)=>{
    const O=porTipo[c.tipo]||(porTipo[c.tipo]=new Obra()), sube=0.07+ci*0.004;
    const tope=c.cerrada?c.n:c.n-1, h=c.ancho/2;
    let s=0;
    for(let i=0;i<=tope;i++){
      const k=i%c.n, x=c.x[k], z=c.z[k], y=c.y[k]+sube, nx=-c.tz[k], nz=c.tx[k];
      O.v(x-nx*h,y,z-nz*h,0,1,0,[1,1,1],[0,0],0,s/24); O.v(x+nx*h,y,z+nz*h,0,1,0,[1,1,1],[0,0],1,s/24);
      if(i>0){ const a=O.nv-4; O.tri(a,a+1,a+2); O.tri(a+1,a+3,a+2); }
      s+=MUESTRA;
    }
    /* arcén de grava y el guardarraíl o la valla, a los dos lados */
    for(const lado of [-1,1]){
      const base=extra.nv; let puestos=0;
      for(let i=0;i<=tope;i++){
        const k=i%c.n, nx=-c.tz[k]*lado, nz=c.tx[k]*lado, x=c.x[k], z=c.z[k], y=c.y[k]+sube-0.02;
        const g=[0.30,0.29,0.27];
        extra.v(x+nx*h,y,z+nz*h,0,1,0,g,[0,0]); extra.v(x+nx*(h+1.6),Math.min(y-0.05,altura(x+nx*(h+1.6),z+nz*(h+1.6))+0.05),z+nz*(h+1.6),0,1,0,g,[0,0]);
        if(i>0){ const a=base+(i-1)*2; extra.tri(a,a+2,a+1); extra.tri(a+1,a+2,a+3); }
      }
      if(c.tipo==="monte"||c.tipo==="lago"||c.tipo==="autopista"||c.tipo==="pista"){
        const madera=c.tipo==="lago", neon=c.tipo==="pista";
        const colR=neon?[0.10,0.80,1.0]:(madera?[0.42,0.32,0.22]:[0.62,0.64,0.66]), extR=neon?[0.2,1.5]:(madera?[0.05,0]:[0.55,0]);   /* 🛸 neón */
        for(let i=0;i<tope;i+=1){
          const k=i%c.n, k2=(i+1)%c.n, off=h+0.9;
          const cae=Math.abs(altura(c.x[k]+(-c.tz[k]*lado)*(h+7),c.z[k]+(c.tx[k]*lado)*(h+7))-c.y[k]);
          if(c.tipo!=="autopista" && c.tipo!=="pista" && cae<2.2){ continue; }   /* 🛸 la pista siempre lleva muro */
          const A=v3(c.x[k]-c.tz[k]*lado*off, c.y[k]+sube, c.z[k]+c.tx[k]*lado*off), B=v3(c.x[k2]-c.tz[k2]*lado*off, c.y[k2]+sube, c.z[k2]+c.tx[k2]*lado*off);
          const alto=madera?0.95:0.82, banda=madera?0.14:0.32;
          const q1=lado>0?[A,B]:[B,A];
          extra.quad(v3(q1[0].x,q1[0].y+alto-banda,q1[0].z),v3(q1[1].x,q1[1].y+alto-banda,q1[1].z),v3(q1[1].x,q1[1].y+alto,q1[1].z),v3(q1[0].x,q1[0].y+alto,q1[0].z),colR,extR);
          extra.quad(v3(q1[1].x,q1[1].y+alto-banda,q1[1].z),v3(q1[0].x,q1[0].y+alto-banda,q1[0].z),v3(q1[0].x,q1[0].y+alto,q1[0].z),v3(q1[1].x,q1[1].y+alto,q1[1].z),colR,extR);
          if(madera){ extra.quad(v3(q1[0].x,q1[0].y+0.40,q1[0].z),v3(q1[1].x,q1[1].y+0.40,q1[1].z),v3(q1[1].x,q1[1].y+0.54,q1[1].z),v3(q1[0].x,q1[0].y+0.54,q1[0].z),colR,extR); }
          if(i%(madera?1:2)===0) extra.caja(A.x,A.y-0.3,A.z,0.14,alto+0.3,0.14,madera?[0.36,0.27,0.18]:[0.5,0.5,0.52],extR,c.tx[k],c.tz[k]);
          puestos++;
        }
      }
    }
  });
  return { porTipo, extra };
}

/* 🌊 el agua del lago */
function obraAgua(){
  const O=new Obra(), x0=LAGO.x-LAGO.r-140, x1=LAGO.x+LAGO.r+140, z0=LAGO.z-LAGO.r-140, z1=LAGO.z+LAGO.r+140, N=10, col=[0.05,0.13,0.16];

  for(let j=0;j<N;j++) for(let i=0;i<N;i++){ const a=j*(N+1)+i; O.tri(a,a+N+1,a+1); O.tri(a+1,a+N+1,a+N+2); }

/* 🏙️ los edificios: fachada con ventanas (textura) y azotea aparte */
function obraEdificios(){
  const F=new Obra(), T=new Obra();
  for(const e of EDIFICIOS){
    const hw=e.w/2, hd=e.d/2, y0=e.y-1, y1=e.y+e.h, col=e.col, ext=[0,0.02*e.ventanas];
    const P=(a,b,c)=>v3(e.x+a,b,e.z+c);
    const caras=[[P(-hw,0,hd),P(hw,0,hd),e.w],[P(hw,0,hd),P(hw,0,-hd),e.d],[P(hw,0,-hd),P(-hw,0,-hd),e.w],[P(-hw,0,-hd),P(-hw,0,hd),e.d]];
    for(const [a,b,largo] of caras){
      const u=Math.max(1,Math.round(largo/8)), v=e.h/8;
      F.quad(v3(a.x,y0,a.z),v3(b.x,y0,b.z),v3(b.x,y1,b.z),v3(a.x,y1,a.z),col,ext,[0,0,u,0,u,v,0,v]);
    }
    T.quad(P(-hw,y1,hd),P(hw,y1,hd),P(hw,y1,-hd),P(-hw,y1,-hd),[col[0]*0.7,col[1]*0.7,col[2]*0.72],[0.05,0]);
    if(e.h>40) T.caja(e.x+hw*0.3,y1,e.z-hd*0.2,e.w*0.25,3+e.h*0.03,e.d*0.25,[0.35,0.36,0.38],[0.1,0]);
  }
  return { fachadas:F, azoteas:T };
}
/* 🧭 una CINTA LUMINOSA por el suelo (la ruta): un cuadrilátero por tramo, un pelín por encima del asfalto */
function obraLinea(pts,col,ancho,emi){
  const O=new Obra(); if(!pts||pts.length<2) return O;
  const w=(ancho||1.2)/2, ext=[0.08, emi===undefined?0.6:emi];   /* fina y con brillo suave: guía, no foco */
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1], dx=b.x-a.x, dz=b.z-a.z, l=Math.hypot(dx,dz);
    if(l<0.01) continue;
    const nx=-dz/l*w, nz=dx/l*w, y0=a.y+0.12, y1=b.y+0.12;   /* 12 cm: por encima del polygonOffset del asfalto */
    O.quad(v3(a.x+nx,y0,a.z+nz), v3(b.x+nx,y1,b.z+nz), v3(b.x-nx,y1,b.z-nz), v3(a.x-nx,y0,a.z-nz), col, ext);
  }
  return O;
}
/* 🏠 las casas: caja de paredes, tejado a dos aguas, puerta y ventanas */
function obraCasas(){
  const O=new Obra();
  for(const c of CASAS){
    const tx=Math.sin(c.giro), tz=Math.cos(c.giro), rx=tz, rz=-tx;
    O.caja(c.x,c.y,c.z,c.w,c.h,c.d,c.pared,[0.05,0],tx,tz);
    /* el tejado: dos faldones que se juntan en la cumbrera */
    const hw=c.w/2+0.35, hd=c.d/2+0.35, y0=c.y+c.h, cum=y0+1.5+c.h*0.12;
    const P=(a,b,cc)=>v3(c.x+rx*a+tx*cc, b, c.z+rz*a+tz*cc);
    const A=P(-hw,y0,-hd), B=P(hw,y0,-hd), C=P(hw,y0,hd), D=P(-hw,y0,hd);
    const E=P(0,cum,-hd), F=P(0,cum,hd);
    O.quad(A,B,E,E,c.tejado,[0.1,0]);          /* frontón de delante */
    O.quad(C,D,F,F,c.tejado,[0.1,0]);          /* frontón de atrás */
    O.quad(B,C,F,E,c.tejado,[0.1,0]);          /* faldón derecho */
    O.quad(D,A,E,F,c.tejado,[0.1,0]);          /* faldón izquierdo */
    /* la puerta y dos ventanas */
    O.caja(c.x+tx*(c.d/2+0.06),c.y,c.z+tz*(c.d/2+0.06),1.0,2.0,0.12,[0.30,0.20,0.14],[0.1,0],tx,tz);
    for(const s of [-1,1]) O.caja(c.x+rx*s*c.w*0.28+tx*(c.d/2+0.06), c.y+1.3, c.z+rz*s*c.w*0.28+tz*(c.d/2+0.06),
      1.1,1.1,0.10,[0.25,0.35,0.45],[0.8,0.05],tx,tz);
  }
  return O;
}
/* 🚦 farolas, señales, pórticos, rampas y las marcas moradas de los eventos */
function obraDetalles(){
  const O=new Obra(), S=new Obra(), P=new Obra(), gris=[0.42,0.43,0.45], metal=[0.55,0.3];

  if(C.enSuelo){

    C.usandoNitro=E.nitro && C.nitro>0.01 && E.gas>0.1;
    const M=(typeof MEJ!=="undefined")?MEJ:{vmax:1,acel:1,agarre:1,freno:1,nitroGasto:1,nitroEmpuje:1};   /* 🔧 las mejoras del garaje */
    /* 🐛 las mejoras de motor y de nitro se multiplicaban entre ellas: con todo al máximo salían 462 km/h.
       Ahora hay un tope absoluto de 94 m/s (338 km/h), que ya es una barbaridad */
    const vmax=Math.min(94,(C.usandoNitro?VMAX_NITRO*M.nitroEmpuje:VMAX)*M.vmax*MO.vel)*(C.fueraCarretera?0.62:1);
    if(E.gas>0 && vF>-1){ const f=clamp(1-(vF/vmax)*(vF/vmax),0,1); vF+=E.gas*(10.5*M.acel*MO.acel*f+(C.usandoNitro?8.5*M.nitroEmpuje:0))*dt; }

    C.giroV+=(yawObj-C.giroV)*(1-Math.exp(-dt*(C.derrapando?3.2:11)));
    const agarre=(C.derrapando?(tierra?1.1:1.5):(tierra?5.5:10))*M.agarre*MO.agarre;
    const antes=vR; vR*=Math.exp(-agarre*dt);
    if(C.derrapando){ vF+=Math.abs(antes-vR)*0.62*Math.sign(vF||1); if(E.mano) vF-=vF*0.10*dt; }   /* el derrape guarda la velocidad: divierte más */
    /* se inclina con la curva y cabecea al acelerar o frenar */
    C.alabeo=lerp(C.alabeo,clamp(-C.giroV*vF*0.010,-0.10,0.10),1-Math.exp(-dt*6));
    C.cabeceo=lerp(C.cabeceo,clamp((E.freno>0&&vF>1?0.035:0)-(E.gas*0.02),-0.05,0.05),1-Math.exp(-dt*5));
  } else {
    C.giroV*=Math.exp(-dt*0.8); C.usandoNitro=false;
    C.cabeceo=lerp(C.cabeceo,clamp(-C.vy*0.012,-0.25,0.25),1-Math.exp(-dt*2));
  }
  /* 🐛 la velocidad se vuelve a montar con el rumbo de ANTES de girar: si se montara con el nuevo,
        giraría pegada al coche y la parte de atrás no podría deslizar nunca (derrape de 0°) */
  C.vx=fx*vF+rx*vR; C.vz=fz*vF+rz*vR;
  C.rumbo+=C.giroV*dt;
  const nfx=Math.sin(C.rumbo), nfz=Math.cos(C.rumbo);
  /* moverse, y chocar con árboles, edificios y el borde del mapa */
  let nx=C.x+C.vx*dt, nz=C.z+C.vz*dt;
  for(const adelante of [1.55,0,-1.55]){
    const px=nx+nfx*adelante, pz=nz+nfz*adelante, h=choqueEn(px,pz,1.0);
    if(h){ nx+=h.nx*h.pen; nz+=h.nz*h.pen; const vn=C.vx*h.nx+C.vz*h.nz;
      if(vn<0){ C.vx-=h.nx*vn*1.35; C.vz-=h.nz*vn*1.35; C.vx*=0.72; C.vz*=0.72; ev.choque=Math.max(ev.choque||0,-vn); C.golpe=Math.min(1,-vn/25); C.derrapando=false; } }
  }
  const tope=MITAD-25; if(Math.abs(nx)>tope||Math.abs(nz)>tope){ nx=clamp(nx,-tope,tope); nz=clamp(nz,-tope,tope); C.vx*=0.5; C.vz*=0.5; ev.choque=Math.max(ev.choque||0,8); }
  C.x=nx; C.z=nz;
  /* 🛫 el suelo: si la carretera baja más rápido de lo que el coche puede seguir, ¡al aire! */
  const S=sueloEn(C.x,C.z);
  if(C.enSuelo){
    C.rampa=lerp(C.rampa||0, C.vySuelo, 1-Math.exp(-dt*8));   /* la subida/bajada SOSTENIDA (una rampa dura medio segundo) */
    const esperado=C.y+C.vySuelo*dt, caida=esperado-S.y;
    /* 🐛 antes bastaba un escalón de unos centímetros en un cruce para salir volando. Ahora hace falta
          venir subiendo o bajando de verdad (una rampa) o que el suelo desaparezca de golpe (un barranco) */
    if(caida>0.18 && Math.hypot(C.vx,C.vz)>14 && (Math.abs(C.rampa)>2.5 || caida>1.2)){
      /* 🐛 antes bastaba un brinco de UN fotograma (un borde de carretera) para salir volando */
      C.enSuelo=false; C.vy=clamp(C.rampa,-30,30); C.aire=0; ev.despega=true;
    } else {
      const dif=S.y-C.y, maxPaso=Math.max(0.12,Math.abs(C.vF)*dt*0.55);
      /* la subida o bajada del suelo no puede pasar de una pendiente creíble (45%): así un escalón
         no se disfraza de rampa de 30 m/s, y una rampa de verdad sí cuenta */
      const tope=Math.abs(C.vF)*0.45+1;
      if(Math.abs(dif)<=maxPaso){ C.vySuelo=clamp(dif/dt,-tope,tope); C.y=S.y; }
      else C.y+=clamp(dif,-maxPaso,maxPaso);   /* 🐛 un ESCALÓN se sube poco a poco y NO cuenta como rampa
                                                     (si contaba, el coche creía que subía a 22 m/s y despegaba solo) */
      C.vy=0;
    }
  }
  if(!C.enSuelo){
    C.vy-=15.5*dt; C.y+=C.vy*dt; C.aire+=dt;
    if(C.y<=S.y){ ev.aterriza={ tiempo:C.aire, golpe:-C.vy }; C.y=S.y; C.enSuelo=true; C.vySuelo=0; C.rampa=0; C.vy=0; C.cabeceo=0.06; }
  }
  C.sobre=S.carretera; C.fueraCarretera=!S.carretera;
  /* 🧱 EL MURO DE LA PISTA: en la pista futurista no se puede salir. Si te pasas del borde, te
        devuelve al asfalto y te quita la velocidad que llevabas HACIA fuera (la de avance se respeta,
        solo se roza). */
  {
    const q=carreteraCerca(C.x,C.z,60);
    if(q && q.c.futurista){
      const tope=q.c.ancho/2-1.1;                       /* 1,1 m: el ancho del coche hasta el muro */
      if(q.d>tope){
        const j=(q.i+1)%q.c.n;
        const ax=q.c.x[q.i], az=q.c.z[q.i];
        const sx=q.c.x[j]-ax, sz=q.c.z[j]-az, l2=(sx*sx+sz*sz)||1;
        const t=clamp(((C.x-ax)*sx+(C.z-az)*sz)/l2,0,1);
        const px=ax+sx*t, pz=az+sz*t;                    /* el punto del eje más cercano */
        let nx=C.x-px, nz=C.z-pz; const d=Math.hypot(nx,nz)||1; nx/=d; nz/=d;
        C.x=px+nx*tope; C.z=pz+nz*tope;                  /* de vuelta dentro */
        const hacia=C.vx*nx+C.vz*nz;                     /* velocidad HACIA el muro */
        if(hacia>0){ C.vx-=nx*hacia*1.7; C.vz-=nz*hacia*1.7; C.golpe=Math.min(1,hacia/16); }
        C.vx*=0.97; C.vz*=0.97;                          /* rozar cuesta un poco */
      }
    }
  }
  if(C.enSuelo && S.carretera && S.carretera.c){ C.ultimoSuelo={ x:C.x, z:C.z, rumbo:C.rumbo }; }
  if(C.y<AGUA_Y-0.9){ ev.agua=true; }
  /* marcha y revoluciones, para el velocímetro y el sonido */
  const kmh=Math.abs(vF)*3.6, cambios=[0,45,82,120,160,205,999];
  let m=1; while(m<6 && kmh>cambios[m]) m++;
  if(m!==C.marcha) ev.cambio=m; C.marcha=m;
  C.rpm=clamp((kmh-cambios[m-1])/(cambios[m]===999?80:(cambios[m]-cambios[m-1])),0,1)*0.75+0.22;
  C.vuelta+=vF*dt/RUEDA_R; C.golpe*=Math.exp(-dt*4);
  C.vF=vF; C.vR=vR; C.kmh=kmh;
  return ev;
}
/* devuelve el coche a la última carretera pisada (si caes al lago o te quedas atascado) */
function recolocaCoche(C){
  const u=C.ultimoSuelo, q=carreteraCerca(u.x,u.z,60);
  if(q){ C.x=lerp(q.c.x[q.i],q.c.x[(q.i+1)%q.c.n],q.t); C.z=lerp(q.c.z[q.i],q.c.z[(q.i+1)%q.c.n],q.t);
    const r=Math.atan2(q.tx,q.tz); C.rumbo=Math.abs(angDif(u.rumbo,r))<Math.PI/2?r:r+Math.PI; }
  C.y=sueloEn(C.x,C.z).y; C.vx=C.vz=C.vy=0; C.giroV=0; C.enSuelo=true; C.derrapando=false;
}

/* ================= 🎥 LA CÁMARA DE PERSECUCIÓN ================= */
function nuevaCamara(C){ return { x:C.x-Math.sin(C.rumbo)*7, y:C.y+2.4, z:C.z-Math.cos(C.rumbo)*7, rumbo:C.rumbo, fov:1.05, temblor:0, modo:0, mirada:0 }; }
function camaraSigue(K,C,dt,mirar){
  const vel=Math.hypot(C.vx,C.vz);
  const estrecha=(typeof RENDER!=="undefined" && RENDER.h>RENDER.w);   /* 📱 pantalla de pie: la cámara sigue más rápido */
  /* en un derrape la cámara mira un poco hacia donde va el coche de verdad */
  const rumboVel=vel>4?Math.atan2(C.vx,C.vz):C.rumbo;
  const objetivo=C.rumbo+angDif(C.rumbo,rumboVel)*(C.derrapando?0.45:0.15);
  K.rumbo+=angDif(K.rumbo,objetivo)*(1-Math.exp(-dt*(C.enSuelo?4.5:1.5)*(estrecha?3.2:1)));   /* 📱 de pie, la cámara se pega más al coche: si no, en una pantalla estrecha se sale del encuadre */
  const lejos=([6.6,9.5,0][K.modo]+vel*0.018)*(estrecha?1.42:1), alto=[2.05,3.1,1.25][K.modo]*(estrecha?1.18:1);   /* 📱 de pie, la cámara se aleja y sube */
  /* 👀 la mirada: el stick derecho gira la vista ALREDEDOR del coche (a tope son media vuelta: miras atrás) */
  K.mirada=lerp(K.mirada||0,clamp(mirar||0,-1,1)*Math.PI,1-Math.exp(-dt*9));
  const rum=K.rumbo+K.mirada;
  const cx=C.x-Math.sin(rum)*lejos, cz=C.z-Math.cos(rum)*lejos;
  let cy=C.y+alto;
  if(K.modo===2){ K.x=C.x+Math.sin(C.rumbo)*0.2; K.z=C.z+Math.cos(C.rumbo)*0.2; K.y=C.y+1.25; }
  else {
    cy=Math.max(cy,sueloEn(cx,cz).y+0.8);
    const k=1-Math.exp(-dt*9); K.x=lerp(K.x,cx,k); K.z=lerp(K.z,cz,k); K.y=lerp(K.y,cy,1-Math.exp(-dt*6));
  }
  K.fov=lerp(K.fov,1.02+clamp(vel/80,0,1)*0.30+(C.usandoNitro?0.10:0),1-Math.exp(-dt*3));
  K.temblor=Math.max(K.temblor*Math.exp(-dt*5),C.golpe*0.5,C.usandoNitro?0.05:0,vel>60?0.02:0);
  const t=performance.now()/1000, tb=K.temblor;
  const ade=estrecha?2.0:3.2;                                          /* y mira menos lejos, para que el coche no se salga */
  K.mira=v3(C.x+Math.sin(rum)*ade+Math.sin(t*37)*tb*0.10, C.y+(K.modo===2?1.15:1.05)+Math.sin(t*41)*tb*0.08, C.z+Math.cos(rum)*ade+Math.cos(t*33)*tb*0.10);
}

/* ================= 🚗 EL TRÁFICO =================
   Coches normales que van por su carril. Nacen cerca de ti (nunca a la vista de golpe), siguen la
   carretera, frenan si tienen a otro delante y desaparecen cuando te alejas */
const TRAFICO=[], TRAF_MAX=50;   /* 🚗 el mapa es más grande: cabe mucho más tráfico */
const COLORES_TRAF=[[0.52,0.06,0.05],[0.05,0.16,0.48],[0.78,0.78,0.80],[0.10,0.10,0.12],[0.62,0.50,0.10],[0.16,0.38,0.24]];
/* 🚙 un coche normal (o una furgoneta): carrocería, techo, lunas, luces y ruedas, todo en una malla */
function obraTraficoCoche(col,furgo){
  const O=new Obra(), EXT=[0.55,0], vidrio=[0.05,0.07,0.09], EXTV=[0.9,0], negro=[0.05,0.05,0.06];
  const L=furgo?5.4:4.4, W=furgo?2.0:1.82, H=furgo?1.3:0.78, techo=furgo?1.15:0.72;
  O.caja(0,0.34,0,W,H,L,col,EXT);                                            /* la carrocería */
  O.caja(0,0.34+H,furgo?-0.2:-0.25,W*0.92,techo,furgo?L*0.62:L*0.46,furgo?col:vidrio,furgo?EXT:EXTV);
  if(!furgo) O.caja(0,0.34+H+techo-0.03,-0.25,W*0.86,0.06,L*0.42,col,EXT);   /* el techo pintado */
  for(const sx of [-0.62,0.62]){
    O.caja(sx*W/2*1.05,0.62,L/2-0.02,0.34,0.14,0.06,[1,0.96,0.85],[0.8,1.1]);      /* faros */
    O.caja(sx*W/2*1.05,0.62,-L/2+0.02,0.34,0.14,0.06,[1,0.08,0.06],[0.4,1.0]);     /* pilotos */
  }
  O.caja(0,0.28,L/2-0.1,W*0.9,0.12,0.2,negro,[0.2,0]); O.caja(0,0.28,-L/2+0.1,W*0.9,0.12,0.2,negro,[0.2,0]);
  for(const z of [L*0.30,-L*0.30]) for(const sx of [-1,1]){                        /* las ruedas */
    const x=sx*(W/2-0.16);
    for(let s=0;s<10;s++){ const a0=s/10*TAU, a1=(s+1)/10*TAU, r=0.33;
      const p=(a,xx)=>v3(x+xx,0.33+Math.sin(a)*r,z+Math.cos(a)*r);
      O.quad(p(a0,-0.12),p(a0,0.12),p(a1,0.12),p(a1,-0.12),negro,[0.15,0]); }
  }
  return O;
}
function obraTraficoMallas(){
  const lista=[];
  for(const c of COLORES_TRAF) lista.push(obraTraficoCoche(c,false));
  lista.push(obraTraficoCoche([0.80,0.80,0.82],true)); lista.push(obraTraficoCoche([0.35,0.42,0.55],true));
  return lista;
}
/* el carril: los coches van por la derecha DE LA PANTALLA (que es como se ve desde detrás) */
function carrilDe(c,i,s){ const lx=-c.tz[i]*s, lz=c.tx[i]*s, off=Math.min(c.ancho/4,3.2); return { x:-lx*off, z:-lz*off }; }
function ponTraficoEn(c,i,s,lejos){
  const car=carrilDe(c,i,s), v={ c, i, s, x:c.x[i]+car.x, z:c.z[i]+car.z, y:c.y[i], rumbo:Math.atan2(c.tx[i]*s,c.tz[i]*s),
    vel:(c.tipo==="autopista"?24:c.tipo==="ciudad"?13:16)*(0.8+Math.random()*0.4),
    velObj:0, malla:(Math.random()*8)|0, golpe:0, girado:0 };
  v.velObj=v.vel; TRAFICO.push(v); return v;
}
function traficoCorre(dt,C){
  const ev={};
  /* 🏁 EN CARRERA NO HAY TRÁFICO AJENO: la calle es solo para ti y tus rivales */
  if(typeof CARRERA!=="undefined" && CARRERA.activa){ if(TRAFICO.length) TRAFICO.length=0; return ev; }
  /* 1) los que se quedan lejos (o se salieron de su carretera) se van */
  for(let k=TRAFICO.length-1;k>=0;k--){ const v=TRAFICO[k];
    if(Math.hypot(v.x-C.x,v.z-C.z)>620) TRAFICO.splice(k,1);
  }
  /* 2) nacen nuevos entre 120 y 300 m, en carreteras cercanas y nunca encima de otro */
  let intentos=0;
  while(TRAFICO.length<TRAF_MAX && intentos++<30){
    const ang=Math.random()*TAU, d=110+Math.random()*380;
    const q=carreteraCerca(C.x+Math.cos(ang)*d, C.z+Math.sin(ang)*d, 40);
    if(!q || q.d>q.c.ancho/2+6 || q.c.tipo==="tierra") continue;
    const s=Math.random()<0.5?1:-1, car=carrilDe(q.c,q.i,s), px=q.c.x[q.i]+car.x, pz=q.c.z[q.i]+car.z;
    if(Math.hypot(px-C.x,pz-C.z)<90) continue;
    if(TRAFICO.some(o=>Math.hypot(o.x-px,o.z-pz)<28)) continue;
    ponTraficoEn(q.c,q.i,s,true);
  }
  /* 3) se mueven por su carretera, frenando si tienen a alguien delante */
  for(const v of TRAFICO){
    const n=v.c.n, idx=k=>v.c.cerrada?((k%n)+n)%n:k;
    let frena=1;
    for(const o of TRAFICO){ if(o===v) continue;
      const dx=o.x-v.x, dz=o.z-v.z, delante=dx*Math.sin(v.rumbo)+dz*Math.cos(v.rumbo), lado=Math.abs(dx*Math.cos(v.rumbo)-dz*Math.sin(v.rumbo));
      if(delante>0 && delante<22 && lado<2.6) frena=Math.min(frena,clamp((delante-6)/16,0,1)); }
    /* y también frena si TÚ estás delante parado en su carril */
    { const dx=C.x-v.x, dz=C.z-v.z, delante=dx*Math.sin(v.rumbo)+dz*Math.cos(v.rumbo), lado=Math.abs(dx*Math.cos(v.rumbo)-dz*Math.sin(v.rumbo));
      if(delante>0 && delante<20 && lado<2.8) frena=Math.min(frena,clamp((delante-5)/15,0,1)); }
    v.vel+=((v.velObj*frena)-v.vel)*(1-Math.exp(-dt*2.5));
    /* avanza por las muestras de la carretera */
    let queda=v.vel*dt;
    while(queda>0){
      const sig=idx(v.i+v.s);
      if(!v.c.cerrada && (sig<0||sig>=n)){ v.s*=-1; v.rumbo+=Math.PI; break; }   /* al final, da la vuelta */
      const paso=Math.hypot(v.c.x[sig]-v.c.x[v.i], v.c.z[sig]-v.c.z[v.i]) || MUESTRA;
      if(queda<paso) break;
      v.i=sig; queda-=paso;
    }
    const car=carrilDe(v.c,v.i,v.s);
    v.x=v.c.x[v.i]+car.x; v.z=v.c.z[v.i]+car.z; v.y=sueloEn(v.x,v.z).y;
    v.rumbo=Math.atan2(v.c.tx[v.i]*v.s, v.c.tz[v.i]*v.s)+v.girado;
    v.girado*=Math.exp(-dt*1.5); v.golpe=Math.max(0,v.golpe-dt);
  }
  /* 4) chocarte con uno, o pasar rozando */
  const vel=Math.hypot(C.vx,C.vz);
  for(const v of TRAFICO){
    const dx=C.x-v.x, dz=C.z-v.z, d=Math.hypot(dx,dz);
    if(d<3.3){
      const nx=dx/(d||1), nz=dz/(d||1), vn=C.vx*nx+C.vz*nz-(Math.sin(v.rumbo)*v.vel*nx+Math.cos(v.rumbo)*v.vel*nz);
      if(vn<0){
        C.x=v.x+nx*3.4; C.z=v.z+nz*3.4;
        C.vx-=nx*vn*1.25; C.vz-=nz*vn*1.25; C.vx*=0.80; C.vz*=0.80;
        v.vel*=0.55; v.girado+=(Math.random()-0.5)*0.5; v.golpe=1;
        ev.choque=Math.max(ev.choque||0,-vn); C.golpe=Math.min(1,-vn/22); C.derrapando=false;
      }
    } else if(d<5.2 && vel>22) ev.cerca=true;
  }
  return ev;
}
/* 🚦 ¿vas por el carril contrario? (el truco SENTIDO CONTRARIO del video) */
function vasAlReves(C){
  const q=C.sobre; if(!q || !q.c || q.c.tipo==="tierra" || q.c.ancho<9) return false;
  /* se compara con el EJE de la carretera (no con el centro del carril): al abrirte en una curva no
     parpadea. Y en el juego además tiene que durar más de un tercio de segundo */
  const j=(q.i+1)%q.c.n;                                      /* el punto EXACTO que tienes al lado */
  const bx=lerp(q.c.x[q.i],q.c.x[j],q.t)-C.x, bz=lerp(q.c.z[q.i],q.c.z[j],q.t)-C.z;
  const derecha=-Math.cos(C.rumbo)*bx+Math.sin(C.rumbo)*bz;   /* >0: el eje te queda a la derecha */
  return derecha>Math.max(2.0,q.c.ancho*0.22);         /* metido de verdad en el carril de los que vienen,
                                                          no solo rozando el eje al recortar una curva */
}

/* ================= 🚓 LA POLICÍA =================
   Patrullas que circulan como el tráfico. Si pasas volando a su lado (o te las llevas por delante) se
   lanzan a por ti: sirena, luces, embestidas y refuerzos por niveles. O los despistas (y cobras) o te
   pillan parado (y pagas) */
const POLICIA={ nivel:0, calor:0, coches:[], escape:0, parado:0, aviso:0, t:0, despistados:0, pillado:0, tregua:0 };
const POLI_MALLA=8;                                  /* la malla 8 de la lista del tráfico */
const POLI_VMAX=[0,43,48,52];                        /* 🚓 m/s por nivel (155, 173 y 187 km/h): van MAS DESPACIO que tu coche (236) */
/* 🚓 el coche patrulla: blanco con las puertas negras, barra de luces y el rótulo */
function obraPoliciaMalla(){
  const O=new Obra(), blanco=[0.86,0.87,0.9], negro=[0.05,0.05,0.06], EXT=[0.6,0], vidrio=[0.05,0.07,0.09];
  const L=4.6, W=1.86, H=0.8;
  O.caja(0,0.34,0,W,H,L,blanco,EXT);
  O.caja(0,0.34+H,-0.25,W*0.92,0.74,L*0.46,vidrio,[0.9,0]);
  O.caja(0,0.34+H+0.71,-0.25,W*0.86,0.06,L*0.42,blanco,EXT);
  for(const sx of [-1,1]) O.caja(sx*(W/2-0.01),0.5,0.1,0.03,0.55,1.9,negro,EXT);          /* las puertas negras */
  O.caja(0,0.34+H-0.02,L/2-0.55,W*0.96,0.05,0.9,negro,EXT);                                  /* el capó negro */
  O.caja(0,0.34+H+0.77,-0.2,1.3,0.16,0.34,[0.1,0.1,0.12],[0.3,0]);                           /* la barra */

function rivalCorre(R,dt,C){

  /* no se come al de delante (ni a ti) */
  for(const O of RIVALES.concat([{x:C.x,z:C.z}])){ if(O===R) continue; const dx=O.x-R.x, dz=O.z-R.z, ade=dx*Math.sin(R.rumbo)+dz*Math.cos(R.rumbo), lado=Math.abs(dx*Math.cos(R.rumbo)-dz*Math.sin(R.rumbo));

  /* 🐛 antes se tiraba la fracción de tramo cada fotograma y los rivales se quedaban clavados en la salida */
  const pasoDe=i=>{ const j=idxRuta(c,i+s); return Math.hypot(c.x[j]-c.x[i],c.z[j]-c.z[i])||MUESTRA; };
  let queda=R.vel*dt+R.t*pasoDe(R.i); R.acum+=R.vel*dt; R.t=0;

}
function carreraCorre(dt,C){

  if(A.rutaT<=0){ A.rutaT=1.5; if(typeof ponRuta==="function") ponRuta(rutaDeCarreraDesde(def,A.ultimoI,700),[0.45,0.12,0.85]); }

  if(A.t<0){ const q=Math.ceil(-A.t); if(q<A.cuenta&&q>=1){ A.cuenta=q; avisa(String(q),"#fff",0.9); pitido(660,0.15); }
    C.vx=C.vz=0; for(const R of RIVALES){ R.x=R.x; } return ev; }
  if(A.cuenta!==0){ A.cuenta=0; avisa("¡YA!","#c8ff2e",1); pitido(1320,0.4); }
  A.tiempo+=dt;

/* ================= 🔧 LAS MEJORAS DEL GARAJE =================
   El dinero que ganas en los eventos, las carreras y despistando a la policía se gasta aquí.
   Cuatro piezas, cuatro niveles cada una, y cada nivel cuesta más que el anterior */
const MEJORAS=[
  { id:"motor",  nom:"MOTOR",  icono:"⚙️", dice:"más punta y más empuje" },
  { id:"nitro",  nom:"NITRO",  icono:"🔥", dice:"empuja más y dura más" },
  { id:"agarre", nom:"AGARRE", icono:"🛞", dice:"se pega más en las curvas" },
  { id:"frenos", nom:"FRENOS", icono:"🛑", dice:"frena mucho antes" }
];
const MEJ_MAX=4, MEJ_PRECIOS=[4000,9000,18000,32000];
/* lo que hace cada nivel (multiplicadores que usa la física) */
const MEJ={ vmax:1, acel:1, agarre:1, freno:1, nitroGasto:1, nitroEmpuje:1 };
function nivelMejora(id){ return clamp((AJUSTES.mejoras&&AJUSTES.mejoras[id])|0,0,MEJ_MAX); }
function precioMejora(id){ const n=nivelMejora(id); return n>=MEJ_MAX?null:MEJ_PRECIOS[n]; }
function aplicaMejoras(){
  const m=nivelMejora("motor"), n=nivelMejora("nitro"), a=nivelMejora("agarre"), f=nivelMejora("frenos");
  MEJ.vmax=1+m*0.045; MEJ.acel=1+m*0.075;
  MEJ.nitroEmpuje=1+n*0.09; MEJ.nitroGasto=1-n*0.13;
  MEJ.agarre=1+a*0.10; MEJ.freno=1+f*0.13;
}
function compraMejora(id){
  const p=precioMejora(id);
  if(p===null){ avisa("YA ESTÁ AL MÁXIMO","#b46bff",1.6); return false; }
  if(AJUSTES.dinero<p){ avisa("TE FALTAN $ "+(p-Math.round(AJUSTES.dinero)).toLocaleString("es-CL"),"#ff4a5a",2); pitido(180,0.25,"sawtooth"); return false; }
  AJUSTES.dinero-=p; AJUSTES.mejoras=AJUSTES.mejoras||{};
  AJUSTES.mejoras[id]=nivelMejora(id)+1; guardaAjustes(); aplicaMejoras();
  const M=MEJORAS.find(x=>x.id===id);
  avisa(M.icono+" "+M.nom+" NIVEL "+nivelMejora(id),"#c8ff2e",2.2); pitido(880,0.15); setTimeout(()=>pitido(1320,0.25),120);
  return true;
}

function m4Coche(x,y,z,rumbo,cab,alab){
